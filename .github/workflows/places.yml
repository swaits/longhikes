name: Places

# The monthly check that every record's places still match the published outlines. It downloads
# every outline again (no cache is kept between runs, and --refresh clears any there is), measures every track again and fails with the list of differences.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/place_trails.requirements.txt
      - run: python tools/place_trails.py --check --refresh
