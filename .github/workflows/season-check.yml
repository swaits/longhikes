name: Season check

# Once a month, check offline that every estimated season is still on the track or location it
# was estimated for. Nothing is downloaded: the climate normals are a fixed published dataset. A
# failure lists the estimates whose inputs have changed; see docs/audit.md.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/estimate_season.py check
