[hike]
summary = "The Across Utah Route crosses southern Utah from the Nevada and Utah state line to the Utah and Colorado state line in approximately 700 miles. The author presents it as a suggested route with alternates in ten sections through Zion, Bryce Canyon, the Paria country, the Kaiparowits Plateau, the Escalante canyons, the Henry Mountains, Canyonlands and the La Sal Mountains. It links official trails, documented wilderness routes, 4x4 tracks, old mining roads and cross-country stretches, and the author says it needs strong route-finding skills."
official_url = "http://www.acrossutah.com/wordpress/the_route/"
start = "Nevada and Utah state line, Utah"
end = "Utah and Colorado state line, Utah"
shape = "point-to-point"
terrain = ["desert", "canyon", "alpine"]
travel = "some-cross-country"
caution = "The author says no part is technical, but the route involves exposure, deep pools, long dry stretches and a Colorado River crossing that needs a packraft or a ride from a river party."
checked = "2026-11-20"
season = "April to June and September to October"
months = [4, 5, 6, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Desert heat in summer and snow in the Henrys, La Sals and Bryce country in winter leave spring and fall. Confidence: medium."

[[hike.source]]
url = "http://www.acrossutah.com/wordpress/the_route/"
publisher = "Jamal Green, Across Utah (the route's author)"
facts = ["summary", "official_url", "start", "end", "shape", "terrain", "travel", "caution"]

