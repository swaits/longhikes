[route]
creator = "Jamal Green"
line_policy = "unclear"
creator_words = "The Across Utah Route is not real. It’s not real in the sense that it is not an established route like the John Muir Trail or the Appalachian Trail. Instead, it’s just a personal passion of mine."
creator_words_url = "http://www.acrossutah.com/wordpress/the_route/"
note = "A suggested route with alternates in ten sections. The author calls it a Choose-your-own-Adventure type experience and says he hopes it offers inspiration rather than exact footsteps to follow. A rockfall in 2019 closed the route to the East Rim in Zion National Park, and the Canaan Mountain alternate is now the preferred route. The updated suggested route and alternates are shown on the author's Master Map, an online interactive map whose features are not made to easily download. The author offers a customized content pack of data on request and states no terms that allow his track to be passed on."

