[hike]
summary = "The Air Force Glacier Loop is a 120 km hiking loop in Quttinirpaaq National Park, Nunavut, that starts and ends at Tanquary Fiord Camp. It follows the guide's Air Force Glacier Return Hike up the Air Force River to Ekblaw Lake, then goes south along the Lewis River, up the Very River and down the Lupus River, and crosses the Macdonald River back to the camp. Parks Canada calls it the longest hike in the park and gives it 6 to 12 days. There are no established trails in the park, so hikers choose their own way and cross rivers."
official_url = "https://parks.canada.ca/pn-np/nu/quttinirpaaq/activ/randonnees-hiking"
start = "Tanquary Fiord Camp, Quttinirpaaq National Park, Nunavut"
start_lonlat = [-76.9, 81.4]
shape = "loop"
days = [6, 12]
season = "June to August"
months = [6, 7, 8]
season_basis = "estimate"
season_method = "At 81 degrees north the ground is snow-free only for a short summer, and rivers are highest in the warmest weeks and lowest at night; June to August is the window in which the park is visited. Confidence: low."
terrain = ["tundra", "alpine"]
travel = "mostly-cross-country"
permit = "Parks Canada says it is mandatory for all visitors to register and take part in an orientation session on arrival in the national park, and to de-register before leaving."
caution = "Parks Canada says there are no established trails in the park, that hikers should be experienced in wilderness travel and proficient with topographical maps, and must also be self-sufficient and capable of self-rescue, as rescue capabilities are limited and could take a week or more, and that the Macdonald River can be impossible to cross for extended periods. Its guide describes the loop along moraine and the Lupus River and does not ask hikers to cross a glacier: it says \"Do not cross the glaciers without glacier training and self rescue equipment\" and has hikers climb about 50 metres to bypass the Lupus Glacier. Its general glacier warning says to travel on glaciers only with avalanche and crevasse self-rescue training and gear."
checked = "2026-11-23"

