[hike]
summary = "Akshayuk Pass is a 97 km valley between mountains and ice that runs through Auyuittuq National Park on Baffin Island. Parks Canada describes it as the park's most popular destination for hiking and skiing. It has nine emergency shelters and no campgrounds or services."
official_url = "https://www.parks.canada.ca/pn-np/nu/auyuittuq/activ/randonnee-hiking"
start = "North Pangnirtung Fiord, Nunavut"
end = "Overlord, Nunavut"
shape = "point-to-point"
days = [8, 12]
terrain = ["alpine"]
travel = "mostly-cross-country"
permit = "Parks Canada's 2019 visitor information package says all visitors must attend a mandatory orientation session, register, pay the fees and get a park entry permit."
caution = "Parks Canada says there is no designated trail to follow, and the most rugged section, between Thor Peak and Glacier Lake, crosses glacier moraines and many rivers."
season = "Mid-July to early September"
months = [7, 8]
checked = "2026-11-19"

