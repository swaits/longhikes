attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 2654551: one route relation, main ways only."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "The published 420 km is the whole heritage corridor, which includes road and water sections; about 300 km of it is trail. The mapped trail is 322.4 km in 8 pieces. The track is kept as mapped."

[osm]
relation = 2654551
note = "Downloaded 2026-11-10; 28 ways in the main track. release.txt has the source and date."

[shield]
status = "no-logo-exists"
logo_source = ""
contact = "Province of British Columbia"
note = "The trail has no emblem of its own. Addresses checked: bcparks.ca/tweedsmuir-park/hiking (park text, one photograph, the BC Parks wordmark only), bcparks.ca home page, the BC Geographical Names records at apps.gov.bc.ca/pub/bcgnws/names/68181.html and 68161.html (name and history only), and Wikimedia Commons (no emblem file). The former Alexander Mackenzie Heritage Trail Association has no live site that was found, only archive records at Northern BC Archives. No trail marker artwork was found anywhere allowed."
logo_file = ""
logo_owner = "Province of British Columbia"

[verification]
verified = true
date = "2026-11-10"
measured_km = 322.4
difference_percent = -23.2
parts = 8
note = "OSM relation 2654551, 28 ways: 322.4 km in 8 parts, 23.2% short of the published 420 km. The pieces do not all join: OpenStreetMap is missing the connectors between them."

[hike]
summary = "The Alexander MacKenzie Heritage Trail follows the old Nuxalk-Carrier route across British Columbia from the Fraser River north of Quesnel to the Bella Coola Valley. It crosses the Interior Plateau and Tweedsmuir Provincial Park, where parts are isolated. The trail is unmarked, and most of it is not maintained."
official_url = "https://bcparks.ca/tweedsmuir-park/hiking/"
start = "Fraser and Blackwater Rivers confluence, north of Quesnel, British Columbia"
end = "Bella Coola Valley, British Columbia"
shape = "point-to-point"
days = [25, 30]
travel = "trail"
caution = "The trail is unmarked, and outside a few cleared sections in Tweedsmuir Park it has not been maintained."
checked = "2026-11-13"
season = "Late summer to early fall"
months = [8, 9]
season_basis = "source"

[[hike.source]]
