# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "alexander-mackenzie"
name = "Alexander MacKenzie Heritage Trail"
country = "CA"
regions = ["BC"]
length_km = 420
length_note = "420 km from the Blackwater River to Bella Coola, with a suggested hiking time of 25 to 30 days, as BC Parks gives it; the BC Geographical Names record gives the same figure."
tier = "regional"
designation = "Heritage trail under the Heritage Conservation Act (1987); forest recreation trail under the Forest Act (1987)"
wave = 1

[source]
