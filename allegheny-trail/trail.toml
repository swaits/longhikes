# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "allegheny-trail"
name = "Allegheny Trail"
short_name = "ALT"
short_name_url = "https://hikethealleghenytrail.org/"
country = "US"
regions = ["WV"]
length_km = 509
length_note = "316 mi, as the West Virginia Scenic Trail Association gives it on its about page ('this challenging and scenic 316-mile footpath running south from the Mason-Dixon Line through West Virginia and Virginia to the Appalachian Trail at Peters Mountain'). West Virginia State Parks gives 311 mi for the same trail, and an older page of its was reported to give 330 mi, counting the last 20 miles awaiting completion, which was not read again. Whether all of the 316 mi is built and walkable is not stated on the pages read."
tier = "regional"
designation = "West Virginia Scenic Trails Association"
wave = "held"
wave_note = "No usable whole track exists. OSM holds about 50 km of the 500 km trail in fragment relations, and the West Virginia Scenic Trails Association publishes no open track. What would fix it: a track from the Association, or complete OSM route mapping."

[source]
status = "osm-only"
publisher = "West Virginia Scenic Trails Association (publishes the trail; no open geometry found)"
url = "https://www.openstreetmap.org/relation/1772789"
discovery = "osm-relation-version: Overpass `rel(ID); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap relation, read through Overpass or a Geofabrik extract"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 1772789."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM 1772789."
source_checked = "2026-11-08"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "OSM holds only fragment relations (28.8 km in the named relation, 21.1 km more in alternates), about 50 km of 500 km. No usable whole track found on 2026-11-08."

[osm]
relation = 1772789
note = "Downloaded 2026-11-08; release.txt has the relation version and timestamp."

[shield]
status = "use-real-logo"
logo_source = "https://hikethealleghenytrail.org/wp-content/uploads/2026/05/Main_No_URL_Color_2.png"
contact = "West Virginia Scenic Trails Association"
note = "The trail's crest: a yellow A in a green rounded triangle, lettered Allegheny Trail and West Virginia's Longest Trail. It is the site icon at https://hikethealleghenytrail.org/, and the same A crest heads that site in a horizontal lockup. The file here is the largest stand-alone version on the site, reduced from 1273 px to 1024 px. No logo terms were found on the site."
logo_file = "shield.png"
logo_owner = "West Virginia Scenic Trails Association"

[verification]
verified = true
date = "2026-11-08"
measured_km = 28.8
difference_percent = -94.2
parts = 1
note = "OSM holds only fragment relations (28.8 km in the named relation, 21.1 km more in alternates), about 50 km of 500 km. No usable whole track found on 2026-11-08."

[hike]
summary = "The Allegheny Trail runs south through West Virginia from the Mason-Dixon Line at the Pennsylvania border to the Appalachian Trail on Peters Mountain, near the Virginia border. It crosses rugged mountains and river valleys, with long stretches in the Monongahela National Forest. It is built and kept by volunteers."
official_url = "https://hikethealleghenytrail.org/"
start = "Mason-Dixon Line, West Virginia"
end = "Peters Mountain, West Virginia"
shape = "point-to-point"
terrain = ["forest"]
season = "About nine months of the year, avoiding winter"
months = [3, 4, 5, 6, 7, 8, 9, 10, 11]
checked = "2026-11-13"
season_basis = "primary"

[[hike.source]]
url = "https://hikethealleghenytrail.org/about"
publisher = "West Virginia Scenic Trails Association"
facts = ["official_url", "summary", "start", "end", "shape"]

[[hike.source]]
url = "https://hikethealleghenytrail.org/go-hiking/"
publisher = "West Virginia Scenic Trails Association"
facts = ["summary", "terrain"]

[[hike.source]]
url = "https://hikethealleghenytrail.org/hike/thru-hike/"
publisher = "West Virginia Scenic Trails Association"
facts = ["season", "months"]

[[link]]
title = "Allegheny Trail"
publisher = "LongTrailsWiki"
url = "https://www.longtrailswiki.net/wiki/Allegheny_Trail"

