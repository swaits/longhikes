note = "A loop of about 330 miles linking the Appalachian Trail (about 135 mi, Clingmans Dome to Flat Top Road near Spivey Gap), the Mountains-to-Sea Trail (about 155 mi, Clingmans Dome to Mount Mitchell), the Black Mountain Crest Trail (about 12 mi) and a Burnsville Connector (about 26 mi, of which about 18 mi are paved roads and sidewalks). The page says Pharr Davis helped Blood come up with the idea. The page says its authors plan finished maps as printed copies at the Burnsville Visitor Center, online and in apps."

