[shield]
status = "use-real-logo"
logo_source = "https://upload.wikimedia.org/wikipedia/commons/2/24/Appalachian_Trail_Marker_Logo.svg"
contact = "NPS Appalachian NST office; Appalachian Trail Conservancy"
note = "The official Appalachian National Scenic Trail marker: a rounded triangle with the AT symbol, 'APPALACHIAN TRAIL / NATIONAL SCENIC TRAIL'. Taken from Wikimedia Commons file 'Appalachian Trail Marker Logo.svg' (a vector copy, public domain as US Government work), whose page gives nps.gov/appa as its origin. nps.gov/appa did not show the marker when read, so the match to the holder's own site was not seen. It replaces the earlier file, which was the Conservancy's own emblem. Federal insignia rules still apply."
logo_file = "shield.svg"
logo_owner = "NPS Appalachian National Scenic Trail office"

[verification]
verified = true
date = "2026-11-08"
