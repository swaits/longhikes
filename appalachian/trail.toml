attribution = "National Park Service Appalachian National Scenic Trail & Appalachian Trail Conservancy"
osm_only = false
mainline = "One layer, 3,027 features, all 'Official A.T. Route'. No alternates or side trails in the layer; one stray 'Webcliff' feature to filter by name."
