[[history]]
date = "2026-11-16"
change = "The name hikers use, Appalachian Trail, was added as the common name. The recorded name is unchanged."
fields = ["common_name"]
basis = "The National Park Service page for the trail opens its description with 'The Appalachian Trail is a 2,190+ mile long public footpath' and also uses the formal name."
basis_url = "https://www.nps.gov/appa/index.htm"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
