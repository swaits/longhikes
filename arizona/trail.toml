start = "Mexico border, Arizona"
end = "Utah border, Arizona"
shape = "point-to-point"
days = [43, 60]
season = "Northbound hikes start in February or March; southbound hikes start in mid-September or October"
months = [2, 3, 9, 10]
terrain = ["desert", "forest"]
travel = "trail"
permit = "Permits are generally not required for a hike along the whole trail, but overnight camping needs a permit in some places, such as Saguaro and Grand Canyon National Parks."
checked = "2026-11-13"
season_basis = "primary"

