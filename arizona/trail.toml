[hike]
summary = "The Arizona National Scenic Trail crosses Arizona from the Mexico border to the Utah border. It passes through desert, high forest and the Grand Canyon, and is divided into 43 numbered passages. Most people walk it in the spring or the fall to avoid desert heat and mountain snow."
