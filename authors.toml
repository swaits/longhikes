# Route authors, by the exact credit each route's record gives (`route.creator`). Fields are in
# docs/schema.md (the authors section).
#
# A route's credit is free text. An author with an entry here is a named person, a pair of people,
# or an organisation, and every exact credit that names them is listed, so one page lists all their
# routes:
#   - one person credited in several forms (Andrew Skurka, Brett Tucker);
#   - a credit that names two or more people ("Jake Blood and Jennifer Pharr Davis") is listed under
#     each of them, so the route is on each page and that route's row names who else is credited;
#   - a person credited in one form only, so that the page can mark them up as a person.
# `kind` is "person" (the default: one named person), "people" (human, but not one full name: a pair
# credited together, such as "John and Monica Chapman", or a pair known by one name, such as "Wilderness Mindset"; `name`
# is then the credit as written) or "organisation".
#
# The words about an author are for people only, never for an organisation, an agency or an
# association (their own pages are a link away from each trail's page). A person or people entry may
# carry `url` (their own site), `summary` (one sentence of at most 160 characters that begins with
# the name), `bio` (one paragraph of 40 to 130 words), `checked` (YYYY-MM-DD) and one or more
# [[author.source]] tables (`url`, `publisher`): the pages the summary and bio were read on. A
# summary or bio needs both `checked` and a source. An organisation may carry `url`, and nothing else
# about itself. Wording is ours: nothing is copied from a source.
#
# A credit that has no entry stands alone as its own author and is not marked up as a person.

[[author]]
name = "Andrew Skurka"
credits = [
  "Andrew Skurka",
  "Andrew Skurka and Ryan Jordan",
]
url = "https://andrewskurka.com/"
summary = "Andrew Skurka is a long-distance backpacker, guide and author, first to complete the Great Western Loop, the Sea-to-Sea Route and the Alaska-Yukon Expedition."
bio = "Skurka was the first person to complete the Sea-to-Sea Route, the Great Western Loop and the Alaska-Yukon Expedition. The Great Western Loop took 208 days in 2007 and covers 6,875 miles. The Alaska-Yukon Expedition covered 4,700 miles in six months. He has hiked more than 30,000 miles. Backpacker named him Person of the Year in 2005, and National Geographic Adventure named him Adventurer of the Year in 2007. He wrote The Ultimate Hiker's Gear Guide, published by National Geographic, and sells guides to high routes in the Sierra Nevada, the Wind River Range and the Colorado Front Range. Skurka Adventures leads guided trips and courses in Utah, Alaska, the High Sierra and Yellowstone. The best known of his backpacking recipes, Skurka Beans and Rice, has inspired T-shirts and bumper stickers."
checked = "2026-11-17"

