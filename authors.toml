# Route authors, by the exact credit each route's record gives (`route.creator`). Fields are in
# docs/schema.md (the authors section).
#
# A route's credit is free text. An author with an entry here is a named person or organisation, and
# every exact credit that names them is listed, so one page lists all their routes:
#   - one person credited in several forms (Andrew Skurka, Brett Tucker);
#   - a credit that names two or more people ("Jake Blood and Jennifer Pharr Davis") is listed under
#     each of them, so the route is on each page and each page says who else is credited. Only people
#     the credit names in full are given an entry: "John and Monica Chapman" and "Amy and James
#     (Doing Miles)" give no full name for each, so they stand as written, as one author;
#   - a person credited in one form only, so that the page can mark them up as a person. `kind`
#     is "person" (the default) or "organisation".
# A credit that has no entry stands alone as its own author and is not marked up as a person: a
# nickname, a company, an association and "the author of a blog" are all left that way.

[[author]]
name = "Andrew Skurka"
credits = [
  "Andrew Skurka",
  "Andrew Skurka and Ryan Jordan",
]

[[author]]
name = "Ryan Jordan"
credits = ["Andrew Skurka and Ryan Jordan"]

[[author]]
name = "Brett Tucker"
credits = [
