# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "avon"
name = "Avon Trail"
country = "CA"
regions = ["ON"]
length_km = 130
length_note = "130 km, from the Avon Trail Association page"
tier = "regional"
designation = "Avon Trail Association"
wave = 1
places_checked = "2026-11-20"
places_track = "ca751ef57d29015f"

[source]
status = "osm-only"
publisher = "Avon Trail Association (publishes the trail; no open geometry found)"
publisher_url = "https://avontrail.ca/"
url = "https://www.openstreetmap.org/relation/3442182"
discovery = "osm-relation-version: Overpass `rel(3442182); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 3442182."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 3442182: one route relation, main ways only, with no member roles. The relation holds two ways between the same two points near Wildwood Lake, east of St. Marys: a 10.4 km way by the Wildwood Trail, service roads and Perth Line 9, and an 11.4 km way by the Wildwood Trail and 29th Line. No page read says which is the Avon Trail, so the track keeps the shorter, and the 11.4 km way is in alternates.geojson. A town block at St. Jacobs, mapped twice (0.4 km), moved too. The relation also carries named loops that leave the trail and return to it (the Periwinkle Loop, the Harmony Loop and a path loop at Stratford), which are not splits and are left in the track."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "The measured track is 16.9% longer than the published 130 km. The relation carries no side-trail roles, so the difference is either reroutes or side paths mapped into the route: the track still holds three loops that leave the trail and return to it, about 9 km in all. The one doubled stretch, 11.4 km near Wildwood Lake, is in alternates.geojson."

[osm]
relation = 3442182
note = "Downloaded 2026-11-10; 460 ways in the main track. release.txt has the source and date. Re-cut 2026-11-16: the main track is 436 ways and 24 ways are in alternates."

[shield]
status = "use-real-logo"
logo_source = "https://avontrail.ca/wp-content/uploads/2025/04/cropped-Avon-Trail_Logo_Horizontal-1-1.png"
contact = "Avon Trail Association"
note = "The trail's roundel: a white swan in a green circle. It is shown in use in the header of https://avontrail.ca/, set beside the words The Avon Trail as type. Cropped from that header logo; the wording beside the roundel was cut off. No logo terms were found on the site."
logo_file = "shield.png"
logo_owner = "Avon Trail Association"

[verification]
verified = true
date = "2026-11-16"
measured_km = 152.0
difference_percent = 16.9
parts = 18
note = "OSM relation 3442182, 436 ways: 152.0 km in 18 parts, 16.9% more than the published 130 km. The earlier track, 163.8 km in 6 parts, held two ways near Wildwood Lake; the other way, 11.7 km with a short town block, is in alternates.geojson. The pieces do not all join: OpenStreetMap is missing the connectors between them."

[hike]
summary = "The Avon Trail follows the Avon River and its streams through southwestern Ontario, from St. Marys to Conestogo. It crosses gently rolling farmland and is mostly off road, with a few stretches on back roads and through small towns. Fourteen side trails branch off it."
official_url = "https://avontrail.ca/"
start = "St. Marys, Ontario"
end = "Conestogo, Ontario"
shape = "point-to-point"
terrain = ["farmland"]
travel = "trail"
checked = "2026-11-20"
season = "April to October"
months = [4, 5, 6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Winter snow and early-spring mud on Ontario farmland end with the thaw, and the walk runs until late fall. Confidence: medium."

[[hike.source]]
url = "https://avontrail.ca/"
publisher = "Avon Trail Association"
facts = ["official_url", "start", "end", "shape"]

[[hike.source]]
url = "https://avontrail.ca/about/"
publisher = "Avon Trail Association"
facts = ["summary", "start", "end", "terrain", "travel"]

[[hike.source]]
url = "https://www.chelsa-climate.org/datasets/chelsa_climatologies"
publisher = "WSL (CHELSA) and NOAA NCEI (ETOPO)"
facts = ["season", "months"]

