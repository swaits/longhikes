note = "An official trail marker exists but no usable artwork for it was found at an allowed source. Looked at https://www.nps.gov/samo/planyourvisit/backbonetrail.htm and the National Park Service map graphic and information graphic linked from it; they show the National Park Service arrowhead (the agency's mark), maps and photographs, but no Backbone Trail emblem artwork. That an emblem exists is shown by the Western National Parks Association's National Park Service-approved Backbone Trail pin, described at https://store.wnpa.org/products/santa-monica-mountains-national-rec-area-pin-backbone-trail-033220 as bearing 'the official plump triangle trail marker for the Backbone Trail'; a merchandise shop is not an allowed source, so nothing was taken from it."
