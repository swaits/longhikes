discovery = "arcgis-query-hash: GET <url>/query with where upper(trail_name) like '%BARTRAM%' (outSR=4326, f=geojson); hash the answer body and count its rows; fetch again when either changes. 7 Forest Service features on 2026-11-19, 3 used."
format = "ArcGIS MapServer layer 0 (Forest Service, National Forest System Trails), outSR=4326, f=geojson, 3 features used: trail 164, TR67-11 and TR67-02"
crs = "EPSG:4326"
licence = "us-gov-public-domain"
licence_text = "United States federal government work, public domain in the United States under 17 U.S.C. 105. The USDA Forest Service metadata for its trails dataset (https://data.fs.usda.gov/geodata/edw/edw_resources/meta/Trans_Trail_NFS_Publish.xml, read 2026-11-16) gives access constraints 'None' and, as use constraints, only a disclaimer of warranty and liability. The layer states copyright text 'USDA Forest Service'; it is a dataset made by federal employees, a federal government work. The National Park Service's statement of the same rule: 'Data and content created by government employees within the scope of their employment are not subject to domestic copyright protection under 17 U.S.C. 105.' (https://irma.nps.gov/DataStore/Reference/Profile/2311077, read 2026-11-18)."
attribution = "USDA Forest Service"
osm_only = false
mainline = "One track from the Forest Service's own lines for the Bartram Trail, from Russell Bridge, Georgia, to Cheoah Bald, North Carolina, in 3 features. Trail 164, named BARTRAM (Chattahoochee-Oconee National Forest, managing unit 080306, 4 parts, 57.5 km on the track), carries the Georgia end; trail TR67-11, named BARTRAM NRT - NANTAHALA RD (Nantahala National Forest, unit 081111, 110.4 km), carries the trail across North Carolina; trail TR67-02, named BARTRAM NRT - CHEOAH RD (Cheoah Ranger District, unit 081102, 7.8 km), carries the climb to Cheoah Bald. All 3 carry the Bartram Trail's name in the layer and national trail designation 2; the Forest Service's page for the trail gives its number as TR67. The names TR67-11 and TR67-02 are the district's own labels; the layer's attributes show hiker use, not motor use, and native-material tread. Left out: trail 90 BARTRAM (Tuskegee National Forest, Alabama, 12.6 km, a different trail), the connector 213 BARTRAM CHATTOOGA CONNECTOR (1.2 km) and the Forest Service's TR67-02A BARTRAM TRAIL EXTENSION (13.9 km, west of Cheoah Bald, beyond the end of the trail). In the layer, trail 164 holds a short loop beside the through route at the Georgia state-line area (0.19 km), which the track leaves out. Near the association's Section 7 (Hickory Knoll Road to Wallace Branch) the track follows the Forest Service's line for the Bartram Trail, which differs from the OpenStreetMap line there (about 9.8 km on the layer against 5.4 km); the Forest Service's page gives that section as 15.2 miles by road and greenway, so part of the track near it runs along a road or greenway. The layer does not mark that stretch separately."
source_checked = "2026-11-19"
redistributable = true
line_source = "USDA Forest Service National Forest System Trails data"
line_file = "line.geojson"
length_gap_note = "The track is 175.6 km in 1 part, 2.5% under the published 180 km (112 mi), which the Forest Service's page and the Blue Ridge Bartram Trail Conservancy give. The Forest Service's line is traced in more detail than OpenStreetMap's, which measured 164.2 km, 8.8% under, over the same ground. The Chattahoochee-Oconee line and the Nantahala line stop 75 m apart near the state line; the gap is left open in the file."

