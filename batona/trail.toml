# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "batona"
name = "Batona Trail"
country = "US"
regions = ["NJ"]
length_km = 80
length_note = "50 mi, from the trail map published by the Pinelands Preservation Alliance"
tier = "regional"
designation = "Batona Hiking Club; New Jersey State Park Service"
wave = 1
places_checked = "2026-11-20"
places_track = "c32400a064848c42"

[source]
status = "osm-only"
publisher = "Batona Hiking Club (publishes the trail with the New Jersey State Park Service; no open geometry found)"
publisher_url = "https://batona.wildapricot.org/"
url = "https://www.openstreetmap.org/relation/4129027"
discovery = "osm-relation-version: Overpass `rel(4129027); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 4129027."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 4129027: one route relation, main ways only."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 4129027
note = "Downloaded 2026-11-10; 100 ways in the main track. release.txt has the source and date."

[shield]
status = "no-logo-exists"
logo_source = ""
contact = "Batona Hiking Club"
note = "The trail has no emblem of its own. It is marked with plain pink blazes, which are not an emblem. Addresses checked: batona.wildapricot.org home page and its page source (only the site theme's default logo and a text title), the New Jersey DEP Wharton State Forest trails brochure PDF at dep.nj.gov (the address returned a short HTML page, not the PDF), the older Batona map address njparksandforests.org/parks/docs/batona14web.pdf (also returned HTML, not a PDF), and Wikimedia Commons (none). Ask the club before using any mark."
logo_file = ""
logo_owner = "Batona Hiking Club"

[verification]
verified = true
date = "2026-11-10"
measured_km = 84.8
difference_percent = 6.0
parts = 1
note = "OSM relation 4129027, 100 ways: 84.8 km in 1 part, 6.0% more than the published 80 km."

[hike]
summary = "The Batona Trail is a long trail through the New Jersey Pinelands that links three state forests: Brendan T. Byrne, Wharton and Bass River. The land is relatively flat with some low hills, mostly pine and oak forest with lowland wetlands. Its name is short for Back to Nature."
official_url = "https://batona.wildapricot.org/"
start = "Brendan T. Byrne State Forest, New Jersey"
end = "Bass River State Forest, New Jersey"
shape = "point-to-point"
high_point = "Apple Pie Hill"
terrain = ["forest"]
travel = "trail"
checked = "2026-11-20"
season = "October to April"
months = [1, 2, 3, 4, 10, 11, 12]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Flat Pine Barrens walking has no high ground to wait out, so the cool months are the season; summer brings heat, ticks and biting flies. Confidence: medium."

[[hike.source]]
url = "https://batona.wildapricot.org/"
publisher = "Batona Hiking Club"
facts = ["official_url"]

[[hike.source]]
url = "https://dep.nj.gov/wp-content/uploads/parksandforests/Wharton-Trails.pdf"
publisher = "New Jersey State Park Service"
facts = ["summary", "terrain"]

[[hike.source]]
url = "https://dep.nj.gov/wp-content/uploads/parksandforests/BassRiver-Trails.pdf"
publisher = "New Jersey State Park Service"
facts = ["summary", "start", "end", "shape", "travel"]

[[hike.source]]
url = "https://dep.nj.gov/wp-content/uploads/parksandforests/docs/sps/batona-map-2026.pdf"
publisher = "New Jersey State Park Service"
facts = ["high_point"]

[[hike.source]]
url = "https://www.chelsa-climate.org/datasets/chelsa_climatologies"
publisher = "WSL (CHELSA) and NOAA NCEI (ETOPO)"
facts = ["season", "months"]

