length_km = 772
length_note = "480 mi, the official miles the Bayou State Trail Association gives on its news, about, membership and 480 Club pages; its trails page gives three regions of about 140, 180 and 160 miles, which add up to 480. The association's home page calls the trail a 470 mile footpath, and its news and about pages say the hikeable route runs nearly 500 miles (the about page also says 500 miles). Its about page names Ivan Lake Recreation Area, north of Shreveport, as the northern start, and its home page names Bodcau Wildlife Management Area."
tier = "regional"
designation = "Bayou State Trail Association, a Louisiana non-profit (established 2021)"
wave = 1

