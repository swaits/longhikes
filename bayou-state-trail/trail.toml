note = "The association's round badge: a pine tree and a sunburst in purple, green and gold rings, with the words Bayou State Trail Association above and Established 2021 below. It is the brand logo in the header of bayoustatetrail.com, and the association has no other mark for the trail, so it is used as the trail's emblem, as the Benton MacKaye Trail and the Pacific Northwest Trail do with their associations' roundels. The file is the original at 500 px, transparent, unaltered. No terms for use of the logo are stated on the site. Read 2026-11-16."
