[hike]
summary = "The Bayou State Trail crosses Louisiana from Bodcau Wildlife Management Area in the north to Morgan City in the south. It passes through public lands such as Kisatchie National Forest and Chicot State Park, then the Atchafalaya Basin and Cajun towns. The Bayou State Trail Association, formed in 2021, published the route in August 2024."
official_url = "https://www.bayoustatetrail.com/"
start = "Ivan Lake Recreation Area, Bodcau Wildlife Management Area, Louisiana"
start_lonlat = [-93.493, 32.831]
end = "Morgan City, Louisiana"
end_lonlat = [-91.207, 29.699]
shape = "point-to-point"
terrain = ["forest"]
caution = "The association does not say how much of the route is trail and how much is road or town walking. Its trails page, read on 2026-11-19, lists the Hwy 182 bridge over the Atchafalaya River, between Berwick and Morgan City, as closed, and gives a temporary southern end at the Berwick Branch Library, 3512 5th Street. The notice carries no date of its own and gives the reopening as fall 2026. Check with the association before going."
checked = "2026-11-20"
season = "November to April"
months = [1, 2, 3, 4, 11, 12]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Summer heat, humidity, mosquitoes and storms in Louisiana push hiking into the cool, dry winter and early spring. Confidence: medium."

