note = "Harkey describes a nine-day hike through Big Bend Ranch State Park by way of the Sauceda Bunkhouse and past Mexicano and Madrid Falls, then Lajitas, then Big Bend National Park over the Mesa de Anguila and the South Rim to the Chisos Basin. The Trek dates the first hike to January 2018. The authors' site for the route, bigbend100.com, is no longer online. The Big Bend Sentinel reported in 2023 that neither the state park nor the national park recognises or encourages this route."

