[hike]
summary = "The Big Bend 100 is a 100-mile route across two west Texas parks, Big Bend Ranch State Park and Big Bend National Park. It begins in the northwest panhandle of the state park, passes Lajitas between the parks, crosses the Mesa de Anguila and approaches the Chisos Mountains from the west, and ends in the Chisos Basin after the South Rim. Much of it follows old jeep roads, sandy arroyos, seldom used trails and cross-country stretches in Chihuahuan Desert country."
start = "Northwest panhandle of Big Bend Ranch State Park, Texas"
end = "Chisos Basin, Big Bend National Park, Texas"
shape = "point-to-point"
terrain = ["desert", "canyon"]
travel = "some-cross-country"
caution = "Harkey warns that the route has exceptional navigational challenges in rarely traveled parts of the parks, and that a hiker should never rely on desert water sources without a backup plan."
checked = "2026-11-16"
season = "November to February"
months = [11, 12, 1, 2]
season_basis = "source"

