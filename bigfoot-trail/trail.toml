line_policy = "sold"
creator_words = "The Bigfoot Trail was originally proposed by Michael Kauffmann in 2009 as a suggested route to navigate the Klamath Mountains from south to north as well as a long-trail to introduce nature lovers to the biodiversity of the Klamath Mountains region."
creator_words_url = "https://www.bigfoottrail.org/"
creator_words_by = "Bigfoot Trail Alliance"
note = "The Alliance, a non-profit, now promotes the route, organises volunteer and seasonal crews that work on it, and sells the mapset. Its route page calls it a proposed long-distance hiking route that connects existing trails, backcountry roads and public lands, and says it is not continuously maintained or consistently marked."

