# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "bigfoot-trail"
name = "Bigfoot Trail"
country = "US"
regions = ["CA", "OR"]
length_km = 579
length_note = "360 mi, per the Bigfoot Trail Alliance"
kind = "route"
tier = "regional"
designation = "Person-defined route (proposed by Michael Kauffmann, 2009), promoted and maintained by the Bigfoot Trail Alliance; no agency designation"
wave = 1

[source]
status = "none"
publisher = "Bigfoot Trail Alliance (publishes the route)"
publisher_url = "https://www.bigfoottrail.org/"
url = "https://www.bigfoottrail.org/route/guidebook/"
format = "No line included"
crs = "EPSG:4326"
licence = "none-stated"
licence_text = "No track is included, so no source licence applies to a track. This record names the creator and the pages its facts were read on (https://www.bigfoottrail.org/ and https://www.bigfoottrail.org/route/guidebook/, read 2026-11-14)."
attribution = "none (no line included)"
osm_only = false
mainline = "No track is included; the route is got from the Alliance's mapset, which is sold."
source_checked = "2026-11-14"
redistributable = true
line_source = "none (no line included)"
line_file = ""
line_absent_reason = "The Alliance sells the route as a 52-page mapset, printed or as a PDF, and states no licence that allows passing a track on. No track is included from any source. Get the route from the Alliance's mapset."

[osm]
relation = 0
note = "Not recorded: the route is sold, so no track is taken from any source."

[shield]
status = "use-real-logo"
logo_source = "https://bigfootdev2.wpengine.com/wp-content/uploads/2019/06/Header-300x300.gif"
contact = "Bigfoot Trail Alliance"
note = "A roundel reading Bigfoot Trail Alliance, with mountains, a road through conifers and a Bigfoot figure, shown on the Alliance's site bigfoottrail.org. The roundel is the Alliance's logo, and the organisation's name runs round the ring, so it is a close call. The file came from the site's staging host, bigfootdev2.wpengine.com, not the live address. Saved as PNG with transparent corners, unchanged."
logo_file = "shield.png"
logo_owner = "Bigfoot Trail Alliance"

[verification]
verified = false
note = "No line to measure."

[route]
creator = "Michael Kauffmann"
year = 2009
line_policy = "sold"
creator_words = "The Bigfoot Trail was originally proposed by Michael Kauffmann in 2009 as a suggested route to navigate the Klamath Mountains from south to north as well as a long-trail to introduce nature lovers to the biodiversity of the Klamath Mountains region."
creator_words_url = "https://www.bigfoottrail.org/"
creator_words_by = "Bigfoot Trail Alliance"
note = "The Alliance, a non-profit, now promotes the route, organises volunteer and seasonal crews that work on it, and sells the mapset. Its route page calls it a proposed long-distance hiking route that connects existing trails, backcountry roads and public lands, and says it is not continuously maintained or consistently marked."

