[hike]
summary = "The Bigfoot Trail is a long route through the Klamath Mountains of northwest California and, briefly, southwest Oregon. It runs from the Yolla Bolly-Middle Eel Wilderness north to the Pacific Ocean near Crescent City, through six wilderness areas, and is known for the many conifer species it passes. It is a rough route, not a continuously maintained trail."
official_url = "https://www.bigfoottrail.org/"
start = "Ides Cove, Yolla Bolly-Middle Eel Wilderness, California"
start_lonlat = [-122.829, 40.038]
end = "The Pacific Ocean near Crescent City, California"
end_lonlat = [-124.202, 41.756]
shape = "point-to-point"
terrain = ["forest"]
travel = "trail-and-road"
caution = "About 100 miles of the route are on seldom-used Forest Service roads, and some trail sections have gone unmaintained for years, so map and compass skills are needed."
checked = "2026-11-14"

