[hike]
summary = "The Boreal Trail crosses Meadow Lake Provincial Park in northwest Saskatchewan, from the Cold River campground in the west to the park office at Dorintosh in the east. It runs through boreal forest past lakes and links front-country campgrounds, with backcountry campsites between. The trail is marked with posts about every kilometre."
official_url = "https://tourismsaskatchewan.com/listings/900/meadow-lake-provincial-park-boreal-trail"
