terrain = ["forest", "lakes"]
travel = "trail"
permit = "Hikers camping along the trail need a Backcountry Permit, from the park office, any campground or entry gate, or online at parks.saskatchewan.ca."
caution = "Mosquitoes, blackflies and horseflies are most numerous from early May to the end of June and from late August to the end of September."
checked = "2026-11-14"

