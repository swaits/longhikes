[hike]
summary = "Boundary Trail #1 runs east in the Gifford Pinchot National Forest in Washington, from the Hummocks Trail near Johnston Ridge in the Mount St. Helens National Volcanic Monument to Council Lake. It follows timbered ridges and cirque basins with views of Mount St. Helens, Mount Rainier and Mount Adams, and at times Mount Hood. West of Bear Meadows it is open to hikers only, and east of Bear Meadows it is open to motorcycles, hikers, horses and bicycles."
official_url = "https://www.fs.usda.gov/r06/giffordpinchot/recreation/trails/trail-1-boundary"
start = "Hummocks Trail, near Johnston Ridge, Mount St. Helens National Volcanic Monument, Washington"
end = "Council Lake, Washington"
shape = "point-to-point"
terrain = ["alpine", "forest"]
travel = "trail"
permit = "Some trailheads that access this trail require a valid Recreation Pass, per the Forest Service."
caution = "East of Bear Meadows the trail is open to motorcycles as well as hikers, horses and bicycles. The Forest Service states the trail is closed to ATV use."
checked = "2026-11-20"
season = "July to October"
months = [7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Cascade ridges around 5,000 feet hold snow until July, and heavy rain starts in late October. Confidence: high."

[[hike.source]]
url = "https://www.fs.usda.gov/r06/giffordpinchot/recreation/trails/trail-1-boundary"
publisher = "USDA Forest Service, Gifford Pinchot National Forest"
