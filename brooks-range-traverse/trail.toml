change = "The trail was placed in Gates of the Arctic National Park and Preserve, Brooks Range, Gates of the Arctic Wilderness and Mollie Beattie Wilderness from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"In June of 2017 Sarah and I hiked and floated through the Arctic National Wildlife Refuge, the second leg (of three?) of our Brooks Range Traverse (2016: Gates of the Arctic National Park).\" (Gates of the Arctic National Park and Preserve) The page says: \"The Brooks Range, from Kivalina to Kaktovik, in three parts.\" (Brooks Range) The page says: \"fly to Anaktuvuk, float southwest on the John River, hike west to the Alatna River, float southeast on the Alatna to access the Arrigetch, cross the Arrigetch, float northwest on the Noatak River, hike southwest to the Ambler River, and float west to Ambler.\" (Gates of the Arctic Wilderness) The page says: \"As soon as we crossed the Wilderness boundary, we saw a lone Muskox.\" (Mollie Beattie Wilderness)"
basis_url = "https://thingstolucat.com/arctic-refuge-traverse/"
asked_by = "the dataset's own check"
outcome = "applied"
