[shield]
status = "use-real-logo"
logo_source = "https://brucetrail.org/wp-content/uploads/2022/07/BTC_arrow-icon.png"
contact = "Bruce Trail Conservancy"
note = "The emblem is the white arrow on a green diamond. The Conservancy's Basic Trail Maintenance Guide (development.brucetrail.org) says the diamond signs are installed to identify the route as the Bruce Trail, with white diamonds for the main trail, and calls it the Bruce Trail arrow, so the diamond is the trail's own marker and not only the Conservancy's logo. It is the left-hand element of the header lockup at brucetrail.org and is also posted on the trail itself. This file is the diamond alone from the Conservancy's own site (BTC_arrow-icon.png), trimmed with a small margin. At 238 px wide in the original it is below 256 px; no larger diamond-alone artwork was found on the site (the header lockup's diamond is smaller). It replaces the earlier file, which was the whole lockup. Also checked: brucetrail.org home and explore-the-trail pages and their page source, the membership brochure and campground PDFs, the Following-the-blazes graphic, and Wikimedia Commons (no emblem file)."
logo_file = "shield.png"
logo_owner = "Bruce Trail Conservancy"

