publisher = "Buckeye Trail Association (publishes the loop); the Ohio DNR MapServer requires a token"
url = "https://www.openstreetmap.org/relation/1738661"
discovery = "osm-relation-version: Overpass `rel(1738661); out meta;` over the super-relation and its section relations (versions and timestamps), or the Geofabrik replication diff; fetch again when any changes (super-relation v86, edited 2025-08-22)."
format = "OpenStreetMap super-relation with 28 section relations, read through Overpass or a Geofabrik extract"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 1738661."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
decision = "included-named"
decision_text = "Included with its name and logo. The track is from OpenStreetMap."
mainline = "The super-relation 1738661 holds 28 section relations (each named 'Buckeye Trail (<place>)'); their 4495 ways join into one loop. No alternates."
source_checked = "2026-11-08"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 1738661
note = "OSM 1738661 plus 28 section relations."

[shield]
status = "use-real-logo"
logo_source = "https://www.buckeyetrail.org/media/site/5f6f0e4a9e-1760709600/buckeye-trail-association-logo.svg"
contact = "Buckeye Trail Association"
note = "The trail's roundel: a blue ring lettered Buckeye Trail around a buckeye leaf and nuts. It is shown in use as the header logo at https://www.buckeyetrail.org/. Taken from the Association's SVG logo by deleting the two state-shape paths drawn behind the roundel and narrowing the viewBox to the roundel; the roundel's own paths are unchanged. No logo terms were found on the site."
logo_file = "shield.svg"
logo_owner = "Buckeye Trail Association"

[verification]
verified = true
date = "2026-11-08"
measured_km = 2371.8
difference_percent = 5.4
parts = 1
note = "The super-relation and its 4495 ways join into 1 continuous loop, 2,371.8 km, +5.4% over 2,250 km. The ODNR service still needs a token; OSM is the track used."

[hike]
summary = "The Buckeye Trail is a continuous loop around the state of Ohio, with no beginning or end. It links forests, farmland, parks, small towns and historic sites in every corner of the state. Volunteers of the Buckeye Trail Association keep it open."
