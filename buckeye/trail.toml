# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "buckeye"
name = "Buckeye Trail"
country = "US"
regions = ["OH"]
length_km = 2250
length_note = "about 1,400 mi loop"
tier = "regional"
designation = "Ohio's state-circling loop trail, Buckeye Trail Association"
wave = 1

[source]
