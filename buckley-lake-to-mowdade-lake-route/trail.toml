[hike]
summary = "The Buckley Lake to Mowdade Lake Route is a route of about 70 km across the volcanic plateaus of Mount Edziza Park in northwestern British Columbia, from Buckley Lake at the north end of the park south to Mowdade Lake. BC Parks says most of it is marked by cairns, that hikers find the way from cairn to cairn, and that it recommends a minimum of 7 days."
official_url = "https://bcparks.ca/mount-edziza-park/hiking/"
start = "Buckley Lake, Mount Edziza Park, British Columbia"
start_lonlat = [-130.778, 57.906]
end = "Mowdade Lake, Mount Edziza Park, British Columbia"
end_lonlat = [-130.429, 57.554]
shape = "point-to-point"
days = [7, 7]
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "No page states a season. The plateaus sit above treeline and are snowbound into early summer, and weather turns by September, so July to September was set by judgement from the climate and from similar trails. Confidence: medium."
terrain = ["alpine"]
travel = "mostly-cross-country"
caution = "BC Parks says weather can change extremely fast on the alpine plateaus, that water is scarce in places, that creek crossings may need scouting and can be difficult in high water, and that the high pass beyond Taweh Creek should not be crossed in severe weather. It lists the air charter companies permitted to fly to Buckley Lake or Mowdade Lake."
checked = "2026-11-23"

