regions = ["CA"]
length_km = 1931
length_note = "About 1,200 mi planned. The Coastal Commission gives the coast as about 1,230 miles and says the finished trail will exceed that because of parallel strands; it publishes no end-to-end length for the trail itself. About 875 mi, about 70 percent, is built."
built_km = 1408
tier = "regional"
designation = "State of California trail (Coastal Commission, State Coastal Conservancy)"
wave = "held"
wave_note = "It is mostly road and sidewalk."
places_checked = "2026-11-20"
places_track = "eb1ea92c2db5e1c7"

[source]
status = "verified"
publisher = "California Coastal Commission; Coastal Trails Alliance"
url = "https://services9.arcgis.com/wwVnNW92ZHUIr0V0/arcgis/rest/services/California_Coastal_Trail_April_2021/FeatureServer"
discovery = "arcgis-layer-edit-date: GET <layer>?f=json and read editingInfo.dataLastEditDate (and the feature count); fetch again when either changes. The Commission layer is dated April 2021; the Alliance item was updated 2026-10-20 ('Credit Required for Use')."
format = "The Commission layer is an ArcGIS FeatureServer, not downloaded. The track included is a CalTopo GPX 1.1 export attached by a hiker to the dataset's issue 1: 43 tracks of one segment each (9 section tracks and 34 optional or side tracks), 508 waypoints, no routes."
crs = "EPSG:4326"
licence = "CC-BY-4.0"
licence_text = "Two sources are named here and they have different terms. The Commission's layer is not used: its item states no licence and carries a disclaimer only (read 2026-11-09). The track included is a hiker's own and is shared under Creative Commons Attribution 4.0 International (CC BY 4.0). The hiker wrote on this dataset's public issue tracker on 2026-11-16: \"CC BY 4.0 sounds good, and your idea for the source and link work for me.\" (https://github.com/swaits/longhikes/issues/1#issuecomment-6928214012). The idea the hiker agreed to was to name the hiker as the source of the track, link the hiker's blog, and say plainly that the trail is incomplete and that the track follows the hiker's own choices where the official trail has gaps. The first file attached was a CalTopo error page, and the hiker attached the track again on 2026-11-17 (https://github.com/swaits/longhikes/issues/1#issuecomment-6935577911)."
attribution = "Track: Lauren Lake, PacificCoastalTrail blog (https://pacificcoastaltrail.wordpress.com), CC BY 4.0. It is one hiker's walk of the coast, not the official alignment. The trail itself: California Coastal Commission; State Coastal Conservancy; Coastal Trails Alliance."
osm_only = false
mainline = "The main track is one hiker's walk of the whole coast in eight section hikes, from the Oregon border to the Mexican border, with the hiker's own choices where the official trail is unfinished or closed. It is not the Coastal Conservancy's official alignment, and there is none for the whole trail. Section 8 is two tracks in the file (it is split at the Camp Pendleton closure), so the file gives nine section tracks, in file order. The file draws a straight line across water in four places, and each is cut so that the track has a gap there: Tomales Bay (5.0 km, where the hiker's note says a shuttle was used to the restart point at Point Reyes), Morro Bay (0.4 km, at the docks marked Docks/Kayak), the Balboa Island ferry (0.3 km) and the Coronado ferry (1.7 km, with four points drawn over the bay dropped). The hiker's walk does not cross the Camp Pendleton closure either: the 17.0 km between the end of section 8a and the start of 8b is a gap, and the file's own track of the closed section is left out. The track is in 13 pieces and 7 parts. The file's other 34 tracks are the hiker's optional and side routes (tide, river and road alternatives): 29 are in alternates.geojson and five are left out, four because the hiker labels them impassable, closed or a packraft option, and one because it duplicates the Old Coast Road in Big Sur."
source_checked = "2026-11-17"
redistributable = true
line_source = "A hiker's own walk of the coast (GPX file attached to the dataset's issue 1)"
line_file = "line.geojson"

