[hike]
summary = "The California Coastal Trail is a connected public trail system planned to run the length of the California coast. It uses beaches, bluff tops, hillsides, paved paths and sidewalks, and sometimes a road shoulder where nothing else is possible. About 70 percent has been built so far."
official_url = "https://www.coastal.ca.gov/coastal-trail/"
terrain = ["coast"]
travel = "trail-and-road"
unfinished = "The state counts about 875 miles, about 70 percent, as built along a coastline of about 1,230 miles, and there is no official through route. A hiker reports having walked the whole coast from end to end, in eight section hikes, by connecting the built parts with their own choices."
