length_note = "79.1 mi, as the book gives it for Trip 16, with 10,690 ft of climbing and no day count; the book rates it strenuous. It is a loop that ends by following the book's Trip 15 in reverse back to the trailhead, so the first 4.6 miles, from the Jerkey Meadow Trailhead to the Little Kern River bridge, are walked again at the end, and the book's figure includes that stretch both ways. The figures are the book's own and are not measured from a track."
