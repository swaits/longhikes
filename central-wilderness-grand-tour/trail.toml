note = "A loop from the Jerkey Meadow Trailhead at Lloyd Meadows by the Little Kern River, Deep Creek, Coyote Lakes, Coyote Lakes Pass, the Kern River at the Kern Canyon Ranger Station, Golden Trout Creek, Little Whitney Meadow, Templeton Meadows, Redrock Meadows, Jordan Hot Springs and Kern Flat, then back by the Trout Meadows trail, with 79.1 miles in the book. The book marks the Sequoia National Park boundary at Coyote Lakes Pass. The book's maps are the track; none is copied here."

