[hike]
summary = "The Central Wilderness Grand Tour is a backpacking loop of 79.1 miles in the Golden Trout Wilderness of the southern Sierra Nevada, California, from the Jerkey Meadow Trailhead at Lloyd Meadows. It crosses the Little Kern River and Coyote Lakes Pass to the Kern River, then returns by Templeton and Redrock Meadows and Kern Flat, using the two bridges over the main fork of the Kern. Suzanne Swedo describes it as Trip 16 in Hiking California's Golden Trout Wilderness."
official_url = "https://openlibrary.org/books/OL39988398M"
start = "Jerkey Meadow Trailhead, Lloyd Meadows, Golden Trout Wilderness, California"
start_lonlat = [-118.486, 36.168]
shape = "loop"
season = "July through October"
months = [7, 8, 9, 10]
terrain = ["forest", "alpine"]
travel = "trail"
permit = "The Forest Service says an overnight stay in the Golden Trout Wilderness requires a Golden Trout Wilderness Pass, and that overnight permits are free and issued at forest offices near the wilderness entry points."
caution = "The book rates the trip strenuous, calls it a real expedition with a lot of climbing and descent, and says to check with rangers that streams are safe to cross before early July. It describes a faint path and a very steep climb at mile 12.4, a descent through deep scree from Coyote Lakes Pass, and cow paths at Templeton Meadows where it is easy to lose the trail. It reports fords at Deep Creek and Hockett Peak Creek. As of 2026-11-19 the Forest Service pages for the Jerkey Meadow Trailhead and the Lewis Camp Trail, which leads to the Little Kern River suspension bridge, say that due to recent fires and flooding the trail may have washouts and downed trees and may intermittently disappear. The Sequoia and Inyo National Forest pages read list no closure for this country and give no condition for the Kern River bridges. The book dates from 2004, before the 2020 and 2021 fires there. The book mentions no cross-country travel, scrambling or rope."
checked = "2026-11-19"

