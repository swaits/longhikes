[hike]
summary = "The Central Wind Rivers Loop is a backpacking loop of six to ten days in the Bridger Wilderness in the central Wind River Range of Wyoming, from the Scab Creek trailhead. It passes Little Divide Lake and the Boulder Creek meadows, Sandpoint, Middle Fork and Rainbow lakes and the Halls Creek and North Fork country, with long stretches off the official trails. Douglas Lorain describes it as Trip 16 in Backpacking Wyoming."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-wyoming/"
start = "Scab Creek trailhead, Bridger Wilderness, Wyoming"
start_lonlat = [-109.558, 42.821]
shape = "loop"
days = [6, 10]
season = "Usually open July to October, best mid-July through August"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "some-cross-country"
permit = "None required, as the book states; it says to sign in at the trailhead."
caution = "The book calls this a long, rugged trip with several relatively long cross-country sections, most of them fairly easy, with sketchy use paths for much of the distance, and tells hikers to bring a good contour map and navigation skills. Thunderstorms are frequent and some stream crossings are involved, which the book calls relatively easy. It warns that the junction where the loop leaves the official trail near Bobs Lake is very hard to find if the loop is done in the opposite direction. Fires are prohibited above treeline, groups are limited to 15 people and 25 stock, and camping is prohibited within 100 feet of streams and 200 feet of lakes or trails. It describes one steep gully climb of about 300 feet. The author rates its difficulty 7 out of 10."
checked = "2026-11-18"
season_basis = "primary"

