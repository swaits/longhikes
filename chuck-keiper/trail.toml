[hike]
summary = "The Chuck Keiper Trail is a foot-only backpacking trail in Sproul State Forest in north-central Pennsylvania. It is a double loop, with an East Branch cross-connector that lets hikers walk a west loop or an east loop. It runs through two wild areas and two natural areas, with waterfalls and the remains of a splash dam."
