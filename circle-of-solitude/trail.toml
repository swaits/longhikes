[hike]
summary = "The Circle of Solitude is a loop of about 68 miles in Kings Canyon and Sequoia National Parks, California, from Road's End. It crosses Avalanche Pass, follows the Roaring River and Cloud Canyon to Colby Pass, then the Kern-Kaweah River to Junction Meadow in Kern Canyon, and returns by the John Muir Trail over Forester Pass and down Bubbs Creek. Mike White describes it in his Wilderness Press guidebooks."
start = "Road's End, Kings Canyon National Park, California"
start_lonlat = [-118.583, 36.795]
shape = "loop"
permit = "A Sequoia and Kings Canyon National Parks wilderness permit is needed for overnight travel on this loop."
checked = "2026-11-20"
season = "Mid-July to early October"
months = [7, 8, 9]
season_basis = "source"

