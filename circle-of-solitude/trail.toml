[route]
creator = "Mike White"
line_policy = "unclear"
note = "A loop from Road's End in Kings Canyon that circles the Great Western Divide and the Kings-Kern Divide by Avalanche Pass, Colby Pass and Forester Pass. Mike White named and described the loop in his Wilderness Press guidebooks. Two hikers' own accounts, from 2014, name the book they used as Mike White's Sequoia and Kings Canyon National Parks: Your Complete Hiking Guide (2012) and say the author named the loop; both walked it counter-clockwise, and their accounts agree on the order of places. Open Library's record of that 2012 book says it compiles the Kings Canyon and Sequoia National Park guides published in 2004, so the earlier Kings Canyon National Park: A Complete Hiker's Guide (2004, ISBN 9780899973357), also from Wilderness Press, is listed as the second guide; it is out of print at its publisher, so it links to a library record. The trip's number and page are given on no page read, in either book. The route is not in Sierra South (9th edition) or Backpacking California (3rd edition). No page of the author's was found, and no statement about a track."

