note = "No emblem of the route exists at an allowed source. The route is a named loop in Mike White's Wilderness Press guidebooks; fastestknowntime.com's page for the route (https://fastestknowntime.com/route/circle-solitude), which credits Mike White's guide, was read and shows no mark for this route, and the author publishes no route page of his own. A route known only as a guidebook name has no crest, badge or blaze of its own."
