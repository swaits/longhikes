[hike]
summary = "The Cohos Trail runs north through New Hampshire from southern Crawford Notch to the Canadian border at Pittsburg, through the White Mountains and the Great North Woods. It crosses steep cliffs, boreal forest and bogs, and parts follow old farm lanes and logging roads. There are no resupply points for a long stretch in the north."
official_url = "https://www.cohostrail.org/"
