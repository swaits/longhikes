[shield]
status = "use-real-logo"
logo_source = "https://www.cohostrail.org/wp-content/uploads/2015/01/cohos-trail-logo.jpg"
contact = "Cohos Trail Association"
note = "The Cohos Trail's own blaze emblem: yellow 'CT' letters on a brown twin-peaked shield, as painted on the trail's markers. It is the header logo at https://www.cohostrail.org/ . The file already held was that header image at 47x50 px; this is the same emblem at 72x80 px from the association's own media library, converted from JPEG to PNG with no other change. Nothing larger exists at an allowed source: the media library holds no bigger flat version, the 2025 guidebook PDF on the site contains no images, the databook cover shows the emblem smaller still, and the larger sticker images on the site are photographs of a sticker, not artwork. No terms for the logo were found on the holder's site. The cream surround was made transparent."
logo_file = "shield.png"
logo_owner = "Cohos Trail Association"

