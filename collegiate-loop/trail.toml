[hike]
summary = "The Collegiate Loop is a 160-mile circuit around the Collegiate Peaks of the Sawatch Range in Colorado, made of the Colorado Trail's Collegiate East route and its Collegiate West route. Its northern point is at Twin Lakes Reservoir, southwest of Leadville, and its southern point is south of Monarch Pass. Hikers can start and end at any access point on it, which removes the need for a car shuttle."
official_url = "https://coloradotrail.org/traveling-the-ct/collegiate-east-west/"
start = "Twin Lakes, Colorado"
start_lonlat = [-106.382, 39.083]
shape = "loop"
season = "July to September"
months = [7, 8, 9]
season_basis = "primary"
terrain = ["alpine"]
travel = "trail"
permit = "The Foundation says no permit is needed to hike the Colorado Trail except at the self-service station where it enters a wilderness area, where a free permit is filled in, and that a State Wildlife Area permit may be needed for a small part of Segment 12 on Collegiate East."
caution = "The Foundation says snow lingers into July and that the Collegiate West segments melt out last, with CW02 in mid-July, and advises finishing by late September. It calls the Collegiate West higher than the East route and sometimes more exposed."
checked = "2026-11-23"

