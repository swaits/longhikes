basis = "The record's own verification note gives 727.2 km from the Forest Service and 38.4 km from OpenStreetMap in 17 stretches, and the OpenStreetMap copyright page states the ODbL terms. The two parts are also kept apart in line-usfs.geojson and line-osm.geojson."
