[hike]
summary = "The Combined Northern and Long Range Traverse is a 60 km backpacking route on the Long Range Mountains of Gros Morne National Park, Newfoundland and Labrador. Parks Canada joins its Northern Traverse and Long Range Traverse into one longer trip. It is reached on foot, by the Western Brook Pond trail and the Snug Harbour route, and the trip then follows the routes east and south toward Gros Morne Mountain. Parks Canada gives it 5 to 7 days on its web page (5 to 7 nights in its guide), and says there are no built trails and that hikers must navigate by map, compass and GPS."
official_url = "https://parks.canada.ca/pn-np/nl/grosmorne/activ/experiences/arriere-pays-backcountry"
start = "Western Brook Pond trail head, Gros Morne National Park, Newfoundland and Labrador"
start_lonlat = [-57.873, 49.788]
end = "Gros Morne Mountain trail head, Gros Morne National Park, Newfoundland and Labrador"
end_lonlat = [-57.832, 49.566]
shape = "point-to-point"
days = [5, 7]
season = "Late June to September"
months = [7, 8, 9]
season_basis = "primary"
terrain = ["alpine"]
travel = "mostly-cross-country"
permit = "Parks Canada says reservations are required and the daily number of groups is limited, and that hikers must report to the Gros Morne National Park Visitor Centre the day before departure for a safety briefing and a backcountry permit."
caution = "Parks Canada says the routes are not marked with signs or maintained, that the Long Range is remote, strenuous and potentially hazardous, and that low cloud can make route finding harder. The combined route is reached on foot, by the Western Brook Pond trail and the Snug Harbour route, and Parks Canada says these routes require fording Western Brook, where hikers can expect deep (up to 1 metre) and cold water in June and later in September."
checked = "2026-11-23"

