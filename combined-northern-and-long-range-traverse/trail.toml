# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "combined-northern-and-long-range-traverse"
name = "Combined Northern and Long Range Traverse"
country = "CA"
regions = ["NL"]
length_km = 60
length_note = "60 km, as Parks Canada gives it in its list of the Long Range routes: \"Combined Northern and Long Range Traverse (5-7 days, 60 km)\" on its web page, and \"(5-7 nights, 60 km)\" in its Hiking in the Long Range Mountains preparation guide. The two parts are listed separately as the Northern Traverse (27 km) and the Long Range Traverse (35 km). Parks Canada does not name the combined route's start or finish. The preparation guide says the combined route \"is accessed by the Western Brook Pond trail and Snug Harbour route\", so the record gives the head of the Western Brook Pond trail as the start. It gives the finish of the Long Range Traverse, the Gros Morne Mountain trail head, because the page has the combined route follow the routes \"east and south towards Gros Morne Mountain\". The guide gives the Northern Traverse as 33 km and the Long Range Traverse as 36 km, against 27 and 35 km on the web page, and the combined trip in nights where the web page says days."
tier = "short"
short_reason = "Parks Canada says there are no built trails on the Long Range, that the routes are unmarked and need wilderness navigation, and it gives the combined traverse five to seven days."
designation = "Parks Canada, Gros Morne National Park: a backcountry route it publishes by name"
wave = 1
places_checked = "2026-11-23"

