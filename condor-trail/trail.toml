travel = "some-cross-country"
unfinished = "The Association says the trail is not completed: the basic trail is laid out from Highway 101 at the Cuesta Grade to Lake Piru, and the other sections are still being worked out."
caution = "The Association says parts of the route are poorly maintained or not maintained, and some cross private land where public access has been denied or is not known."
