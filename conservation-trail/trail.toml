contact = "Foothills Trail Club of Western New York"
note = "The trail has no emblem of its own. It is a branch trail of the Finger Lakes Trail System and is marked with plain orange blazes (white on the southern part), which are not an emblem, and the Finger Lakes Trail logo found on fingerlakestrail.org stands for the main Finger Lakes Trail, not for this branch. Addresses checked: foothillstrailclub.org home and about-the-trail pages (the club's Google Sites pages: text and photographs, no logo file), sites.google.com/view/foothillstrailclub home and about-the-trail pages, fingerlakestrail.org home page and its page source (Finger Lakes Trail logo and map icons only), and Wikimedia Commons (no relevant file). Ask the club before using any mark."
logo_file = ""
logo_owner = "Foothills Trail Club of Western New York"

[verification]
verified = false
note = "No line to measure."

[hike]
summary = "The Conservation Trail runs north through western New York from the Pennsylvania border in Allegany State Park to Niagara Falls, where it meets the Bruce Trail in Canada. It is part of the Finger Lakes Trail System: its southern miles are the main Finger Lakes Trail, and the part north of Fancy Tract Road is a branch trail marked with orange blazes. The Foothills Trail Club built and maintains it."
official_url = "https://sites.google.com/view/foothillstrailclub/about-the-trail"
start = "Pennsylvania border, Allegany State Park, New York"
end = "Rainbow Bridge, Niagara Falls, New York"
end_lonlat = [-79.067, 43.09]
shape = "point-to-point"
terrain = ["forest"]
checked = "2026-11-20"
season = "April to October"
months = [4, 5, 6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Low-elevation western New York is snowy in winter and muddy in March, and can be walked from April until late fall. Confidence: medium."

