[hike]
summary = "The Continental Divide Trail runs along the spine of the Rocky Mountains from the Mexican border in New Mexico to the Canadian border in Montana, through Colorado, Wyoming and Idaho. It crosses remote, challenging country, and many alternate routes exist. About 160 miles of the trail are still incomplete."
official_url = "https://cdtcoalition.org/"
start = "Mexican border, New Mexico"
end = "Canadian border, Montana"
shape = "point-to-point"
days = [150, 210]
high_point = "Grays Peak"
high_point_m = 4352
terrain = ["alpine"]
travel = "trail"
permit = "No single permit covers the whole trail; permits are needed area by area, for example in Glacier and Yellowstone National Parks and on Blackfeet land."
unfinished = "About 160 miles of the trail are still incomplete."
checked = "2026-11-13"

