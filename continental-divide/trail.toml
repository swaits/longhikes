[shield]
status = "use-real-logo"
logo_source = "https://www.fs.usda.gov/sites/default/files/fs_media/fs_document/CDT_ServiceMark_Auth_Guidelines_FINAL_06282021.pdf"
contact = "USDA Forest Service, Continental Divide National Scenic Trail administrator"
note = "The official Continental Divide National Scenic Trail service mark: a blue rounded triangle with a black CD monogram, lettered Continental Divide Trail, National Scenic Trail. The Forest Service's Service Mark Design and Use Requirements (June 2021), downloaded from fs.usda.gov, identifies it as the trail's mark; the file here is the 687x706 px artwork embedded on its first page, converted to PNG. The guidelines state the service mark is property of the U.S. Department of Agriculture, registered with the U.S. Patent and Trademark Office, and the Forest Service's marking guide states it may only be used with the express permission of the US Forest Service. The Coalition lockup previously used is that organisation's mark, not the trail's. The white surround was made transparent."
logo_file = "shield.png"
logo_owner = "USDA Forest Service"

