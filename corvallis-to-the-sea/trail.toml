# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "corvallis-to-the-sea"
name = "Corvallis-to-the-Sea Trail"
short_name = "C2C"
short_name_url = "https://c2ctrail.org/"
country = "US"
regions = ["OR"]
length_km = 97
length_note = "60 mi, from the Corvallis-to-the-Sea Trail page"
tier = "regional"
designation = "Corvallis-to-the-Sea Trail"
wave = 1

[source]
status = "osm-only"
publisher = "Corvallis-to-the-Sea Trail (publishes the trail; no open geometry found)"
publisher_url = "https://c2ctrail.org/"
url = "https://www.openstreetmap.org/relation/14706511"
discovery = "osm-relation-version: Overpass `rel(14706511); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 14706511."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 14706511: one route relation, main ways only."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 14706511
note = "Downloaded 2026-11-10; 75 ways in the main track. release.txt has the source and date."

[shield]
status = "use-real-logo"
logo_source = "https://c2ctrail.org/wp-content/uploads/logo.png"
contact = "Corvallis-to-the-Sea Trail"
note = "The Corvallis-to-the-Sea Trail's own emblem: a green wave roundel with 'corvallis to the sea trail' lettered over it. It is the header logo at https://c2ctrail.org/ and is used unchanged. No terms for the logo were found on the holder's site."
logo_file = "shield.png"
logo_owner = "Corvallis-to-the-Sea Trail"

[verification]
verified = true
date = "2026-11-10"
measured_km = 95.4
difference_percent = -1.6
parts = 1
note = "OSM relation 14706511, 75 ways: 95.4 km in 1 part, 1.6% short of the published 97 km."

[hike]
summary = "The Corvallis-to-the-Sea Trail links the Willamette Valley with the Pacific Ocean, from Corvallis to Ona Beach in Oregon. It runs through deep forest and is described by its keepers as very difficult. Drinking water is scarce all year."
official_url = "https://c2ctrail.org/"
start = "Corvallis, Oregon"
end = "Ona Beach, Oregon"
shape = "point-to-point"
days = [5, 6]
terrain = ["forest"]
travel = "trail"
permit = "A free permit from Starker Forests, got in person, is required for two road sections of the trail."
caution = "The trail is described as very difficult, and drinking water is scarce all year."
checked = "2026-11-13"
season = "May to October"
months = [5, 6, 7, 8, 9, 10]
season_basis = "source"

[[hike.source]]
url = "https://c2ctrail.org/"
publisher = "Corvallis-to-the-Sea Trail"
facts = ["official_url", "summary", "terrain"]

[[hike.source]]
url = "https://c2ctrail.org/frequently-asked-questions/"
publisher = "Corvallis-to-the-Sea Trail"
facts = ["summary", "start", "end", "shape", "days", "travel", "caution"]

[[hike.source]]
url = "https://c2ctrail.org/hiking-the-trail/permits-rules-precautions/"
publisher = "Corvallis-to-the-Sea Trail"
facts = ["permit"]

[[hike.source]]
url = "https://www.treelinereview.com/where-to-go/c2c-thru-hiking-guide"
publisher = "Treeline Review"
facts = ["season", "months"]

