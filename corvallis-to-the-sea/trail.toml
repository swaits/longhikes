[hike]
summary = "The Corvallis-to-the-Sea Trail links the Willamette Valley with the Pacific Ocean, from Corvallis to Ona Beach in Oregon. It runs through deep forest and is described by its keepers as very difficult. Drinking water is scarce all year."
official_url = "https://c2ctrail.org/"
start = "Corvallis, Oregon"
end = "Ona Beach, Oregon"
shape = "point-to-point"
days = [5, 6]
terrain = ["forest"]
travel = "trail"
permit = "A free permit from Starker Forests, got in person, is required for two road sections of the trail."
caution = "The trail is described as very difficult, and drinking water is scarce all year."
checked = "2026-11-13"

