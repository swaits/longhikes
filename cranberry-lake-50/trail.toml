[hike]
summary = "The Cranberry Lake 50 is a loop of about 50 miles around Cranberry Lake in the Adirondacks of New York. It passes old-growth forest, backcountry ponds and glaciated country, with campsites along the way. Most people walk it clockwise in the warmer months."
