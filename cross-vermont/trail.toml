country = "US"
regions = ["VT"]
length_km = 145
length_note = "a little over 90 mi, from the Cross Vermont Trail Association page"
tier = "regional"
designation = "Cross Vermont Trail Association"
wave = 1
places_checked = "2026-11-20"
places_track = "13da61fbc9c63c6f"

[source]
status = "osm-only"
publisher = "Cross Vermont Trail Association (publishes the trail; no open geometry found)"
publisher_url = "https://crossvermont.org/our_trail/index.php"
url = "https://www.openstreetmap.org/relation/2750828"
discovery = "osm-relation-version: Overpass `rel(2750828); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 2750828."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 2750828: the route as mapped in OpenStreetMap, where it is tagged as a bicycle route; main ways only."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 2750828
note = "Downloaded 2026-11-10; 275 ways in the main track. release.txt has the source and date."

[shield]
status = "logo-not-found"
logo_source = ""
contact = "Cross Vermont Trail Association"
note = "An emblem seems to exist but no usable artwork of it alone is at an allowed source. The association's mark is a green Vermont shape with a dashed route across it, shown beside the name as a lockup in the site header (crossvermont.org/images/bin_cvta-images/cvt_blaze.jpg, 216 px) and at the head of its Maps and Cue Sheets PDF. At 300 dpi from that PDF the shape is crisp, but the letters of the name overlap its bounding box, so a rectangular crop either cuts into the shape or keeps letter fragments; nothing was staged, as such a crop would not be clean. Its other signs are a blue board with the name and a tagline, and a green bicycle oval, neither of which is the trail's crest. Torn: if a non-rectangular cut were allowed, the green shape alone could stand as the mark. Addresses looked at: crossvermont.org/our_trail/index.php, crossvermont.org/index.php, crossvermont.org/our_trail/signs-about.htm, crossvermont.org/about_us/annrpt.php (pages and their sources), crossvermont.org/images/page_maps/crossvt-maps-all.pdf (first page rendered at 72 and 300 dpi), and the blaze, trail-sign and road-sign images named above. Wikimedia Commons was also searched and holds only a photograph of a sign."
logo_file = ""
logo_owner = ""

[verification]
verified = true
date = "2026-11-10"
measured_km = 142.2
difference_percent = -1.9
parts = 1
note = "OSM relation 2750828, 275 ways: 142.2 km in 1 part, 1.9% short of the published 145 km."

[hike]
summary = "The Cross Vermont Trail crosses Vermont from the Connecticut River to Lake Champlain. About half of it is on bike paths, rail trails and quiet country roads, and the rest is still on busier roads. The surface ranges from paved to gravel to grass."
official_url = "https://crossvermont.org/our_trail/index.php"
start = "Connecticut River, Vermont"
end = "Lake Champlain, Vermont"
shape = "point-to-point"
travel = "trail-and-road"
unfinished = "About half the route is still on busier roads, and the association is building more trail toward a complete off-road route across the state."
checked = "2026-11-13"

[[hike.source]]
url = "https://crossvermont.org/our_trail/index.php"
publisher = "Cross Vermont Trail Association"
facts = ["official_url", "summary", "start", "end", "shape", "travel", "unfinished"]

