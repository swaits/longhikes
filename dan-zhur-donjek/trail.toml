months = [6, 7, 8, 9]
high_point_m = 2170
terrain = ["alpine"]
travel = "mostly-cross-country"
permit = "Overnight trips need a Wilderness Permit and an approved bear resistant food canister, from the Kluane visitor centres in Haines Junction or at Thechàl Dhâl."
caution = "Parks Canada says this route is not marked and not maintained, about half of it lies outside the park boundary, and route finding and wilderness experience are essential."
