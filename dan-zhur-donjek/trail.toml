summary = "The Dän Zhùr (Donjek) Route is a 110 km loop in and beside Kluane National Park and Reserve in southwest Yukon. It crosses the Burwash Uplands, descends to the Donjek River and the toe of the Donjek Glacier, and returns over Atlas Pass. Parks Canada calls it Parcours Dän Zhùr (Donjek) in French."
