[hike]
summary = "Deadman and Cloud Canyons is a backpacking semiloop of 11 hiking days in Sequoia and Kings Canyon National Parks, California, from the Twin Lakes Trailhead at Lodgepole Campground. After a stem to the Roaring River Ranger Station it loops through Deadman Canyon and over Elizabeth Pass, Kaweah Gap and Colby Pass by the Kern River canyon and Cloud Canyon, and about 47 miles are shared with the Big SEKI Loop. Elizabeth Wenk and Mike White describe it as Trip 25 in the 9th edition of Sierra South."
official_url = "https://shop.adventurewithkeen.com/product/sierra-south-2/"
start = "Twin Lakes Trailhead, Lodgepole Campground, Sequoia National Park, California"
start_lonlat = [-118.723, 36.605]
shape = "loop"
days = [11, 11]
season = "July to mid-October, the book's mid to late season"
months = [7, 8, 9, 10]
terrain = ["alpine", "canyon"]
travel = "trail"
permit = "A permit is required for overnight stays, with quotas, as the book states; it names the Twin Lakes trailhead permit and says it is picked up in person at the Lodgepole Visitor Center."
caution = "The book rates the pace strenuous and does not recommend the trip for beginners. Days run from 6.8 to 15.8 miles, with long stretches with few campsites, and the book says fitting enough food in a bear canister is one of the trip's greatest challenges, with no bear boxes along Deadman Canyon. The day over Elizabeth Pass climbs 2,200 feet and then drops 3,200 feet on steep ground where the trail briefly fades and cairns must be followed; the descent from Colby Pass drops 700 feet in half a mile down an active rockslide. A 2020 fire burned several miles of the Kern River canyon. The route is on trail, with fords; the book flags no cross-country, rope or climbing."
checked = "2026-11-18"
season_basis = "primary"

