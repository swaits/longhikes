length_km = 182
length_note = "113.4 mi, as the book gives it for Trip 25, with 11 hiking days and 2 layover days; the book gives no elevation gain figure for the trip. It is a semiloop: the 23.0 miles from the Twin Lakes Trailhead to the Roaring River Ranger Station are walked out on the first two days and retraced on the last, so the book's figure counts that stem twice. With nothing counted twice the walk is 90.4 miles (the 23.0 mile stem and a 67.4 mile loop). The book's days run from 6.8 to 15.8 miles. The figures are the book's own and are not measured from a track."
