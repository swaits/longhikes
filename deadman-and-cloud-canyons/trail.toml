note = "Trip 25 in the book (9th edition, 2021). A semiloop from the Twin Lakes Trailhead at Lodgepole Campground to the Roaring River Ranger Station, then a loop by Deadman Canyon, Elizabeth Pass, Kaweah Gap, Big Arroyo, the Kern River canyon and Colby Pass to Cloud Canyon, with 113.4 miles in the book. About 47 miles of it, from the Roaring River Ranger Station through Deadman Canyon and Kaweah Gap to Junction Meadow, are shared with the Big SEKI Loop by the dataset's own check against that record's track; that is a little over half of the 90.4 miles walked once. The book's maps are the track; none is copied here."

