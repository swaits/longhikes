travel = "some-cross-country"
permit = "No permit is required, as the book states."
caution = "The book says a section of the main loop is cross-country, so at least one member of the party should have cross-country desert hiking experience; it tells less experienced groups to take the Willow Spring Trail and Deadman Trail option, which it says is entirely on trail. The author rates its difficulty 8 out of 10. Most of the springs and creeks are seasonal and may go dry in drought years. The maximum group size is 15 and the maximum stay is 14 days."
