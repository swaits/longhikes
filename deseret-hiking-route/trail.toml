[hike]
summary = "The Deseret Hiking Route runs about 1,000 miles through Utah, from the Arizona border to Alturas Lake Creek in Idaho. It is about half singletrack and 40 percent dirt road, with short cross-country and paved sections. It passes Paria Canyon, Bryce Canyon National Park, the Wasatch Mountains and the Pioneer Mountains."
official_url = "http://www.lbhikes.com/p/a-complete-guide-to-deseret-hiking-route.html"
start = "Stateline Trailhead, Utah-Arizona border"
start_lonlat = [-112.035, 37.001]
end = "Alturas Lake Creek, Idaho"
shape = "point-to-point"
terrain = ["canyon", "alpine"]
travel = "trail-and-road"
caution = "The route is unmarked and not designated by any state or federal agency, and about 40 percent of it is dirt road."
checked = "2026-11-20"
season = "May to October"
months = [5, 6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. A route from southern Utah desert canyons to the Pioneer Mountains of Idaho needs the high ground clear of snow and the south not scorching. Confidence: low."

[[hike.source]]
url = "http://www.lbhikes.com/p/a-complete-guide-to-deseret-hiking-route.html"
