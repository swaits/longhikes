note = "No emblem of its own. The trail is marked on the ground with red painted blazes, orange where it shares tread with the Susquehannock Trail System; a paint colour is not a crest, and no badge is used by either holder. The Keystone Trails Association page shows only the association's own round logo and a map; its guidebook cover, shown in the association store, is a photograph with the title as type. Pennsylvania DCNR's pages and its two trail map PDFs carry DCNR marks only. Addresses looked at: kta-hike.org/donut-hole-trail.html, kta-hike.org/maps.html, kta-hike.org/store.html (pages and their sources, including the guidebook cover image), trails.dcnr.pa.gov and dcnr.pa.gov Sproul State Forest hiking pages found by search, and the DCNR Donut Hole West map PDF at elibrary.dcnr.pa.gov (downloaded; a topographic sheet with no trail emblem). Wikimedia Commons holds a photograph of a red blaze and of a trailhead map, not artwork."
