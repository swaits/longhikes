[hike]
summary = "The Donut Hole Trail is a backpacking trail in north-central Pennsylvania that runs from the village of Jericho to Farrandsville, near Lock Haven. It passes through Kettle Creek and Hyner Run State Parks and shares part of its path with the Susquehannock Trail System. It is described as remote and challenging, with steep climbs and unbridged stream crossings."
official_url = "https://www.kta-hike.org/donut-hole-trail.html"
start = "Jericho, Pennsylvania"
end = "Farrandsville, near Lock Haven, Pennsylvania"
shape = "point-to-point"
travel = "trail"
checked = "2026-11-20"
season = "April to June and September to October"
months = [4, 5, 6, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Unbridged streams run high in early spring, and the valleys are hot, humid and buggy in midsummer, so the shoulder months suit best. Confidence: low."

