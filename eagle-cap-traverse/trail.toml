# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "eagle-cap-traverse"
name = "Eagle Cap Traverse"
country = "US"
regions = ["OR"]
length_km = 88
length_note = "54.7 mi one way, as the book gives it for Trip 48 (pages 218-224), with 12,210 ft of elevation gain (up and down) and a high point of 8,880 ft. The text calls it a weeklong trip and lays out six hiking days. Two spurs are walked out and back, the 0.3 mile side trail to Dollar Lake and the 1.3 mile spur to Chimney Lake, and the book's mileposts count both ways. The book's trip planner and text differ by about a mile in the middle of the trip, and agree at the end. The figures are the book's own and are not measured from a track."
kind = "route"
tier = "regional"
designation = "Guidebook route (Eli Boschetto, 2026, in Backpacking Oregon); no agency or association"
wave = 1

