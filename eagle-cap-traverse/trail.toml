[route]
creator = "Eli Boschetto"
year = 2026
line_policy = "sold"
note = "A one way traverse of the Eagle Cap Wilderness from the Tenderfoot Trailhead in the east to the Bowman-Francis Trailhead in the west, by Dollar Lake, Polaris Pass, Frazier Lake, Glacier Lake, Mirror Lake, Minam Lake, Elkhorn Meadows and the Minam River, with 54.7 miles in the book. The book says it links three of its other hikes (47, 51 and 53). The next few miles after the West Fork Wallowa trail junction share ground with the Blue Mountains Trail, about 1.6 miles by the dataset's own reckoning. The book's maps are the track; none is copied here."

