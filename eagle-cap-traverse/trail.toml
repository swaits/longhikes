[hike]
summary = "The Eagle Cap Traverse is a six day one way backpacking route through the Eagle Cap Wilderness in the Wallowa Mountains of Oregon, from the Tenderfoot Trailhead to the Bowman-Francis Trailhead. It crosses Polaris Pass and passes Frazier, Glacier, Mirror and Minam lakes before descending the Minam River country. Eli Boschetto describes it as Trip 48 in Backpacking Oregon."
official_url = "https://www.mountaineers.org/books/books/backpacking-oregon-overnight-and-multiday-routes"
start = "Tenderfoot Trailhead, Eagle Cap Wilderness, Oregon"
start_lonlat = [-117.103, 45.177]
end = "Bowman-Francis Trailhead, Eagle Cap Wilderness, Oregon"
end_lonlat = [-117.395, 45.294]
shape = "point-to-point"
days = [6, 7]
season = "July to October"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "A self-issue wilderness permit is required, as the book states; wilderness rules apply and campfires are prohibited within a quarter mile of most lakes."
caution = "The book rates the difficulty 4 on its scale of 5 and calls the trip strenuous, with several high passes and more than two vertical miles of climbing. It lists numerous creek crossings, high elevations and exposure as concerns. It is a one way hike that needs a shuttle vehicle. The route is on numbered trails; the book describes an optional 0.7 mile knife-edge arete to Sentinel Peak as not for the acrophobic and an optional exposed trail to the Eagle Cap summit, neither part of the route."
checked = "2026-11-18"
season_basis = "primary"

