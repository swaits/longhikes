travel = "mostly-cross-country"
permit = "A wilderness permit is required year round for overnight trips from the Duck Pass trailhead, and from May 1 through November 1 overnight visitors there are limited to 30 people per day."
caution = "The author says the route is consistently difficult, with steep and sometimes loose talus, scree and sand."
