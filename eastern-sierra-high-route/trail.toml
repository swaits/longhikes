summary = "The Eastern Sierra High Route runs along the east side of California's Sierra Nevada, from the Duck Pass trailhead above Mammoth Lakes to the Bishop Pass trailhead at South Lake near Bishop. It is 65 to 70 miles, with 70 to 80 percent of it off-trail and 13 cross-country passes. The author says nothing on it is harder than class 3, and that it takes about a week or less."
