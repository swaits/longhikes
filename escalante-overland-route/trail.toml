[hike]
summary = "The Escalante Overland Route follows the rim above the Escalante River canyon in southern Utah, from Utah Highway 12 near Calf Creek Falls to where the route leaves the canyon just before Lake Powell. It has no trails and needs unroped climbing of Class 4 to low Class 5 on slickrock, usually going down, where a fall could cause serious injury or death. Navigation is very hard and water is scarce above the river; Alan Dixon calls it semi-technical, for experienced canyoneers who are also rock climbers."
official_url = "https://www.adventurealan.com/escalante-overland-route/"
start = "Utah Highway 12 near Calf Creek Falls, Utah"
end = "Escalante River canyon just before Lake Powell, Utah"
shape = "point-to-point"
days = [6, 10]
season = "April to mid-May, and mid-September to mid-November"
months = [4, 5, 9, 10, 11]
season_basis = "source"
terrain = ["desert", "canyon"]
travel = "mostly-cross-country"
caution = "Several places need unroped climbing of Class 4 to low Class 5 on slickrock, usually going down, where a fall could cause serious injury or death. Alan Dixon says these unprotected climbs cannot be avoided, advises carrying a climbing rope, harness, hardware and webbing, and reports that his party lowered packs by rope once so they could down-climb a Class 5 section without them. Navigation is exceptionally hard and water is scarce above the Escalante River. This route is listed as an exception to this site's climbing limit. Strong off-trail hikers who are not climbers have completed it without using a rope (Katie Gerber and Eric Volk, May 2024, who carried 30 feet of webbing and did not use it)."
checked = "2026-11-24"

