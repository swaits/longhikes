[hike]
summary = "The Finger Lakes Trail crosses southern New York from the Pennsylvania border in Allegany State Park to the Long Path and Slide Mountain in the Catskills. Branch trails reach Niagara Falls, the Genesee River valley and the central Finger Lakes. It is a primitive footpath, and some sections close during hunting seasons."
