[hike]
summary = "The Florida National Scenic Trail runs the length of Florida, from Big Cypress National Preserve in the south to Gulf Islands National Seashore on the Panhandle coast. It crosses cypress swamp, prairie, pinelands and sand beaches. It is the only subtropical National Scenic Trail in the nation."
official_url = "https://floridatrail.org/explore-the-florida-trail/"
start = "Big Cypress National Preserve, Florida"
end = "Gulf Islands National Seashore, Florida"
shape = "point-to-point"
days = [60, 90]
season = "Late October to April"
months = [10, 11, 12, 1, 2, 3, 4]
terrain = ["prairie", "coast"]
travel = "trail"
permit = "Backcountry camping in Big Cypress National Preserve needs a permit."
caution = "In Big Cypress, large sections of the trail are under standing water for much of the year."
checked = "2026-11-13"

