length_note = "The Eastern Corridor thru-hike, by the east side of Lake Okeechobee: 'Eastern Corridor Thru-Hike: 1,130 miles' on the Florida Trail Association's card (a 2019 card, on its own site). The association's FAQ (floridatrail.org/faqs) totals the same hike at 1,287.9 mi, of which 365.71 mi is road connector, and the two figures are not reconciled. Its 2024 to 2025 thru-hiker guide says a thru-hike is approximately 1,100 mi and averages 2 to 3 months."
