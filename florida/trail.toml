[source]
status = "osm-only"
publisher = "Florida Trail Association with the USDA Forest Service Southern Region"
publisher_url = "https://services9.arcgis.com/soy9dtLUh5hYXg8U/arcgis/rest/services/FNST%20Master/FeatureServer/0"
url = "https://www.openstreetmap.org/relation/14480287"
discovery = "osm-relation-version: Overpass `rel(14480287,14480288,14480289,14480290,14480373); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "Five OpenStreetMap regional route relations (14480287 to 14480290 and 14480373), read through Overpass with all member ways and nested relations"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 14480287. The publisher's own track is not licensed for redistribution and is not used."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
length_gap_note = "The main track is one walk, not the designated system. At 1,783.6 km it is 1.9% short of the 1,818 km (1,130 mi) Eastern Corridor thru-hike the Association publishes, but 26% short of the 2,414 km (1,500 mi) figure, which also counts the west side of Lake Okeechobee, the Western Corridor and connecting roads and trails; those are in alternates.geojson."
mainline = "The main track is one continuous south-to-north walk, cut from the five regional relations (14480287 Panhandle, 14480288 Northern, 14480289 Central, 14480290 Southern, 14480373 Disconnected Trails) by the Florida Trail Association's thru-hike: the east side of Lake Okeechobee and the Eastern Corridor (Cross Seminole and Seminole Wekiva trails). The relations do not say which branch is which, so the branches were told apart from the geometry: where the track splits twice, the two ways around the lake (92 km east, 91 km west) and through central Florida (327 km Eastern, 386 km Western) match the Association's data book figures of 57.4 and 55.5 mi and 203.7 and 239.5 mi. The west side of the lake, the Western Corridor, connecting roads off the walk, the pieces of the Disconnected Trails relation that do not join the route, and the ways marked 'alternative', 'excursion' or 'approach' (with the nested side relations 16774782, a high-water alternate, and 19804593, the Orange Blaze connector) are in alternates.geojson."
source_checked = "2026-11-09"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

