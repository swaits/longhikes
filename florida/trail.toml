note = "Relations 14480287, 14480288, 14480289, 14480290 and 14480373 downloaded 2026-11-09 (2,082 main ways and 326 alternate ways); the track was re-cut on 2026-11-16 to 1,446 main ways in walking order, with 962 ways in alternates."

[shield]
status = "use-real-logo"
logo_source = "http://apalachee.floridatrail.org/wp-content/uploads/2014/07/FNST-Coalition-Land-Managers-Guide-to-Minimum-Trail-Standards-and-Guidelines-for-the-FNST.pdf"
contact = "USDA Forest Service (National Forests in Florida); Florida Trail Association"
note = "The trail's official emblem: the uniform Florida National Scenic Trail marker, a rounded triangle reading Florida Trail and National Scenic Trail around an orange FT in front of a green outline of Florida on a blue ground. It is captioned The Uniform FNST on page 1 of the land managers' guide to minimum trail standards for the FNST, a Forest Service and FNST Advisory Council standard, in the copy hosted by the Florida Trail Association's Apalachee Chapter; the Forest Service's own copy at fs.usda.gov now redirects to a web page. The artwork was taken from the image embedded in that PDF at its native 600 px, and the plain white surround outside the triangle was made transparent by flood-fill from the corners; the result was checked on white and dark grounds and the black edge is intact with no halo. This replaces the file on the record, which is the Florida Trail Association's own diamond mark cropped from its square logo on floridatrail.org. The official emblem of a National Scenic Trail is a federal insignia; use needs the administering agency's permission."
logo_file = "shield.png"
logo_owner = "USDA Forest Service"

