[hike]
summary = "The Fremont National Recreation Trail runs north to south through the Fremont National Forest in south-central Oregon, from Yamsay Mountain to Vee Lake near the California border. It follows high ridges and the rim of a fault block above Summer Lake, through pine forest, meadows and sagebrush country. It is open to hikers, horse riders and mountain bikers."
