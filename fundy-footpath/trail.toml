[hike]
summary = "The Fundy Footpath is a coastal wilderness trek in New Brunswick that runs between the Big Salmon River near St. Martins and Fundy National Park. It follows the longest undeveloped stretch of coastline on the eastern seaboard. It is steep and demanding, and it has remote river valleys and tidal crossings."
official_url = "http://www.fundyhikingtrails.com"
start = "Big Salmon River, near St. Martins, New Brunswick"
end = "Fundy National Park, New Brunswick"
shape = "point-to-point"
days = [4, 5]
terrain = ["coast"]
travel = "trail"
permit = "Both ends need entry permits and fees: Fundy Trail Provincial Park entry at St. Martins, and Fundy National Park entry plus a backcountry campsite reservation made before the hike."
caution = "The trail is very difficult, with steep terrain and tidal river crossings that can be dangerous."
checked = "2026-11-13"

