# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "ganaraska"
name = "Ganaraska Hiking Trail"
country = "CA"
regions = ["ON"]
length_km = 500
length_note = "About 500 km (311 mi) for the main trail of ten sections, as the association gives it for its End-to-End badge. The side trails to Wasaga Beach and Midland are not counted."
tier = "regional"
designation = "Ganaraska Hiking Trail Association"
wave = "held"
wave_note = "The only track, OSM relation 3696751, covers the eastern half only (238.4 km, ending near Barrie) and does not reach Glen Huron. The Association sells a guidebook but publishes no open track. What would fix it: a track from the Ganaraska Hiking Trail Association, or complete OSM mapping of the western clubs sections."

[source]
status = "osm-only"
publisher = "Ganaraska Hiking Trail Association (publishes the trail; no open track found)"
url = "https://www.openstreetmap.org/relation/3696751"
discovery = "osm-relation-version: Overpass `rel(3696751); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes (relation v96, edited 2026-09-29)."
format = "OpenStreetMap route relation, read through Overpass or a Geofabrik extract"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 3696751."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
decision = "included-named"
decision_text = "Included with its name and logo. The track is from OpenStreetMap."
mainline = "One relation. It covers the eastern half and ends near Barrie; the western sections to Glen Huron are not mapped. The relation gives no roles. At one place it holds three ways joined in a triangle (Ganaraska (Wilderness), 7.2 km, between two ends, and Ganaraska (Devil's Lake), 4.8 km, and Ganaraska (Queen's Corridor), 3.7 km, by way of a third point). No page read says which is the trail, so the track keeps the direct way between the two ends and the other two ways (9.1 km with a short stub) are in alternates.geojson."
source_checked = "2026-11-08"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "OSM relation 3696751 gives 229.1 km in 11 parts and ends near Barrie; it does not reach the Glen Huron terminus. The 500 km published figure is the main trail of ten sections. No usable whole track found on 2026-11-08."

[osm]
relation = 3696751
note = "Found by a name search on 2026-11-08: relation 3696751 'Ganaraska Trail' (rwn). Downloaded; release.txt has the version. Re-cut 2026-11-16: the main track is 263 ways and 2 are in alternates."

[shield]
status = "use-real-logo"
logo_source = "https://ganaraska-hiking-trail.org/wp-content/uploads/2016/01/GanaraskaLogo-e1452359706312.jpg"
contact = "Ganaraska Hiking Trail Association"
note = "The Ganaraska Hiking Trail's own roundel: a black arrow and 'G' inside a ring lettered 'GANARASKA HIKING TRAIL'. It appears at the left of the title banner on https://www.ganaraska-hiking-trail.org/ and alone as the site icon, from which the file already held was taken at 192x192 px. This is the full-size original of that same artwork from the association's own site, reduced to 1024 px on the long side and converted from JPEG to PNG. No terms for the logo were found on the holder's site. The white surround was made transparent."
logo_file = "shield.png"
logo_owner = "Ganaraska Hiking Trail Association"

[verification]
verified = true
date = "2026-11-16"
measured_km = 229.1
difference_percent = -54.2
parts = 11
note = "OSM relation 3696751 gives 229.1 km in 11 parts and ends near Barrie; it does not reach the Glen Huron terminus. The earlier track, 238.4 km, held a triangle of three ways at one place; two of them, 9.1 km, are in alternates.geojson. The 500 km published figure is the main trail of ten sections. No usable whole track found on 2026-11-08."

[hike]
summary = "The Ganaraska Hiking Trail runs across southern Ontario from Port Hope on Lake Ontario to the Bruce Trail near Collingwood. Side trails reach Wasaga Beach and Midland. Local clubs lead hikes on it through the year."
official_url = "https://www.ganaraska-hiking-trail.org/"
start = "Port Hope, Ontario"
end = "Bruce Trail, near Collingwood, Ontario"
shape = "point-to-point"
checked = "2026-11-13"

[[hike.source]]
url = "https://www.ganaraska-hiking-trail.org/"
publisher = "Ganaraska Hiking Trail Association"
facts = ["official_url", "summary", "start", "end", "shape"]

