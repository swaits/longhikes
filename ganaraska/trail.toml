# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "ganaraska"
name = "Ganaraska Hiking Trail"
country = "CA"
regions = ["ON"]
length_km = 500
length_note = "about 500 km with side trails"
tier = "regional"
designation = "Ganaraska Hiking Trail Association"
wave = "held"
wave_note = "Held: the only track, OSM relation 3696751, covers the eastern half only (238.4 km, ending near Barrie) and does not reach Glen Huron. The Association sells a guidebook but publishes no open track. What would fix it: a track from the Ganaraska Hiking Trail Association, or complete OSM mapping of the western clubs sections."

