# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "general-george-crook"
name = "General George Crook National Recreation Trail"
short_name = "GGC"
country = "US"
regions = ["AZ"]
length_km = 95
length_note = "58.9 mi, the Apache-Sitgreaves National Forests' figure for its part of the trail (trail 140), which the Forest Service's National Recreation Trail record also gives in its text (the same record's table says 138 mi); no Forest Service page gives one length for the whole trail"
tier = "regional"
designation = "National Recreation Trail (certified 1979), managed by the Forest Service: trail 140 on the Apache-Sitgreaves National Forests, trail 130 on the Coconino National Forest and trail 64 on the Prescott National Forest"
wave = "held"
wave_note = "Held: the Forest Service publishes the trail as three pieces on three national forests and gives no length for the whole. The Apache-Sitgreaves page gives 58.9 mi for its piece alone. The Forest Service track for all three pieces measures 193.5 km. The Coconino and Apache-Sitgreaves pieces join and make one walkable trail of about 177 km; the Prescott piece lies about 20 km west of them with a gap between. What would settle it: a Forest Service statement of the whole trail's length and ends."

