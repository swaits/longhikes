[hike]
summary = "The Gila Wilderness Centennial Loop is a 100-mile loop through the Gila Wilderness of southwestern New Mexico. The Forest Service designated it in 2024 for the wilderness's 100th anniversary, and publishes it as a free map; it names no starting trailhead for the loop. The Forest Service describes the wilderness's river corridor as deeply incised, with vertical cliffs and cathedral spires."
official_url = "https://www.fs.usda.gov/r03/gila/recreation/gila-wilderness-area"
shape = "loop"
terrain = ["canyon"]
travel = "trail"
permit = "Individual hikers need no pass or permit; organised groups need a permit from the Forest Service."
caution = "The Forest Service says the stretch of West Fork Trail 151 along Cooper Canyon to Turkeyfeather Pass is not passable, so check the loop map there. A local trail group reported in November 2024 that the Forest Service crew had cleared the last impassable part of the loop, and that walkers found rough tread in places, such as Trail 159 above Turkey Creek and Trail 101 near private land at Double Spring. The Forest Service says West Fork Trail 151 has many river crossings per mile, and that water in the Gila can be unreliable and must be treated."
checked = "2026-11-20"
season = "March to May and September to November"
months = [3, 4, 5, 9, 10, 11]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Gila canyons at 6,000 feet are hot from June to August, with monsoon storms and flash floods, and cold in winter. Confidence: medium."

