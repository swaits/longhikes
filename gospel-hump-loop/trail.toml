id = "gospel-hump-loop"
name = "Gospel Hump Loop"
country = "US"
regions = ["ID"]
length_km = 109
length_note = "68 mi, as the book gives it for Trip 9, with 12,600 ft of elevation gain and 5 to 8 days. The book's mileage is the trip in its basic form, rounded to the nearest mile and, the author says, accurate to about 10 per cent. The book also prints 70 mi and 13,600 ft in brackets: the trip with the recommended side trips added (its day table adds to 70 mi). It is a true loop with no stem, and the Hump Lake and Crystal Lake side trips are not in either figure. The figures are the book's own and are not measured from a track."
kind = "route"
tier = "regional"
designation = "Guidebook route (Douglas Lorain, 2004, in Backpacking Idaho); no agency or association"
