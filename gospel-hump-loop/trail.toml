[hike]
summary = "The Gospel Hump Loop is a backpacking loop of 5 to 8 days in the Gospel Hump Wilderness in Idaho, from the Moores Guard Station trailhead. It crosses high subalpine ridges and descends to the Salmon River canyon before climbing back out by way of Jumbo Camp. Douglas Lorain describes it as Trip 9 in Backpacking Idaho."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-idaho/"
start = "Moores Guard Station trailhead, Gospel Hump Wilderness, Idaho"
start_lonlat = [-115.886, 45.595]
shape = "loop"
days = [5, 8]
season = "July to October, best in early to mid July or in September"
months = [7, 8, 9, 10]
terrain = ["forest", "canyon"]
travel = "trail"
permit = "None required, as the book states; groups are limited to 20 people and 20 stock animals."
caution = "The book rates the difficulty 10 out of 10, its hardest rating, and says to take the hike only in top physical condition, with many steep ups and downs over extremely rugged terrain. Rattlesnakes are abundant and poison ivy grows in the Salmon River canyon, which is very hot in summer, and some trails are brushy and poorly maintained, including a faint one. About 5 miles near Jumbo Camp follow a primitive jeep road. The book mentions no cross-country, rope or climbing; its lookout side trips are on trail."
checked = "2026-11-18"
season_basis = "primary"

