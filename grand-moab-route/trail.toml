[hike]
summary = "The Grand-Moab Route links Grand Junction, Colorado, and Moab, Utah, in about 140 miles over the Uncompahgre Plateau, Dominguez Canyon and the La Sal Mountains. It mixes single track, bike paths, 4x4 roads and cross-country travel. The author hiked it in five days."
official_url = "https://pmags.com/the-grand-moab-route"
