end = "Colorado River footbridge by Lions Park, Moab, Utah"
start_lonlat = [-108.567, 39.067]
end_lonlat = [-109.55, 38.572]
shape = "point-to-point"
days = [5, 5]
high_point = "Manns Peak"
high_point_m = 3741
terrain = ["desert", "canyon", "alpine"]
travel = "some-cross-country"
permit = "No permit is needed; some trailheads have sign-ins and Sand Flats Recreation Area charges a $2 day pass."
caution = "The author advises against doing the route from June to early September, and camping is not allowed on a 16-mile stretch near Grand Junction."
checked = "2026-11-14"

