# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "grand-sawtooth-loop"
name = "Grand Sawtooth Loop"
country = "US"
regions = ["ID"]
length_km = 113
length_note = "70 mi, as the Sawtooth Association gives it: its page says \"round trip 70 +/- miles\" with the trailhead \"various\", and says the loop is not a designated trail but a connection of trails with many variations and many trailheads. The page does not say that the 70 miles are from Grandjean. Douglas Lorain's Backpacking Idaho (Wilderness Press, 2004), Trip 15, \"Grand Sawtooths Loop\", from the Grandjean trailhead, gives 63 mi, or 65 mi with side trips. CleverHiker gives 60 to 70 mi, adding or subtracting for side trips and route variations, and Fastest Known Time gives \"75(ish)\". The figures differ because the loop is not fixed: each publisher's version includes different side trips and trails. This record keeps the Association's 70 mi as the length."
tier = "regional"
designation = "A named loop that joins designated Forest Service trails in the Sawtooth Wilderness, Idaho, and that the Sawtooth Association among others publishes under this name; the loop itself is not one designated trail"
wave = 1
places_checked = "2026-11-20"

