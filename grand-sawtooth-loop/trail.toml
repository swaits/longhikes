[hike]
summary = "The Grand Sawtooth Loop is a backpacking loop in the Sawtooth Wilderness of central Idaho, starting and ending at the Grandjean Campground Trailhead. It passes high alpine lakes such as Sawtooth Lake, the Baron Lakes and Ardeth Lake and crosses mountain passes on maintained trails. The loop is not one designated trail: it joins designated Forest Service trails, and the Sawtooth Association, which publishes it as a named loop, calls it a connection of trails with many variations."
official_url = "https://discoversawtooth.org/grand-sawtooth-loop"
start = "Grandjean Campground Trailhead, Sawtooth Mountains, Idaho"
start_lonlat = [-115.151, 44.149]
shape = "loop"
days = [5, 7]
season = "Mid-July to mid-September"
months = [7, 8, 9]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "A free Wilderness Use Permit is required for the Sawtooth Wilderness, self-registered at the trailhead or wilderness boundary; groups of eight or more must contact a Forest Service office."
caution = "CleverHiker's guide warns of a lot of climbing, roughly 3,000 feet of gain or loss a day, several river fords and exposed high-elevation sections. The Sawtooth Association says creeks can be hard to cross early in the season, which can last through July, and that passes hold snow later than anywhere else. The Forest Service allows no ground campfires anywhere in the Sawtooth Wilderness."
checked = "2026-11-18"
