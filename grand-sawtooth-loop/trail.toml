licence_text = "No track is included, so no source licence applies to a track, and none of the guides read publishes one. The Forest Service's National Forest System trails layer, used here only to place the start and to measure the trails the guides name, is a United States federal government work, public domain in the United States under 17 U.S.C. 105."
attribution = "none (no track included)"
osm_only = false
mainline = "No track was built. The guides name the trails of the loop but publish no track and no single fixed path, and the Forest Service trails that the sources read name (Trail Creek, Iron Creek-Stanley Lake, N. Fk. Baron-Sawtooth Lk., Redfish Creek-Baron Creek, Mt. Cramer, South Fork Payette River, Ardeth Lake, Ten Lake Basin and Benedict) join in the layer into a loop of 60.0 mi from Grandjean, 14% under the 70 mi the record gives."
source_checked = "2026-11-18"
redistributable = true
line_source = "none (no line included)"
line_file = ""
line_absent_reason = "The loop is not an official trail and publishers give no single fixed path for it. The Forest Service trails that the guides name make a loop of about 60 mi in the layer, against about 70 mi published (the other figures read are 60 to 70 mi and about 75 mi), so the trails could not be chosen to match a published length; no track is included."

