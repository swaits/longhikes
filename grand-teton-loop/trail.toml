length_note = "48.5 mi, as the book gives it for Trip 12 (page 104), with 9,100 ft of elevation gain and 5 to 8 days. The book's days assume about 10 miles a day. The page also prints 61 mi and 11,800 ft in brackets: the trip with the recommended side trips added. The figures are the book's own and are not measured from a track. This is under the 50 mile floor; it is listed because the book gives it five to eight days and describes optional cross-country scrambles."
