[hike]
summary = "The Grand Teton Loop is a backpacking loop of five to eight days in Grand Teton National Park, Wyoming, from the Lupine Meadows Trailhead. By the book's map it goes north past Jenny Lake to String Lake and climbs Paintbrush Canyon to Paintbrush Divide on the first day, then passes Lake Solitude, goes up South Fork Cascade Canyon, crosses Hurricane Pass, and runs through Alaska Basin and along Death Canyon Shelf to Fox Creek Pass, where the book names the Teton Crest Trail. It then goes down Death Canyon and finishes on the Valley Trail past Bradley and Taggart lakes to Lupine Meadows. The book describes optional cross-country scrambles. Douglas Lorain describes it as Trip 12 in Backpacking Wyoming, at 48.5 miles under the 50 mile floor, and it is listed as an exception."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-wyoming/"
start = "Lupine Meadows Trailhead, Grand Teton National Park, Wyoming"
start_lonlat = [-110.742, 43.735]
shape = "loop"
days = [5, 8]
season = "Usually open mid-July to mid-October, best late July and August"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "Required, as the book states, and reservations are strongly advised. The book says the backcountry office at the Moose Junction Visitors Center opens at 8 A.M. and that hikers without a reservation should arrive well before then to get in line."
caution = "The book says black bears are common, the trails and camps are very popular and getting a permit is difficult. Camping is allowed only in designated camping zones or sites and fires only at specified camps, all food must be stored away from bears at all times, and since 2008 every backpacker must use a bear canister, on loan from the ranger stations at Moose Junction and Colter Bay. The book says snow can block Paintbrush Divide into late July or August, and suggests an ice axe may help. The author rates its difficulty 8 out of 10."
checked = "2026-11-18"

