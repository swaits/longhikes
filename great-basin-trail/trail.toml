[[history]]
date = "2026-11-20"
change = "The trail was placed in Great Basin National Park, Ruby Mountains, Alta Toquima Wilderness, Arc Dome Wilderness, Becky Peak Wilderness, East Humboldts Wilderness, Fortification Range Wilderness, High Schells Wilderness, Highland Ridge Wilderness, Mt. Moriah Wilderness, Parsnip Peak Wilderness, Quinn Canyon Wilderness, Ruby Mountains Wilderness, South Pahroc Range Wilderness, Table Mountain Wilderness and Worthington Mountains Wilderness from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"The Great Basin Trail spends most of its route on BLM land, wends its way through occasional Forest Service land, dips in and out of state land, and traverses across the Great Basin National Park and Basin and Range National Monument, which are managed by the National Park Service.\" (Great Basin National Park) The page says: \"Anchored in the west by the lengthy Toiyabe Crest and Alta Toquima, the northern portion highlighted by the Diamond Range and the Ruby Crest, the east flanked by the High Schells and the tall Snake Range\" (Ruby Mountains) The page says: \"17 Wilderness: Fortification, Parsnip Peak, South Pahroc, Worthington, Quinn Canyon, Palisade Mesa, Arc Dome, Alta Toquima, Table Mountain, Antelope, Ruby, East Humboldt, South Pequop, Becky Peak, High Schells, Mt. Moriah, Highland Ridge\" (Alta Toquima Wilderness, Arc Dome Wilderness, Becky Peak Wilderness, East Humboldts Wilderness, Fortification Range Wilderness, High Schells Wilderness, Highland Ridge Wilderness, Mt. Moriah Wilderness, Parsnip Peak Wilderness, Quinn Canyon Wilderness, Ruby Mountains Wilderness, South Pahroc Range Wilderness, Table Mountain Wilderness, Worthington Mountains Wilderness)"
basis_url = "https://www.freedirtmonger.com/2020/06/gbt-introduction.html"
asked_by = "the dataset's own check"
