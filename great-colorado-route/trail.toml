[[history]]
date = "2026-11-20"
change = "The trail was placed in Black Canyon of the Gunnison National Park, Colorado National Monument, Great Sand Dunes National Park, Rocky Mountain National Park, Front Range, San Juan Mountains, Sangre de Cristo Mountains, Dominguez Canyon Wilderness, Gunnison Gorge Wilderness, Indian Peaks Wilderness, Maroon Bells-Snowmass Wilderness, Mount Sneffels Wilderness and Sangre de Cristo Wilderness from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"The GCR enters Black Canyon of the Gunnison National Park for roughly 9 miles and requires an entrance pass (whether a $15 standard pass or America the Beautiful Pass).\" (Black Canyon of the Gunnison National Park) The page says: \"The GCR enters Colorado National Monument for roughly 30 miles minus a brief intermission of BLM land and private property near Pinyon Airport.\" (Colorado National Monument) The page says: \"The GCR crosses Great Sand Dunes National Park and Preserve for roughly 20 miles (from the Entrance Station to Music Pass), and the section across the sand dunes can be slow going.\" (Great Sand Dunes National Park) The page says: \"Section 24 of the GCR crosses Rocky Mountain National Park for roughly 40 miles (Ogalalla Peak through Estes Park, not counting the terrain north of Estes in Section 25).\" (Rocky Mountain National Park, Front Range) The page says: \"and the GCR crosses the wilderness area for only 5 miles (roughly one mile from trailhead to Blue Lakes Pass).\" (San Juan Mountains, Mount Sneffels Wilderness) The page says: \"After exiting the Sangre de Cristo Wilderness just southeast of Zapata Falls\" (Sangre de Cristo Mountains) The page says: \"The GCR crosses Zones 1, 2, and 3 of the Dominguez Canyon Wilderness.\" (Dominguez Canyon Wilderness) The page says: \"The GCR enters Gunnison Gorge Wilderness for roughly 10 miles and requires a $3 day use fee that can be purchased online here.\" (Gunnison Gorge Wilderness) The page says: \"The GCR crosses Indian Peaks Wilderness for roughly 26 miles (Rollins Pass through Ogalalla Peak).\" (Indian Peaks Wilderness) The page says: \"The GCR crosses Maroon Bells—Snowmass Wilderness (MBSW) for roughly 17 miles from Capitol Creek Trailhead to Geneva Lake Trailhead, then reenters the wilderness for roughly 22 miles from Geneva Lake Trailhead to Schofield Park.\" (Maroon Bells-Snowmass Wilderness) The page says: \"After exiting the Sangre de Cristo Wilderness just southeast of Zapata Falls, camping is only allowed at the Zapata Falls Campground\" (Sangre de Cristo Wilderness)"
basis_url = "https://www.greatcoloradoroute.com/resources"
asked_by = "the dataset's own check"
outcome = "applied"
