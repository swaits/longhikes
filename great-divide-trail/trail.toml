season = "July to mid-September"
months = [7, 8, 9]
terrain = ["alpine", "forest"]
travel = "some-cross-country"
permit = "Backcountry permits and reservations are needed for the national park campgrounds (from Parks Canada), reservations for three provincial parks, and an Alberta Public Lands Camping Pass for random camping in parts of Alberta."
checked = "2026-11-13"
season_basis = "primary"

