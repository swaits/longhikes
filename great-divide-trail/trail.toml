[hike]
summary = "The Great Divide Trail follows the Continental Divide through Alberta and British Columbia, from Waterton Lakes National Park at the United States border to Kakwa Lake. It crosses the Divide no fewer than 30 times. Parts follow signed park trails, and other parts are unofficial or unmaintained routes that need route-finding."
