[[history]]
date = "2026-11-16"
change = "The length was changed from about 2,000 miles (3,200 km) to about 1,800 miles (2,897 km), the association's own figure. The earlier figure is not on any page the association publishes."
fields = ["length_km", "length_note", "source.length_gap_note", "verification.difference_percent", "verification.note"]
basis = "The Great Eastern Trail Association's about page says: 'This path is 1800 miles long and crosses nine states.' Its home page says the logo 'is posted on many places on the 1800-mile trail.'"
basis_url = "https://www.greateasterntrail.net/about-us/"
asked_by = "the dataset's own check"
