[[history]]
date = "2026-11-16"
change = "The main track was re-cut to one walk (2,348 km): at Arnot and Everett in Pennsylvania and at two short places, a second way moved to the alternates, and a doubled carriageway near Harlan, Kentucky, was left out."
fields = ["source.line_file", "source.mainline", "source.length_gap_note"]
basis = "A way is named 'High Water Route (MST)', and the Mid-State Trail Association's Everett Region page describes the western route onto the ridge as fully blazed. The Pine Mountain Link relation holds both carriageways of one road. The relation gives no roles at these places."
basis_url = "https://hike-mst.org/index.php/the-trail/everett-region"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
date = "2026-11-19"
change = "The word \"Held:\" was taken off the start of the wave note, which now reads as a sentence on its own. Nothing else in the note changed."
fields = ["wave_note"]
basis = "The page quotes the note to visitors, and the prefix only repeated the record's held mark."
basis_url = "https://hike-mst.org/index.php/the-trail/everett-region"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
date = "2026-11-19"
change = "The usual time to walk the whole trail, 120 to 180 days, was added."
fields = ["hike.days"]
basis = "The page of Backpacker magazine says: \"Better plan to take 4 to 6 months off to hike the Great Eastern Trail once it's completed.\""
basis_url = "https://www.backpacker.com/trips/trips-by-state/pennsylvania-trails/the-great-eastern-trail-could-be-the-next-appalachian-trail-heres-how-to-hike-part-of-it-now/"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
date = "2026-11-19"
change = "The Great Eastern Trail's track now holds 12 relation ways tagged with the role route, 10.4 km on the North Chickamauga Creek trail, that an earlier rule had put in alternates. The track is 2,358.7 km in 28 parts, where it was 2,348.2 km in 29."
fields = ["source.line_file", "source.mainline", "source.length_gap_note", "verification.measured_km", "verification.difference_percent", "verification.parts", "verification.note"]
basis = "OpenStreetMap's wiki page for route relations says the empty role should be used instead of the role route, which was used sometimes with the older public transport tagging. The 12 ways joined two parts of the main track end to end, so they carry the trail; the track tool had read the role as a side trail."
basis_url = "https://wiki.openstreetmap.org/wiki/Relation:route"
asked_by = "the dataset's own check"
outcome = "applied"

