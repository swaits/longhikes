# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "great-eastern"
name = "Great Eastern Trail"
short_name = "GET"
short_name_url = "https://www.greateasterntrail.net/about-us/"
country = "US"
regions = ["AL", "GA", "TN", "KY", "VA", "WV", "MD", "PA", "NY"]
length_km = 2897
length_note = "About 1,800 mi, as the Great Eastern Trail Association gives it: 'This path is 1800 miles long and crosses nine states' on its about page, and 'the 1800-mile trail' on its home page. Backpacker gives 1,600 mi, and the first end-to-end thru-hike was in 2013. An earlier version of this record gave about 2,000 mi, which no page read for this check says."
tier = "regional"
designation = "Great Eastern Trail Association; links existing trails"
wave = "held"
wave_note = "It is a composite of existing trails, not one designated trail."
places_checked = "2026-11-20"
places_track = "b02e55d4b70f3dc2"

[source]
status = "osm-only"
publisher = "Great Eastern Trail Association (publishes the trail; no open geometry found)"
url = "https://www.openstreetmap.org/relation/1024490"
discovery = "osm-relation-version: Overpass `rel(1024490); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation (route=hiking), read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-16). The track included here is from OpenStreetMap, relation 1024490."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 1024490 holds the trail as a set of member relations of other named trails (for example Pinhoti, Tuscarora, Mid-State, C&O Canal Trail). It gives no role to tell a branch from the walk, so the main track is one walk of its ways and the second ways at five splits are in alternates.geojson. The 12 ways with the role route (10.4 km, on the CT - North Chickamauga Creek trail) are main: OpenStreetMap's wiki gives the role route as the old name of the empty role. They were in alternates.geojson until 2026-11-19. In Pennsylvania the Mid-State Trail relation holds two ways at Arnot and at Everett; the High Water Route and the eastern road route at Everett moved (10.8 km), as in the Mid-State Trail's record. Near Harlan, Kentucky, a 5.8 km stretch of the Pine Mountain Link was mapped twice, as the two carriageways of a divided road, and one was left out. Two stretches of 0.7 and 0.6 km, on Northwestern Pike and on Robert Dann Drive, moved to the alternates too."
source_checked = "2026-11-16"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "The relation's own distance tag is 2600 km, not 2897 km (the association's 1,800 mi). The track is 28 parts: three long ones of 445, 428 and 354 km, and many short pieces with gaps between them. The sections that OpenStreetMap has not joined are missing, so the track is shorter than the published length."

[osm]
relation = 1024490
note = "Hiking route relation named Great Eastern Trail, version 21 (2023-08-01), ref GET, distance tag 2600 km. It holds sub-relations for the trail's sections, among them relation 11385238 for the C&O Canal part, which alone measures 46.3 km and is not used by itself."

[shield]
status = "use-real-logo"
logo_source = "https://www.greateasterntrail.net/wp-content/themes/greateasterntrail/images/logo.png"
contact = "Great Eastern Trail Association"
note = "The Association's own mark (a green compass star around a cream ring with 'Great Eastern Trail'), the header logo of greateasterntrail.net, 298x299 PNG on a white ground. The home page says: 'The logo of the Great Eastern Trail was adopted by the Great Eastern Trail Association in 2007, and has been in continuous use ever since. It is posted on many places on the 1800-mile trail.' No logo policy found on the home page; no other page was read."
logo_file = "shield.png"
logo_owner = "Great Eastern Trail Association"

[verification]
verified = true
date = "2026-11-16"
measured_km = 2358.7
difference_percent = -18.6
parts = 28
note = "OSM relation 1024490: 2,358.7 km in 28 parts, 18.6% short of 2897 km (about 1,800 mi). The earlier track, 2,366.2 km in 34 parts, held a second way at five places, 12.1 km of which moved to alternates.geojson and 5.8 km of which was left out as a copy. The relation reaches from central Alabama to the Finger Lakes Trail in New York. Its three longest parts are 445 km (Alabama to Tennessee), 428 km (Tennessee to Virginia) and 354 km (Pennsylvania to Maryland). The rest is short pieces, so there are gaps between sections."

[hike]
summary = "The Great Eastern Trail links existing trails into a long footpath through the Appalachian Mountains, from Alabama to the Finger Lakes Trail in New York. It crosses nine states and is meant to be a non-motorized hiking trail. The linking is not finished, and new trail is still needed where there are gaps."
official_url = "https://www.greateasterntrail.net/about-us/"
start = "Alabama"
end = "Finger Lakes Trail, New York"
shape = "point-to-point"
travel = "trail"
unfinished = "The trail is made of existing trails that are still being linked, and new trail is needed where gaps remain. Backpacker reported in 2022 that the association had completed over 70 percent since 2007, and that the first end-to-end thru-hike, by two hikers, was in 2013."
days = [120, 180]
checked = "2026-11-19"

[[hike.source]]
url = "https://www.greateasterntrail.net/about-us/"
publisher = "Great Eastern Trail Association"
facts = ["official_url", "summary", "start", "end", "shape", "travel", "unfinished"]

[[hike.source]]
url = "https://www.backpacker.com/trips/trips-by-state/pennsylvania-trails/the-great-eastern-trail-could-be-the-next-appalachian-trail-heres-how-to-hike-part-of-it-now/"
publisher = "Backpacker"
facts = ["unfinished", "days"]

