[hike]
summary = "The Great North Cascades Traverse is a 105 mile backcountry route across North Cascades National Park in Washington, from the Hannegan trailhead near Mount Baker to the Stehekin Shuttle stop at High Bridge, with a shuttle ride on to Stehekin at the head of Lake Chelan. The Park Service says it crosses five mountain passes (Hannegan, Whatcom, Beaver, Fourth of July and Park Creek) and links the temperate rainforests of western Washington with the dry interior of the east. It is one of the long-distance trips the park suggests for people who plan three or more nights in the backcountry."
official_url = "https://www.nps.gov/noca/planyourvisit/long-distance-backcountry-trip-sampler.htm"
start = "Hannegan trailhead, near Hannegan Pass, Washington"
start_lonlat = [-121.592, 48.910]
end = "Stehekin Shuttle stop at High Bridge, in the Stehekin Valley, Washington"
end_lonlat = [-120.838, 48.380]
shape = "point-to-point"
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "Snow keeps the high passes (Hannegan, Whatcom, Park Creek) closed until July and returns in October, which leaves July to September. Confidence: medium."
terrain = ["alpine", "forest"]
travel = "trail"
checked = "2026-11-23"

