# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "great-north-cascades-traverse"
name = "Great North Cascades Traverse"
country = "US"
regions = ["WA"]
length_km = 169
length_note = "105 mi / 169 km, as the National Park Service prints it on its Long Distance Backcountry Trip Sampler page for North Cascades National Park, from the Hannegan trailhead to the Stehekin Shuttle stop at High Bridge. The page ends the walk at the shuttle stop and lists the Stehekin Shuttle among the trails included, so the last stretch to Stehekin is by that shuttle. The page also gives an alternate that follows the Bridge Creek Trail and adds the McAlester Lake, Rainbow Creek, Boulder Creek and Purple Creek trails, for a total of 141 mi / 227 km, and optional additions of the Copper Ridge Trail (4.1 mi / 6.6 km) and the Chelan Lakeshore Trail (19 mi / 30.6 km); the 105 mi figure is the one used."
tier = "regional"
designation = "National Park Service, North Cascades National Park: a long-distance backcountry trip it publishes by name"
wave = 1
places_checked = "2026-11-23"

