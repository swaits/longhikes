licence_text = "No track is included, so no source licence applies to a track. This record names the publisher and the page its facts were read on (https://www.nps.gov/noca/planyourvisit/long-distance-backcountry-trip-sampler.htm, read 2026-11-23; the page says it was last updated August 7, 2017)."
attribution = "none (no line included)"
osm_only = false
mainline = "OpenStreetMap has a relation named The Great North Cascades Traverse (4815933, tagged distance 169), but on 2026-11-23 it held only ways of the Thunder Creek, Park Creek, Panther Creek, Fourth of July, Happy Panther, Upper Stehekin Valley and Cascade Pass trails and of the North Cascades Highway, 83.6 km in one part. It lacks the Hannegan, Chilliwack, Little Beaver and Big Beaver trails and includes a highway and the Cascade Pass Trail, which the Park Service's list for the traverse does not."
source_checked = "2026-11-23"
