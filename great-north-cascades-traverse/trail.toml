line_absent_reason = "No track is included. The Park Service names the trails the traverse follows but publishes no line for it on this page, and the Park Service's public data service held no North Cascades trail layer on 2026-11-23. The only OpenStreetMap relation for it is incomplete (83.6 km of 169 km) and holds a highway and a trail the Park Service's list leaves out, so it is not used. A line made by joining other agencies' trail data by hand was not attempted."

