# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "great-plains-trail"
name = "Great Plains Trail"
short_name = "GPT"
short_name_url = "https://www.greatplainstrail.org/about-the-trail/"
country = "US"
regions = ["SK", "ND", "SD", "NE", "TX"]
length_km = 3540
length_note = "2,200 mi, per the alliance"
kind = "route"
tier = "regional"
designation = "Person-defined route (Steve Myers, Great Plains Trail Alliance); no agency or association"
wave = 1

[source]
status = "none"
publisher = "Steve Myers (Great Plains Trail Alliance), who publishes the route"
publisher_url = "https://greatplainstrail.org"
url = "https://www.greatplainstrail.org/gpt-map/"
format = "No line included"
crs = "EPSG:4326"
licence = "none-stated"
licence_text = "No track is included, so no source licence applies to a track. This record names the creator and the page its facts were read on (https://www.greatplainstrail.org/gpt-map/, read 2026-11-10)."
attribution = "none (no line included)"
osm_only = false
mainline = "No OpenStreetMap route relation for the route was found; the alliance publishes an online map with no GPX."
source_checked = "2026-11-10"
redistributable = true
line_source = "none (no line included)"
line_file = ""
line_absent_reason = "The alliance publishes the route as an online map with no GPX and no licence that allows passing the track on. The route is shown on the alliance's map page."

[osm]
relation = 0
note = "Not recorded: the only OpenStreetMap relation named Great Plains Trail, 21910936, is a 0.46 mi path in St. Charles County, Missouri, not this route."

[shield]
status = "use-real-logo"
logo_source = "https://www.greatplainstrail.org/wp-content/uploads/2012/07/logo_alone.jpg"
contact = "Great Plains Trail Alliance"
note = "A rounded-triangle emblem with a bison and a prairie trail, shown as the trail's logo on greatplainstrail.org. It is the only emblem found for the trail; the trail itself is a route set by its author, so the holder's own emblem is what is used here. The corners are white, not transparent, because the source is a JPEG. Saved as PNG without other changes. The white surround was made transparent."
logo_file = "shield.png"
logo_owner = "Great Plains Trail Alliance"

[verification]
verified = false
note = "No line to measure."

[route]
creator = "Steve Myers (Great Plains Trail Alliance)"
line_policy = "unclear"
creator_words = "This map represents the best routing to date for the entire length of the trail. That said, the route and the map will likely remain 'works in progress' for quite some time to come."
creator_words_url = "https://www.greatplainstrail.org/gpt-map/"
note = "From Grassland National Park in Canada to Guadalupe Peak in Texas, through the Black Hills, the Dakota and Nebraska grasslands and the Texas panhandle, using public roads for long stretches. The alliance publishes the route as an online map and offers no GPX."

[[guide]]
title = "Great Plains Trail map"
author = "Great Plains Trail Alliance"
access = "free"
url = "https://www.greatplainstrail.org/gpt-map/"
format = "online map"

[hike]
summary = "The Great Plains Trail runs north to south through the shortgrass prairies of the Great Plains, from Grassland National Park on the Canada border to the summit of Guadalupe Peak in Texas. It links three national parks, three national monuments, ten national forests and grasslands and fifteen state parks, and much of the way is on public back roads. Bison, pronghorn and prairie songbirds are common sights."
official_url = "https://www.greatplainstrail.org/about-the-trail/"
start = "Grassland National Park, on the Canada-United States border"
end = "Guadalupe Peak, Guadalupe Mountains National Park, Texas"
end_lonlat = [-104.861, 31.891]
shape = "point-to-point"
season = "Spring and fall"
months = [3, 4, 5, 9, 10, 11]
terrain = ["prairie"]
travel = "trail-and-road"
unfinished = "The trail is still being established: the current route links existing trails and public back roads, and new trail is to be built on public lands over time."
caution = "Public roads carry the route for large stretches, and much of the land beside them is private."
checked = "2026-11-14"

[[hike.source]]
url = "https://www.greatplainstrail.org/about-the-trail/"
publisher = "Great Plains Trail Alliance"
facts = ["official_url", "summary", "start", "end", "shape", "terrain", "travel", "unfinished", "caution"]

[[hike.source]]
url = "https://www.greatplainstrail.org/great-plains-trail-newsletter-for-july-2022/"
publisher = "Great Plains Trail Alliance"
facts = ["season", "months"]

[[hike.source]]
url = "https://edits.nationalmap.gov/apps/gaz-domestic/public/summary/1358489"
publisher = "U.S. Geological Survey, Geographic Names Information System"
facts = ["end_lonlat"]

