summary = "The Great Plains Trail runs north to south through the shortgrass prairies of the Great Plains, from Grassland National Park on the Canada border to the summit of Guadalupe Peak in Texas. It links three national parks, three national monuments, ten national forests and grasslands and fifteen state parks, and much of the way is on public back roads. Bison, pronghorn and prairie songbirds are common sights."
