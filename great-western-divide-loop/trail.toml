[hike]
summary = "The Sequoia Great Western Divide Loop is a backpacking loop from Crescent Meadow in Sequoia National Park that crosses the Great Western Divide at Kaweah Gap, past Precipice Lake and the Hamilton Lakes. The walk starts in giant sequoia forest and reaches alpine country above the treeline on the divide."
official_url = "https://www.brianlucido.com/sequoia-great-western-divide-loop/"
