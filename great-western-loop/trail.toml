[hike]
summary = "The Great Western Loop links the Pacific Crest, Pacific Northwest, Continental Divide, Grand Enchantment and Arizona trails together with a trail-less stretch through the Sonoran and Mojave Deserts into one circuit of the American West. It passes through 12 national parks and more than 75 wilderness areas, and there is nothing official about it. Andrew Skurka began and finished at Grandview Point on the South Rim of the Grand Canyon, but the loop has no fixed start."
official_url = "https://andrewskurka.com/adventures/great-western-loop/route-description/"
start = "Grandview Point, Grand Canyon South Rim, Arizona"
start_lonlat = [-111.988, 35.998]
shape = "loop"
days = [208, 208]
high_point = "Forester Pass"
high_point_m = 4017
terrain = ["desert", "alpine", "forest"]
travel = "some-cross-country"
season = "Spring through early fall: the deserts are crossed early, and the high country must be entered as early as the snowpack allows and left before the first winter storms"
months = [4, 5, 6, 7, 8, 9, 10]
caution = "The route has no official termini and no published track; between the Grand Canyon and the Pacific Crest Trail each hiker must make their own route."
checked = "2026-11-14"
season_basis = "primary"

[[hike.source]]
url = "https://andrewskurka.com/adventures/great-western-loop/overview/"
publisher = "Andrew Skurka"
