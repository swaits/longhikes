[[history]]
date = "2026-11-20"
change = "The trail was placed in Glacier National Park, Grand Canyon National Park, Joshua Tree National Park, North Cascades National Park, Sequoia and Kings Canyon National Parks, Yellowstone National Park, Yosemite National Park, Colorado Plateau, Mogollon Rim, North Cascades, San Juan Mountains, Selkirk Mountains, Sierra Nevada, Transverse Ranges, Wind River Range, Anaconda Pintler Wilderness, Ansel Adams Wilderness, Bob Marshall Wilderness, Emigrant Wilderness, Four Peaks Wilderness, Gila Wilderness, John Muir Wilderness, Mazatzal Wilderness, Mount Zirkel Wilderness, Pasayten Wilderness, Salmo-Priest Wilderness, South Sierra Wilderness and Superstition Wilderness from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"before making one final and remarkable ascent to the Continental Divide in Glacier National Park.\" (Glacier National Park) The page says: \"Starting at Grandview Point, the Loop descends into the Grand Canyon and follows the Tonto Trail west to the South Bass Trail.\" (Grand Canyon National Park) The page says: \"The Loop enters the park where the Pinto Wash exits it, and then proceeds cross-country up the waterless Pinto Basin and eventually attains the higher west side of the park at Twin Lakes Campground.\" (Joshua Tree National Park) The page says: \"The Pacific Crest National Scenic Trail is a 2,665-mile footpath from Mexico to Canada that passes through the Sierra Nevada and Cascade Ranges of California, Oregon, and Washington.\" (North Cascades National Park, Sierra Nevada) The page says: \"the gateway to California's High Sierra, which includes three phenomenal National Parks (Kings Canyon, Sequoia, and Yosemite) and several gawk-inducing wilderness areas (South Sierra, John Muir, Ansel Adams, and Emigrant).\" (Sequoia and Kings Canyon National Parks, Yosemite National Park) The page says: \"In Wyoming, the geysers and wildlife of Yellowstone National Park are followed by the phenomenal Wind River Range\" (Yellowstone National Park, Wind River Range) The page says: \"the AZT/GWL climbs through the Mogollon Rim, a sandstone and limestone cliff escarpment that marks the geological boundary of the Colorado Plateau.\" (Colorado Plateau, Mogollon Rim) The page says: \"the PCT's northern terminus in Washington's Pasayten Wilderness.\" (North Cascades, Pasayten Wilderness) The page says: \"Colorado's climax is reached in the San Juan's, which are followed by New Mexico's San Pedro Peaks\" (San Juan Mountains) The page says: \"just before it ascends back up into the Selkirks, far north in Idaho's Panhandle.\" (Selkirk Mountains) The page says: \"the PCT/GWL travels 475 miles through the San Bernardino and San Gabriel Ranges, across the Mojave Desert's Antelope Arm, and along the Tehachapi Mountains\" (Transverse Ranges) The page says: \"The remaining 600 miles through Montana are highlighted by the Bob Marshall Wilderness, the Anaconda-Pintler Wilderness, the Centennial Mountains, and the Spanish Peaks.\" (Anaconda Pintler Wilderness, Bob Marshall Wilderness) The page says: \"several gawk-inducing wilderness areas (South Sierra, John Muir, Ansel Adams, and Emigrant).\" (Ansel Adams Wilderness, Emigrant Wilderness, John Muir Wilderness, South Sierra Wilderness) The page says: \"North of the dam is the Four Peaks Wilderness followed by the Mazatzal Wilderness, home to a view-filled 7,000-foot ridgeline.\" (Four Peaks Wilderness, Mazatzal Wilderness) The page says: \"The CDT/GWL enter the Gila Wilderness, and at the Gila Clif Dwellings National Monument Visitor Center the GWL leaves the CDT to join the Grand Enchantment Trail.\" (Gila Wilderness) The page says: \"the route descends into the high plains to cross the Great Divide Basin before entering Colorado in the Mt. Zirkel Wilderness.\" (Mount Zirkel Wilderness) The page says: \"It soon enters the Salmo-Priest Wilderness before dropping down into the Upper Priest Valley\" (Salmo-Priest Wilderness) The page says: \"where they all head north into the Tortilla Mountains and Superstition Wilderness.\" (Superstition Wilderness)"
basis_url = "https://andrewskurka.com/adventures/great-western-loop/route-description/"
asked_by = "the dataset's own check"
outcome = "applied"
