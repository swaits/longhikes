summary = "The Green River Lakes & Titcomb Basin Loop is a backpacking loop of six to fourteen days in the northern Wind River Range of Wyoming, from the Green River Lakes trailhead. It follows the Green River and the Highline Trail past Three Forks Park, Vista Pass, Cube Rock Pass and Shannon Pass to Island Lake and Titcomb Basin, and returns by Elbow Lake, Summit Lake, Palmer Canyon and Porcupine Creek. Douglas Lorain describes it as Trip 15 in Backpacking Wyoming."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-wyoming/"
start = "Green River Lakes trailhead, Bridger-Teton National Forest, Wyoming"
shape = "loop"
days = [6, 14]
season = "Usually open mid-July to early October, best late July and August"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "None required, as the book states; it says to sign in at the trailhead."
caution = "The book says the trail can be quite crowded, especially around Island Lake and Titcomb Basin, with mosquitoes in July and early August and frequent thunderstorms. A few stream crossings are potentially difficult if the bridges are not in place, and the book says a washed-out bridge over Clear Creek leaves a tricky ford that can be difficult before midsummer. Fires are prohibited above treeline, groups are limited to 15 people and 25 stock, and camping is prohibited within 100 feet of streams and 200 feet of lakes or trails. The author rates its difficulty 6 out of 10."
