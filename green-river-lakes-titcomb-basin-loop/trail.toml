id = "green-river-lakes-titcomb-basin-loop"
name = "Green River Lakes & Titcomb Basin Loop"
country = "US"
regions = ["WY"]
length_km = 114
length_note = "70.9 mi, as the book gives it for Trip 15 (page 131), with 10,100 ft of elevation gain and 6 to 14 days. The book's days assume about 10 miles a day. The 70.9 miles is the loop plus the walk into Titcomb Basin and back out: the spur into the basin is about 11.8 miles each way by the book's map figures. The figures are the book's own and are not measured from a track. The book's text calls the spur a long side trip, while the trip's name and its main figure include it, and this record keeps it as part of the trip as the author names and measures it. The published figure stays as the length."
