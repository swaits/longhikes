fields = ["hike.end", "hike.end_lonlat"]
basis = "The publisher's route page ends the route at the Weeping Wall at the bottom of Zion Canyon, by the East Rim Trail; OpenStreetMap contributors (ODbL) map the East Rim trailhead on the canyon floor as the Weeping Rock Trailhead, OpenStreetMap node 13121914017."
basis_url = "https://nominatim.openstreetmap.org/ui/details.html?osmtype=N&osmid=13121914017"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
date = "2026-11-19"
change = "The start is now named as Salt Valley at the northern boundary of Arches National Park, and its position was added, so that the page can show a map of the whole trail. The caution now gives the Park Service's 5 September 2025 report on the Weeping Rock Trail and the East Rim Trail."
fields = ["hike.start", "hike.start_lonlat", "hike.caution"]
basis = "The trail's own site says the trail begins at the northern boundary of Arches National Park in Salt Valley; Andrew Skurka's Hayduke Trail Hiking Resources Bundle describes the same boundary. OpenStreetMap contributors (ODbL) map the cattle grid where Salt Valley Road crosses that boundary, OpenStreetMap node 11866946196. The Park Service's news release gives the Weeping Rock reopening and says the East Rim Trail to Observation Point remained closed."
basis_url = "https://nominatim.openstreetmap.org/ui/details.html?osmtype=N&osmid=11866946196"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
