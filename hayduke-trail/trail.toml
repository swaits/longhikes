[[history]]
date = "2026-11-20"
change = "The trail was placed in Arches National Park, Bryce Canyon National Park, Canyonlands National Park, Capitol Reef National Park, Glen Canyon National Recreation Area, Grand Canyon National Park, Zion National Park and Colorado Plateau from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"Sections of the Hayduke pass through many national parks, including Arches, Bryce Canyon, Canyonlands, Capitol Reef, Grand Canyon, and Zion, and other public lands managed by the National Park Service, U.S.\" (Arches National Park, Bryce Canyon National Park, Canyonlands National Park, Capitol Reef National Park, Grand Canyon National Park, Zion National Park) The page says: \"Encompassed in the route are Arches, Canyonlands, Capitol Reef, Bryce Canyon, Grand Canyon and Zion National Parks as well as Grand Staircase-Escalante National Monument, Glen Canyon National Recreation Area and numerous National Forests, BLM Districts, Primitive Areas, Wilderness Areas and Wilderness Study Areas.\" (Glen Canyon National Recreation Area) The trail's own description says: \"The Hayduke Trail is an extremely challenging backcountry route linking six national parks of the Colorado Plateau, from Arches to Zion across southern Utah and northern Arizona.\" (Colorado Plateau)"
basis_url = "https://www.nps.gov/cany/planyourvisit/hayduke.htm"
asked_by = "the dataset's own check"
