[hike]
summary = "The Hayduke Trail is an extremely challenging backcountry route linking six national parks of the Colorado Plateau, from Arches to Zion across southern Utah and northern Arizona. It lies entirely on public land, taking in Canyonlands, Capitol Reef, Bryce Canyon and Grand Canyon as well as the wild country between them. It is named for a character in Edward Abbey's novel The Monkey Wrench Gang."
official_url = "https://www.hayduketrail.org"
start = "Salt Valley, at the northern boundary of Arches National Park, Utah"
start_lonlat = [-109.685, 38.815]
end = "Weeping Wall (mapped as Weeping Rock), Zion Canyon, Zion National Park, Utah"
end_lonlat = [-112.939, 37.271]
shape = "point-to-point"
season = "Spring and fall"
months = [3, 4, 5, 9, 10, 11]
high_point = "Mount Ellen (South Summit)"
high_point_m = 3481
terrain = ["desert", "canyon"]
travel = "mostly-cross-country"
permit = "Permits are needed from each national park and monument the route crosses, among them Arches, Canyonlands, Capitol Reef, Grand Canyon and Zion."
caution = "The route is largely off-trail and unsigned, and its creators warn that only very experienced desert backpackers in peak condition should attempt it. The National Park Service said on 5 September 2025 that it had reopened the Weeping Rock Trail and its shuttle stop in Zion Canyon, and that the East Rim Trail to Observation Point, which starts there, remained closed."
checked = "2026-11-14"
season_basis = "source"

