[hike]
summary = "The Heart Lake & Two Ocean Plateau Loop is a backpacking loop of five to ten days in the southeast of Yellowstone National Park, Wyoming, from the Heart Lake Trailhead on the south entrance road. It passes the Heart Lake Geyser Basin and Heart Lake, follows the Trail Creek Trail past Outlet Lake and over the Continental Divide, crosses Two Ocean Plateau and returns up the Snake River. Douglas Lorain describes it as Trip 5 in Backpacking Wyoming."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-wyoming/"
start = "Heart Lake Trailhead, Yellowstone National Park, Wyoming"
shape = "loop"
days = [5, 10]
season = "Usually open mid-July to October, best mid-August through September"
months = [7, 8, 9, 10]
terrain = ["forest", "lakes"]
travel = "trail"
permit = "A permit is required, as the book states. It advises reservations, especially for camps near Heart Lake, and names the Old Faithful Ranger Station as the nearest place to pick one up."
caution = "The book says grizzly bears are common, that the trail has several potentially difficult river fords early in the season, and that there are many miles of shadeless burned areas and lots of mosquitoes in early summer. Camping permits near Heart Lake are hard to get. Access to Heart Lake is closed from April 1 to June 30, the Trail Creek Trail along the south shore of Yellowstone Lake is closed before July 14, and off-trail travel in the Two Ocean Plateau Bear Management Area needs a permit from July 15 to August 21 and is prohibited the rest of the hiking season. Fires are allowed only at specified camps and all food must be stored away from bears at all times. The author rates its difficulty 7 out of 10."
