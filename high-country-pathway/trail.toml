[hike]
summary = "The High Country Pathway is a loop for backpackers through the northern Lower Peninsula of Michigan, around the Pigeon River Country State Forest and neighbouring state forest land. It passes through hardwood forest, meadows and wetlands, with nine state forest campgrounds along the way. Hikers share it with mountain bikers."
official_url = "https://www.michigan.gov/recsearch/trails/high-country-pathway"
