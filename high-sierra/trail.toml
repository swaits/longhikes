[hike]
summary = "The High Sierra Trail leads from Crescent Meadow in Sequoia National Park over the Great Western Divide at Kaweah Gap and down to the Kern River canyon, joining the John Muir Trail for the climb to Mount Whitney. It starts in giant sequoia forest, crosses alpine country above the treeline and ends with a descent to Whitney Portal."
official_url = "https://www.nps.gov/seki/planyourvisit/high-sierra-trail.htm"
start = "Crescent Meadow, Sequoia National Park"
end = "Whitney Portal, California"
shape = "point-to-point"
days = [6, 7]
high_point = "Mount Whitney"
high_point_m = 4421
terrain = ["forest", "alpine", "canyon"]
travel = "trail"
permit = "A wilderness permit for the High Sierra Trail is required, and only a High Sierra Trail permit is valid for the stretch between Seven Mile Hill and Kaweah Gap."
season = "July to early September"
months = [7, 8]
checked = "2026-11-19"
season_basis = "source"

