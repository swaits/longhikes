[hike]
summary = "The High Sierra Trail leads from Crescent Meadow in Sequoia National Park over the Great Western Divide at Kaweah Gap and down to the Kern River canyon, joining the John Muir Trail for the climb to Mount Whitney. It starts in giant sequoia forest, crosses alpine country above the treeline and ends with a descent to Whitney Portal."
