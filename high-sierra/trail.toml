fields = ["source.line_file", "source.status", "source.publisher", "source.url", "source.discovery", "source.format", "source.licence", "source.licence_text", "source.attribution", "source.osm_only", "source.mainline", "source.line_source", "source.length_gap_note", "osm.note", "verification", "length_note"]
basis = "The Park Service's page for the trail gives the route from Crescent Meadow to the junction with the John Muir Trail at Wallace Creek, 49 miles, then the John Muir Trail to Mount Whitney, and the descent to Whitney Portal; its table of distances ends at Whitney Portal at 72.2 miles (115.5 km) and says the distances include the 4.8-mile round trip to the summit. The Park Service's Park Atlas layer holds the trail within the parks and the Forest Service layer holds the Mount Whitney Trail to Whitney Portal."
