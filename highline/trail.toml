# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "highline"
name = "Highline National Recreation Trail"
country = "US"
regions = ["AZ"]
length_km = 89
length_note = "55 mi, as the Forest Service's Tonto National Forest page states it; the same page also says 'over 50 miles'"
tier = "regional"
designation = "National Recreation Trail #31 (Forest Service, Tonto National Forest); part of it is a passage of the Arizona National Scenic Trail"
wave = 1

[source]
status = "osm-only"
publisher = "USDA Forest Service, Tonto National Forest, Payson Ranger District (publishes the trail; its trail layer was read and not used for the track)"
publisher_url = "https://www.fs.usda.gov/r03/tonto/recreation/trails/highline"
url = "https://www.openstreetmap.org/relation/4188405"
discovery = "osm-relation-version: Overpass `rel(4188405); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation (route=hiking), read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 4188405."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 4188405 'Highline Trail #31' (operator United States Forest Service, ref 31), version 20 (2026-07-30): one route relation of 21 ways, every one with the empty role, so all of it is the main line; there are no alternates."
source_checked = "2026-11-19"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "The track is 93.2 km in one part, 4.7% over the 89 km (55 mi) the Forest Service's page gives. The Forest Service's own trail layer (trail 31, HIGHLINE, 13 features) follows the same route from Pine to the east end near Washington Park but measures 71.5 km in 3 parts with two gaps of 0.3 and 0.7 km, 23% less than the relation along the same route and 11.5% less than the 50.2 miles its own milepost fields give; it was the track until 2026-11-19. Over about 14 km east of Pine (between 9 and 13 km along the trail) the two lines differ by up to 0.8 km, which may be the 2022 reroute the Forest's page mentions. The relation traces the tread with its bends and switchbacks, which the layer's lines smooth, and it is the whole route in one piece."

[osm]
relation = 4188405
note = "OSM relation 4188405 'Highline Trail #31' (operator United States Forest Service), version 20, 21 ways, 93.2 km in 1 part. Read again with tools/osm_track.py on 2026-11-19; it is now the source of the track."

[shield]
status = "no-logo-exists"
logo_source = ""
contact = "Tonto National Forest"
note = "No emblem of the trail itself exists at an allowed source. The Forest Service trail page https://www.fs.usda.gov/r03/tonto/recreation/trails/highline was read in full: it carries only the USDA and Forest Service agency logos and generic recreation activity icons. As a National Recreation Trail it falls under that program's shared marker insignia, which is not this trail's own emblem; the emblem of the Arizona National Scenic Trail, which shares part of the tread, is that other trail's mark."
logo_file = ""
logo_owner = "USDA Forest Service"

[verification]
verified = true
date = "2026-11-19"
measured_km = 93.2
difference_percent = 4.7
parts = 1
note = "OSM relation 4188405, 21 ways: 93.2 km in 1 part, 4.7% over the Forest Service's 55 mi (89 km). The Forest Service layer on the same route measures 71.5 km in 3 parts."

[hike]
summary = "The Highline Trail runs east and west below the Mogollon Rim in Tonto National Forest, Arizona, with Pine as its main starting point. It crosses rim canyons, brushy hills and stands of ponderosa pine, and part of it, between Washington Park and Pine, is a passage of the Arizona National Scenic Trail. It is open to hikers, horse riders and mountain bikers."
official_url = "https://www.fs.usda.gov/r03/tonto/recreation/trails/highline"
start = "Pine Trailhead, near Pine, Arizona"
shape = "point-to-point"
terrain = ["forest", "canyon"]
travel = "trail"
days = [4, 7]
checked = "2026-11-19"
season = "Spring and autumn (April-May, September-November)"
months = [4, 5, 9, 10, 11]
season_basis = "source"

[[hike.source]]
url = "https://www.fs.usda.gov/r03/tonto/recreation/trails/highline"
publisher = "USDA Forest Service, Tonto National Forest"
facts = ["official_url", "summary", "start", "shape", "terrain", "travel"]

[[hike.source]]
url = "https://www.arizonahighways.com/archive/issues/chapter/Doc.825.Chapter.5"
publisher = "Arizona Highways"
facts = ["days"]

[[hike.source]]
url = "https://outdoorpilgrim.com/highline-overview/"
publisher = "Outdoor Pilgrim"
facts = ["season", "months"]

[[link]]
title = "Arizona Highline Trail"
publisher = "LongTrailsWiki"
url = "https://www.longtrailswiki.net/wiki/Arizona_Highline_Trail"

