[[guide]]
title = "Hoosier Heritage Trail Guide and Map Set, 2026"
author = "Hoosier Heritage Trail Association"
access = "free"
url = "https://hoosierheritagetrail.org/wp-content/uploads/2026/11/Hoosier-Heritage-Trail-2026-Mapset.pdf"
format = "PDF of 32 pages, updated 11/15/2026, offered on the association's Downloads page. Its contents list covers water, hunting season, trail maintenance reports, trailheads and parking, and a map for each section of the trail."

[hike]
summary = "The Hoosier Heritage Trail is a long-distance trail across Indiana, published by the Hoosier Heritage Trail Association. It runs 161 miles from the Knobstone trailhead in Deam Lake State Recreation Area to the Bryant Creek Lake boat ramp in Morgan-Monroe State Forest. About three quarters is forested dirt trail and the rest is quiet rural roads, many of them gravel. The association's president says the longest stretch between legal forest campsites is 13.3 miles. The association says it aims to build a trail of more than 400 miles between the Falls of the Ohio and the Indiana Dunes."
official_url = "https://hoosierheritagetrail.org/"
start = "Knobstone trailhead, Deam Lake State Recreation Area, Indiana"
end = "Bryant Creek Lake boat ramp and parking area, Morgan-Monroe State Forest, Indiana"
shape = "point-to-point"
travel = "trail-and-road"
start_lonlat = [-85.863, 38.462]
end_lonlat = [-86.477, 39.323]
checked = "2026-11-20"
season = "March to May and September to November"
months = [3, 4, 5, 9, 10, 11]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Indiana has hot, humid summers with ticks and thick vegetation, so spring and fall are the most comfortable months. Confidence: medium."

