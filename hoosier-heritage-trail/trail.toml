length_km = 259
length_note = "161 mi (259 km) is the current official length, as the association's president states on this dataset's issue tracker and as the association's home page now gives it throughout. There was a 170 mi version. Tornado damage and salvage logging made part of it very difficult, so the association has shortened the official trail for now. An article of May 2026 on the association's site, comparing Indiana's backpacking trails, still lists the 170 mi version."
tier = "regional"
designation = "Hoosier Heritage Trail Association, an Indiana non-profit; a trail it describes as the newest of Indiana's long backpacking trails"
