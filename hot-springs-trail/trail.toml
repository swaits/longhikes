fields = ["place"]
basis = "The page says: \"These are undoubtedly some of the most striking miles of the trail as they overlook the Ruby Lakes basin and the Ruby Mountains, which are traversed during the next section.\" (Ruby Mountains) The page says: \"Part 2 - The High Sierra Hot Springs Trail\" (Sierra Nevada) The page says: \"At Solider Creek, the options rejoin and the trail follows singletrack into the East Humboldt Wilderness.\" (East Humboldts Wilderness) The page says: \"while the hike-thru option continues up Marys River, going thru the Jarbidge Wilderness area and the remote outpost of Jarbidge, which has a post office.\" (Jarbidge Wilderness)"
basis_url = "https://outsideways.com/routes/us/hot-springs-trail/"
asked_by = "the dataset's own check"
outcome = "applied"

