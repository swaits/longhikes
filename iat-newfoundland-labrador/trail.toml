publisher_url = "https://iatnl.org/"
url = "https://www.openstreetmap.org/relation/15695142"
format = "OpenStreetMap route relation (route=hiking), read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-16). The track included here is from OpenStreetMap, relation 15695142."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 15695142: one hiking route relation, 347 main ways, no alternates."
source_checked = "2026-11-16"
redistributable = true
