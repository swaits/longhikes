[osm]
relation = 15695142
note = "Hiking route relation named International Appalachian Trail (Newfoundland), version 21 (2026-10-12), network iwn, 347 ways. The chapter's own GPS track states no licence and is not used."

[shield]
status = "use-real-logo"
logo_source = "https://iatnl.org/wp-content/uploads/2023/04/cropped-IAT-IATNL2023-1s.gif"
contact = "International Appalachian Trail Newfoundland and Labrador"
note = "The emblem is the blue and white SIA AT trail sign (hiker, the letters SIA AT and www.iat-sia.org), the International Appalachian Trail blaze used by the chapter. It is the left-hand element of the header logo at iatnl.org (shown on the about and thru-hikers pages). Cropped from that header logo to the blue frame; the large IATNL letters beside it were cut off. The sign inside the frame is kept whole. At 111 by 317 px it is the only artwork of the sign on the chapter's site. Also checked: iatnl.org home, about, contact and thru-hikers pages (the chapter's HTML returned 406 to a direct read, so the pages were read through a plain fetch and the media file itself downloaded directly), and Wikimedia Commons (no chapter emblem)."
logo_file = "shield.png"
logo_owner = "International Appalachian Trail Newfoundland and Labrador"

[verification]
verified = true
date = "2026-11-16"
measured_km = 742.7
difference_percent = -1.0
parts = 1
note = "OSM relation 15695142, 347 ways: 742.7 km in 1 part, 1.0% short of 750 km, and 0.2% short of the 743 km the IAT/SIA council gives."

[hike]
summary = "The International Appalachian Trail in Newfoundland is a thru-hiker route from Port aux Basques north along the island's west coast to Crow Head, at the tip of the Great Northern Peninsula. It joins sections of the Newfoundland T'Railway, gravel logging roads and secondary highways, and backcountry trails and routes branch from it."
official_url = "https://iatnl.org/thru-hikers/"
start = "Port aux Basques, Newfoundland"
end = "Crow Head, Newfoundland"
start_lonlat = [-59.135, 47.596]
shape = "point-to-point"
travel = "trail-and-road"
unfinished = "The chapter's stated goal is a 750 km extension of the trail; as of 2023 it is made of T'Railway sections, gravel logging roads, backcountry trails and routes, and secondary highways."
checked = "2026-11-14"

