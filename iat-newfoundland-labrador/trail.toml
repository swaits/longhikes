# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "iat-newfoundland-labrador"
name = "International Appalachian Trail, Newfoundland and Labrador"
short_name = "IATNL"
short_name_url = "https://iatnl.org/thru-hikers/"
country = "CA"
regions = ["NL"]
length_km = 750
length_note = "750 km (450 mi), the chapter's stated goal for the extension from Port aux Basques to Crow Head, from the IATNL About page; the IAT/SIA council gives 743 km"
tier = "regional"
designation = "International Appalachian Trail Newfoundland and Labrador (chapter of the International Appalachian Trail)"
wave = "held"
wave_note = "Held: the chapter's own pages describe a thru-hiker route from Port aux Basques to Crow Head and give 750 km as its goal, but the route is made largely of T'Railway sections, gravel logging roads and highways, is described by the chapter as an extension it aims to build, and no track is included. The Quebec and New Brunswick part is the record sentier-international-appalaches."

