country = "US"
regions = ["WI"]
length_km = 1931
length_note = "About 1,200 mi for the whole route, as the Ice Age Trail Alliance gives it: nearly 700 mi of yellow-blazed trail and about 500 mi of unmarked connecting routes."
built_km = 1127
tier = "national"
designation = "National Scenic Trail (1980)"
wave = 1
inclusion = "nst-unconditional"
