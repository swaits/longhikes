[source]
status = "osm-only"
publisher = "Ice Age Trail Alliance for the National Park Service"
publisher_url = "https://services.arcgis.com/EeCmkqXss9GYEKIZ/arcgis/rest/services/IAT_Segments_CR/FeatureServer/0"
url = "https://www.openstreetmap.org/relation/2381423"
discovery = "osm-relation-version: Overpass `rel(2381423); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap super-relation 2381423 with its 219 sub-relations, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 2381423. The publisher's own track is not licensed for redistribution and is not used."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "Super-relation 2381423 holds 138 relations in the main role (the trail's segments) and 81 marked 'connection' (the unmarked connecting routes and road walks between segments, which the Ice Age Trail Alliance counts in the trail's 1,200 miles). The main track is the segments and the connecting routes together, in order from Interstate State Park in the west to Potawatomi State Park in the east. Ways with the roles approach, excursion and alternative are in alternates.geojson, as is every segment or connection way that is not on the walk. In central Wisconsin the trail has a western and an eastern branch between Chaffee Creek and Devil's Lake; no source read names either branch as the main route, so the eastern branch was taken as the main track by default (Karner Blue, Montello, John Muir Park, Portage Canal and Sauk Point, 135 km) and the western branch (the Baraboo-Chaffee Creek connection, 131 km) is in alternates.geojson. The branches were told apart by the relations' own names and by geometry."
source_checked = "2026-11-09"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "The main track is 1,788.5 km in 40 parts, 7.4% short of 1,931 km (about 1,200 mi). OpenStreetMap has no way joining the parts: most gaps are 100 to 370 m, one is 0.85 km (at Madison) and one is 7.0 km (between Greenbush and LaBudde Creek, near the Kettle Moraine). The trail is also not finished, and the connecting routes change from year to year."

[osm]
relation = 2381423
note = "Super-relation 2381423 with 219 sub-relations; 138 in the main role and 81 marked 'connection'. Downloaded 2026-11-09. Re-cut 2026-11-16: the main track is now 1,513 ways, segments and connections in order from west to east by the eastern branch, with 1,046 pieces (225.0 km) in alternates."

[shield]
status = "use-real-logo"
logo_source = "https://www.nps.gov/iatr/planyourvisit/images/Ice-Age-NST-Trailmark.png"
contact = "National Park Service (Ice Age National Scenic Trail)"
note = "The official Ice Age National Scenic Trail marker: a woolly mammoth in a rounded triangle. It is shown in use as the official trail marker logo at https://www.nps.gov/iatr/planyourvisit/index.htm. The transparent border was trimmed and the 3000 px original reduced to 1024 px. The Federal Register notice of 2000-03-28 established the Ice Age marker as federal insignia; use needs NPS permission. The same mark is shown smaller at https://www.iceagetrail.org/."
logo_file = "shield.png"
logo_owner = "National Park Service"

[verification]
verified = true
date = "2026-11-09"
measured_km = 1788.5
difference_percent = -7.4
parts = 40
note = "Segments and connecting routes in order, by the eastern branch: 1,788.5 km in 40 parts, 7.4% short of 1,931 km (about 1,200 mi). The earlier track, the built segments alone, was 1,141.0 km in 89 parts. Alternates (225.0 km) hold the western branch, side trails and the rest."

[hike]
summary = "The Ice Age Trail is a footpath of about 1,200 miles across Wisconsin that traces the landscape left by the last continental glacier, from Interstate State Park at St. Croix Falls to Potawatomi State Park at Sturgeon Bay. It crosses some of the state's most beautiful natural areas and leads hikers right down the main streets of Wisconsin communities. The trail is managed by a partnership of the National Park Service, the Wisconsin Department of Natural Resources and the Ice Age Trail Alliance."
official_url = "https://www.iceagetrail.org/explore/explore-the-trail/ice-age-trail/"
start = "Interstate State Park, St. Croix Falls, Wisconsin"
end = "Potawatomi State Park, Sturgeon Bay, Wisconsin"
shape = "point-to-point"
terrain = ["forest", "prairie", "lakes"]
travel = "trail-and-road"
unfinished = "The trail is about half complete: nearly 700 miles are yellow-blazed Ice Age Trail, and about 500 miles of unmarked connecting routes, mostly on quiet country roads, link the blazed segments."
caution = "Primitive camping is not permitted on many segments, so overnight plans vary widely from night to night."
permit = "No National Park Pass or fee is needed to use the trail."
checked = "2026-11-20"
season = "May to October"
months = [5, 6, 7, 8, 9, 10]
season_basis = "sources"
season_method = "The pages differ: one Trek page gives summer and fall and another gives summer only. It was set by judgement from both and from the climate, since snow and mud last through April and a hard freeze comes by November. Confidence: medium."

