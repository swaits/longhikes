mainline = "OpenStreetMap holds no whole-trail relation. 10758083 'Idaho Centennial Trail (West)' gives four pieces in central Idaho (45.45 to 46.35 N, 277 km); 19215740 'Idaho Centennial Trail' gives one 15.5 km piece at Upper Priest Lake (48.75 to 48.84 N), the Upper Priest Lake Trail near the Canadian border, which is the trail's northern end. That piece is 291 km north of the nearest other piece and nothing is mapped between them, so the track is a partial track in two distant groups of pieces, not one walk. All five parts are in line.geojson; no alternates are mapped."
