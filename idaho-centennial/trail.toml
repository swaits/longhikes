[hike]
summary = "The Idaho Centennial Trail is the state trail of Idaho, running from Murphy Hot Springs on the Nevada border north through mountains and high desert to the state's northern boundary. It crosses 11 national forests and about 100 miles of Bureau of Land Management land, climbing and dropping between 2,500 and 9,000 feet through sagebrush desert, alpine meadows, cedar forests and six major river canyons."
official_url = "https://idpr-data-idaho.hub.arcgis.com/datasets/idaho::idaho-centennial-trail-official-route/about"
start = "Murphy Hot Springs, on the Idaho-Nevada border"
end = "the northern boundary of Idaho, at the Canadian border"
shape = "point-to-point"
terrain = ["desert", "alpine", "forest"]
caution = "Only a few people have completed the trail; the Bureau of Land Management notes the challenge and time commitment involved."
season = "South-to-north hikes start in early June and finish by late September or early October"
months = [6, 7, 8, 9]
checked = "2026-11-19"
season_basis = "primary"

