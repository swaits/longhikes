[hike]
summary = "The Maine section of the International Appalachian Trail starts in Katahdin Woods and Waters National Monument, east of Baxter State Park, and runs north and east to Fort Fairfield on the Canadian border. It follows trail, logging roads, an old tote road, rail-trail and road, then crosses Mars Hill Mountain and follows the border north."
official_url = "https://maineiat.org/?p=412"
start = "Barnard Mountain Trailhead, Katahdin Loop Road, Katahdin Woods and Waters National Monument, Maine"
start_lonlat = [-68.761, 45.916]
end = "Fort Fairfield, Maine"
end_lonlat = [-67.834, 46.772]
shape = "point-to-point"
terrain = ["forest", "farmland"]
travel = "trail-and-road"
caution = "Much of the route is on roads, because the chapter has relied on landowners' permission to secure the route."
checked = "2026-11-20"
season = "June to October"
months = [6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Northern Maine is snowbound and muddy until late May and frozen from November, and fall is best once the bugs fade. Confidence: medium."

