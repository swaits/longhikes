# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "island-walk"
name = "The Island Walk"
short_name = "IW"
short_name_url = "https://theislandwalk.ca/"
country = "CA"
regions = ["PE"]
length_km = 700
length_note = "700 km, from the Island Walk PEI page"
tier = "regional"
designation = "Island Walk PEI Inc."
wave = 1

[source]
status = "osm-only"
publisher = "Island Walk PEI Inc. (publishes the route; no open geometry found)"
publisher_url = "https://theislandwalk.ca/"
url = "https://www.openstreetmap.org/relation/12307947"
discovery = "osm-relation-version: Overpass `rel(12307947); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 12307947."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 12307947: the whole 700 km loop around Prince Edward Island."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 12307947
note = "Downloaded 2026-11-10; 586 ways in the main track. release.txt has the source and date."

[shield]
status = "use-real-logo"
logo_source = "https://theislandwalk.ca/wp-content/uploads/2025/08/Island-Walk-logo-EN.png"
contact = "Island Walk PEI Inc."
note = "The trail's own emblem: a wide coastal badge with the name The Island Walk inside the shape, a walker above shore, fields and spruces. It is the header logo on the trail's own site, theislandwalk.ca, shown on every page. The transparent margin was trimmed with a small even border added; nothing else was changed. No terms for the logo were found on the site. The first search missed it because it read the home page as text only."
logo_file = "shield.png"
logo_owner = "Island Walk PEI Inc."

[verification]
verified = true
date = "2026-11-10"
measured_km = 655.0
difference_percent = -6.4
parts = 4
note = "OSM relation 12307947, 586 ways: 655.0 km in 4 parts, 6.4% short of the published 700 km. The pieces do not all join: OpenStreetMap is missing the connectors between them."

[hike]
summary = "The Island Walk is a loop around Prince Edward Island through 32 sections, passing through the island's two cities, Charlottetown and Summerside, and many small communities. Just over half of it is on the Confederation Trail and red clay roads, with most of the rest on the shoulders of quiet secondary roads, and it is not technically difficult."
official_url = "https://theislandwalk.ca/"
shape = "loop"
days = [32, 32]
season = "May to October"
months = [5, 6, 7, 8, 9, 10]
terrain = ["coast"]
travel = "trail-and-road"
checked = "2026-11-14"
season_basis = "primary"

[[hike.source]]
url = "https://theislandwalk.ca/come-back-different/about-the-island-walk/"
publisher = "Island Walk PEI Inc."
facts = ["official_url", "summary", "shape", "days", "terrain", "travel"]

[[hike.source]]
url = "https://theislandwalk.ca/"
publisher = "Island Walk PEI Inc."
facts = ["summary", "shape"]

[[hike.source]]
url = "https://theislandwalk.ca/partner/"
publisher = "Island Walk PEI Inc."
facts = ["season", "months"]

