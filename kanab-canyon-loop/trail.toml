terrain = ["canyon"]
travel = "some-cross-country"
permit = "A permit is required to camp within Grand Canyon National Park, as the book states."
caution = "The book says much of this loop is strenuous cross-country hiking, that every member of the party should be fit and that the leader should have experience hiking cross-country in the Grand Canyon; it tells parties without that experience to choose an on-trail Grand Canyon hike instead. The author rates its difficulty 9 out of 10. The book lists water at Kanab Creek, the Colorado River and Deer Creek, and only seasonally in Indian Hollow and at Mountain Sheep Spring. Campfires are not allowed in the park's backcountry, and pets are not allowed on trails or in the backcountry."
