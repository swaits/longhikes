[shield]
status = "no-logo-exists"
logo_source = "https://northcountrytrail.org/trail/minnesota/kek/"
contact = "Kekekabic Trail Club"
note = "No emblem of its own was found. Looked at https://www.fs.usda.gov/r09/superior/recreation/trails/kekekabic-trail-west (USDA and Forest Service agency logos only), at the Kekekabic Trail Club's address https://www.kek.org/ (which redirects to the North Country Trail Association chapter page https://northcountrytrail.org/trail/minnesota/kek/ ), and in that association's media library. The only Kekekabic artwork there is the North Country Trail Association's chapter lockup (its north-star and wordmark with 'KEKEKABIC TRAIL CHAPTER' under it) and a guidebook cover. Those are the parent organisation's marks for its chapter; this trail is a part of the North Country Trail and carries that trail's marking, so it has no crest of its own to take."
logo_file = ""
logo_owner = "Kekekabic Trail Club"

[verification]
