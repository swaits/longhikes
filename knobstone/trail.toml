# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "knobstone"
name = "Knobstone Hiking Trail"
short_name = "KHT"
short_name_url = "https://www.knobstonehikingtrail.org/"
country = "US"
regions = ["IN"]
length_km = 257
length_note = "160 mi published by the Knobstone Hiking Trail Association. Its four sections are 45, 37.9, 28.4 and 42.7 mi and sum to 154.0 mi."
tier = "regional"
designation = "Knobstone Hiking Trail Association; southern section managed by Indiana Department of Natural Resources"
wave = 1

[source]
status = "osm-only"
publisher = "Indiana Department of Natural Resources (publishes the southern Knobstone section; no open geometry found)"
publisher_url = "https://www.in.gov/dnr/forestry/properties/knobstone-trail-conditions-reroutes-maps/knobstone-trail-about/"
url = "https://www.openstreetmap.org/relation/4644135"
discovery = "osm-relation-version: Overpass `rel(4644135); out meta;` `rel(7240414); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relations (route=hiking), read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-16). The track included here is from OpenStreetMap, relation 4644135, relation 7240414."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relations 4644135 (Knobstone Trail, 16 ways, all main) and 7240414 (Tecumseh Trail, 64 main ways and 3 alternate ways), joined. At the northern end of the Knobstone relation, near Delaney Park, the relation holds three ways between the same two points (a 4.1 km way, and two routes of 8.8 and 13.5 km that share part of their length) and gives no role to any of them. No page read says which is the trail, so the track keeps the direct 4.1 km way and the other four ways (15.3 km) are in alternates.geojson."
source_checked = "2026-11-16"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"
length_gap_note = "The included track joins OpenStreetMap relation 4644135 (the southern Knobstone section, from Deam Lake to Delaney Park, 67.3 km once the doubled stretch at Delaney Park is taken out, 82.6 km before) and relation 7240414 (the Tecumseh Trail, 69.8 km). The Pioneer section and the Hoosier National Forest section are not included, because OpenStreetMap has no route relation for them, so the track is 46.7% short of the published 160 mi trail."

[osm]
relation = 4644135
note = "Relation 4644135 'Knobstone Trail' (ref KT, version 29, 2026-04-12), the southern Knobstone section, 82.6 km. Relation 7240414 'Tecumseh Trail' (ref TCM, operator Hoosier Hikers Council, version 25, 2026-06-13), the Tecumseh section, 69.8 km. No relation was found for the Pioneer or Hoosier National Forest sections."

[shield]
status = "use-real-logo"
logo_source = "http://www.knobstonehikingtrail.org/wp-content/uploads/2015/03/khta-logo.png"
contact = "Knobstone Hiking Trail Association"
note = "The Association's emblem for the trail: a brown panel with the shape of Indiana, a path and trees, and 'KHTA'. It is the logo on the Association's about page and home page. Only 82 px wide; no larger file is on the site. Trimmed of its empty border only. No terms for use of the logo are stated on the page."
logo_file = "shield.png"
logo_owner = "Knobstone Hiking Trail Association"

[verification]
verified = true
date = "2026-11-16"
measured_km = 137.1
difference_percent = -46.7
parts = 2
note = "OSM relations 4644135 and 7240414, 76 ways: 137.1 km in 2 parts, 46.7% short of the published 257 km. The earlier track, 152.4 km in 4 parts, held three ways between the same two points at Delaney Park; four of them, 15.3 km, are in alternates.geojson. The parts are separate because their ends are more than 100 m apart."

[hike]
summary = "The Knobstone Hiking Trail runs along the Knobstone Escarpment in southern Indiana, from Deam Lake to Morgan-Monroe State Forest near Martinsville. It has four sections, Knobstone, Pioneer, Hoosier National Forest and Tecumseh, through forested bluffs with many steep climbs and descents. The Knobstone Hiking Trail Association publishes the whole trail."
official_url = "https://www.knobstonehikingtrail.org/150-mile-kht/"
start = "Deam Lake, Indiana"
end = "Morgan-Monroe State Forest, near Martinsville, Indiana"
shape = "point-to-point"
terrain = ["forest"]
travel = "trail-and-road"
permit = "No fee, reservation or permit is required to hike the trail."
unfinished = "The Pioneer section is still being built. It has about 5 miles of trail with about 9 more miles in development, and the rest is on remote county roads."
caution = "Water is scarce along the southern Knobstone section, and July, August and September are the worst months to find it. The Hoosier Heritage Trail Association reported on 2026-03-28, in its article \"A Fond Farewell to the Pioneer Trail\", that after a dispute the easements along the Pioneer section were revoked and hikers are no longer allowed on most of the private land along it. The Knobstone Hiking Trail Association's site still lists the section."
checked = "2026-11-16"
season = "Spring"
months = [3, 4, 5]
season_basis = "primary"

