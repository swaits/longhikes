[hike]
summary = "The Koroc River and Palmer River Loop is a loop of about 90 km through the Torngat Mountains, starting and ending at a gravel airstrip in the Koroc River valley in Quebec. It follows the Koroc River west, crosses to the Palmer River in Newfoundland and Labrador, and returns through the Iberville valley. The airstrip is reached by helicopter or Twin Otter from the Torngat Mountains base camp or from Kuujjuaq."
official_url = "https://parks.canada.ca/pn-np/nl/torngats/activ/randonee-hiking1/koroc"
start = "Gravel airstrip in the Koroc River valley, Quebec"
start_lonlat = [-63.586, 58.772]
shape = "loop"
days = [7, 8]
high_point_m = 1128
terrain = ["alpine", "tundra"]
travel = "mostly-cross-country"
permit = "Hikers must register before the trip with both Torngat Mountains National Park and Parc national Kuururjuaq, and de-register after leaving the parks."
caution = "Stream crossings on the Koroc River and its tributaries can be fast and very cold, and they grow harder after heavy rain."
checked = "2026-11-16"

