discovery = "osm-relation-version: Overpass `rel(14141941); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 14141941."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 14141941: the loop, main ways only."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 14141941
note = "Downloaded 2026-11-10; 36 ways in the main track. release.txt has the source and date."

[shield]
status = "no-logo-exists"
logo_source = ""
contact = "Ontario Parks"
note = "The trail has no emblem of its own. It is navigated by plain blue markers, which are not an emblem. Addresses checked: ontarioparks.ca/park/killarney and its full page source (the Ontario Parks logo, facility icons and gallery photographs only), ontarioparks.ca home page, friendsofkillarneypark.ca (the Friends of Killarney Park site refused the connection, reset by peer, twice, so it could not be read), and Wikimedia Commons (no emblem file). The Friends' printed La Cloche Silhouette Trail Guide is sold through its store and was not used."
logo_file = ""
logo_owner = "Ontario Parks"

[verification]
verified = true
date = "2026-11-10"
measured_km = 73.7
difference_percent = -7.9
parts = 1
note = "OSM relation 14141941, 36 ways: 73.7 km in 1 part, 7.9% short of the published 80 km."

[hike]
summary = "The La Cloche Silhouette Trail is a loop in Killarney Provincial Park, a wilderness landscape of the La Cloche Mountains' white quartzite ridges, the pink granite coast of Georgian Bay and more than fifty exceptionally clear sapphire lakes. The park was created after the Group of Seven painters campaigned for it."
official_url = "https://www.ontarioparks.ca/park/killarney"
start = "George Lake Campground, Ontario"
shape = "loop"
days = [7, 10]
terrain = ["forest", "lakes"]
travel = "trail"
permit = "Backcountry campsites along the trail are reserved through Ontario Parks."
checked = "2026-11-20"
season = "June to October"
months = [6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Killarney is snowbound in winter and buggy in spring, so the warm months are the main window, with September and early October the best. Confidence: medium."

[[hike.source]]
url = "https://www.ontarioparks.ca/park/killarney"
publisher = "Ontario Parks"
facts = ["official_url", "summary", "shape", "terrain", "travel", "permit"]

[[hike.source]]
url = "https://www.ontarioparks.ca/park/killarney/activities"
publisher = "Ontario Parks"
facts = ["start", "days"]

[[hike.source]]
url = "https://www.chelsa-climate.org/datasets/chelsa_climatologies"
publisher = "WSL (CHELSA) and NOAA NCEI (ETOPO)"
facts = ["season", "months"]

