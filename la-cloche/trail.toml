# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "la-cloche"
name = "La Cloche Silhouette Trail"
country = "CA"
regions = ["ON"]
length_km = 80
length_note = "80 km loop, from the Ontario Parks page for Killarney Provincial Park"
tier = "regional"
designation = "Ontario Parks, Killarney Provincial Park"
wave = 1

[source]
