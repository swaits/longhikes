length_note = "103 km, as Sépaq gives it on its Backpacking stay page for Parc national de la Gaspésie: \"From Mont Logan to Mont Jacques-Cartier. Duration: 8 days and 7 nights. Total distance: 103 km\". The first day starts with a shuttle from the Discovery and Visitors Centre to La Croisée hut and climbs Mont Logan and returns to a night stop, and the last day ends at the Mont-Jacques-Cartier campground with a shuttle back to the centre; the stage distances add to 106 km by the hut route and 105 km by the camping platforms. The published 103 km is used."
