summary = "The Laurel Highlands Hiking Trail stretches along Laurel Mountain from the Youghiogheny River at Ohiopyle State Park to the Conemaugh Gorge near Johnstown. It is the main feature of Laurel Ridge State Park, traversing state parks, state forests, state game lands and private lands, and is a major segment of the Potomac Heritage National Scenic Trail."
