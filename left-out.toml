note = "BC Parks give this loop in Stone Mountain Provincial Park as 70 km in total and say to plan five to seven days. The page calls it a remote wilderness trek for experienced hikers, with creek crossings at high water prone to flash flooding, and has hikers follow markers and cairns to the pass behind Whitestone Ridge. It is below the 50 mile (80 km) floor, and the maintainer judged that the ground does not clearly make a fit party need five or more days."
source_url = "https://bcparks.ca/stone-mountain-park/"
