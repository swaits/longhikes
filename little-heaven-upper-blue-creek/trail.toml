length_km = 64
length_note = "64 km, as Parks Canada prints it on its page for the route: \"64 km one way\", for trails 153, 150, 154 and 155, 7 to 10 days. The page says the trip begins and ends at Rock Lake, in Alberta outside the park, and does not say which stretch the 64 km covers. Its description has the first 23 km run from Rock Lake along the North Boundary trail to the Glacier Pass / Little Heaven junction, the 14 km McLaren Pass route beyond Little Heaven, and \"the 39 km back to the Rock Lake trailhead\" from Blue Creek Campground. The stretches are the page's own figures and are not added together here."
tier = "short"
short_reason = "Parks Canada says there is little or no maintenance, that creeks and rivers are not bridged and fords can be dangerous or impassable, that route finding is necessary, and gives it seven to ten days."
