id = "little-heaven-upper-blue-creek"
name = "Little Heaven – Upper Blue Creek"
country = "CA"
regions = ["AB"]
length_km = 64
length_note = "64 km, as Parks Canada prints it on its page for the route: \"64 km one way\", for trails 153, 150, 154 and 155, 7 to 10 days. The page says the trip begins and ends at Rock Lake, in Alberta outside the park, and does not say what the 64 km covers. Its own distances for the way out are 23 km from Rock Lake to the Glacier Pass / Little Heaven junction, the 14 km McLaren Pass route, and 15.5 km from the McLaren Pass junction up the Upper Blue Creek valley to the Natural Arch campground, with the viewpoint 1.5 km beyond. With the stretch from the km 23 junction to Little Heaven, which the route's backcountry guide map labels as 8.2 km and 0.7 km, they add to about 63 km, close to the 64 km: the figure reads as Rock Lake to the Natural Arch viewpoint one way, not the whole trip back to Rock Lake. The page gives \"the 39 km back to the Rock Lake trailhead\" from Blue Creek Campground, which the guide's map labels 3.5 km from the end of the McLaren Pass route. The stretch from Rock Lake to the km 23 junction is walked out and back, and the Upper Blue Creek valley is a side trip walked out and back from the McLaren Pass route. Added from those distances, the trip from Rock Lake and back to Rock Lake is about 88 km without the Upper Blue Creek side trip and about 122 km with it as far as the viewpoint. The 8.2, 0.7 and 3.5 km figures are map labels read from the guide PDF's text and are not in the page's words, and none of the sums is measured from a track."
tier = "short"
short_reason = "Parks Canada says there is little or no maintenance on the route, that many creeks and rivers are not bridged and fords can be dangerous or impassable, that some sections are overgrown and make route finding necessary, and that the McLaren Pass route is unmaintained."
designation = "Parks Canada, Jasper National Park: a backcountry route it publishes by name"
wave = 1
places_checked = "2026-11-23"

