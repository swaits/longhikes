[hike]
summary = "Little Heaven – Upper Blue Creek is a remote wilderness route in the northern backcountry of Jasper National Park, Alberta, that begins and ends at the Rock Lake trailhead in the Willmore Wilderness outside the park. It follows the North Boundary trail to a junction at km 23, climbs by the Glacier Pass trail to Little Heaven, crosses McLaren Pass on an unmaintained route to Blue Creek and returns by the North Boundary trail, with a side trip up the Upper Blue Creek valley toward the Ancient Wall. Parks Canada gives it as 64 km one way and 7 to 10 days, and recommends it for users with solid backcountry skills and experience."
official_url = "https://parks.canada.ca/pn-np/ab/jasper/activ/passez-stay/arrierepays-backcountry/sugg-sentiers_trip-ideas/littleheaven"
start = "Rock Lake trailhead, Willmore Wilderness, Alberta"
start_lonlat = [-118.263, 53.46]
shape = "loop"
days = [7, 10]
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "No page states a season. Rivers can be impassable in high water, which is highest in the snowmelt of early summer, and McLaren Pass is alpine, so July to September was set by judgement from the climate and from similar Jasper trails. Confidence: medium."
terrain = ["alpine", "forest"]
travel = "trail"
permit = "Parks Canada says a backcountry camping permit is mandatory for all overnight trips, and that it can be had online or by phone."
caution = "Parks Canada says there is little or no maintenance on the route, that some sections are overgrown and make route finding necessary, that many creeks and rivers are not bridged, and that fords can be dangerous or impassable and travel is not recommended in high water. The McLaren Pass route is unmaintained, and the page says route finding skills are essential for the several old routes in the Upper Blue Creek valley."
checked = "2026-11-23"

