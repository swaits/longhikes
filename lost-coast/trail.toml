attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 6125620: one route relation, 23 ways, all main."
source_checked = "2026-11-14"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 6125620
note = "Downloaded 2026-11-14; 23 ways in the main track and none in alternates. release.txt has the source and date."

[shield]
status = "no-logo-exists"
logo_source = ""
contact = "Bureau of Land Management, King Range National Conservation Area"
note = "No emblem of its own. The BLM and California State Parks pages for the trail, and the BLM's King Range fact sheet, use only the BLM, National Conservation Lands and State Parks marks; no badge for the Lost Coast Trail itself appears in any of them, and the King Range map and guide PDFs linked from the BLM page carry agency styling only. Addresses looked at: blm.gov/visit/lost-coast-trail (page and its source), blm.gov/programs/national-conservation-lands/california/king-range-national-conservation-area (page, source, and the fact sheet and map PDFs it links, including blm.gov/sites/default/files/docs/2024-06/KingRange_FS_508.pdf, rendered and read), and parks.ca.gov/?page_id=429 (Sinkyone Wilderness State Park page, source, and the information sheet PDF it links). Wikimedia Commons holds photographs of trailhead signs, which show agency boards, not a trail crest."
logo_file = ""
logo_owner = ""

[verification]
verified = true
date = "2026-11-14"
measured_km = 85.2
difference_percent = 6.5
parts = 2
note = "OSM relation 6125620, 23 ways: 85.2 km in 2 parts (40.5 km and 44.7 km), 6.5% over the 80 km (50 mi) that State Parks gives as a minimum. The gap between the parts lies near Shelter Cove, between the BLM's northern and southern sections. No agency page gives one total for the whole trail."

[hike]
summary = "The Lost Coast Trail follows a remote stretch of the northern California coast, from Usal Beach in Sinkyone Wilderness State Park north to the mouth of the Mattole River in the King Range National Conservation Area. The northern part is largely a beach walk, and the southern part climbs more through the coastal hills. The Bureau of Land Management manages the King Range sections and California State Parks the Sinkyone sections."
official_url = "https://www.blm.gov/visit/lost-coast-trail"
start = "Usal Beach, Sinkyone Wilderness State Park, California"
end = "Mattole River mouth, King Range National Conservation Area, California"
shape = "point-to-point"
terrain = ["coast"]
travel = "trail"
permit = "Overnight camping on the King Range sections needs a Backcountry Permit, booked through Recreation.gov; Sinkyone Wilderness State Park has its own rules for camping."
caution = "On the northern section the BLM tells hikers to research the tides before booking a permit."
checked = "2026-11-14"

[[hike.source]]
url = "https://www.blm.gov/visit/lost-coast-trail"
publisher = "Bureau of Land Management"
facts = ["official_url", "summary", "terrain", "travel", "permit", "caution"]

[[hike.source]]
url = "https://www.parks.ca.gov/?page_id=28158"
publisher = "California State Parks"
