# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "lost-coast"
name = "Lost Coast Trail"
country = "US"
regions = ["CA"]
length_km = 80
length_note = "more than 50 mi from Usal Beach to the Mattole River, per California State Parks; the Bureau of Land Management gives its northern section as 24.6 mi and its southern section as 9 mi, then 19 more mi through Sinkyone Wilderness State Park"
tier = "regional"
designation = "Bureau of Land Management (King Range National Conservation Area) and California State Parks (Sinkyone Wilderness State Park); State Parks also calls its part the California Coastal Trail's most difficult section"
wave = 1

[source]
status = "osm-only"
publisher = "Bureau of Land Management and California State Parks (publish the trail; no open geometry found)"
publisher_url = "https://www.blm.gov/visit/lost-coast-trail"
