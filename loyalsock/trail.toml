[hike]
summary = "The Loyalsock Trail is an end-to-end trail through the Loyalsock State Forest in northern Pennsylvania, from PA Route 87 north of Montoursville to Mead Road near Laporte, with the remainder on private land. It is marked with yellow discs bearing red LT letters and is maintained by the Alpine Club of Williamsport, whose guidebook describes rough terrain."
