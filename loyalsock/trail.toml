[hike]
summary = "The Loyalsock Trail is an end-to-end trail through the Loyalsock State Forest in northern Pennsylvania, from PA Route 87 north of Montoursville to Mead Road near Laporte, with the remainder on private land. It is marked with yellow discs bearing red LT letters and is maintained by the Alpine Club of Williamsport, whose guidebook describes rough terrain."
official_url = "https://alpineclubofwilliamsport.com/loyalsock-trail-information/"
start = "PA Route 87, north of Montoursville, Pennsylvania"
end = "Mead Road, near Laporte, Pennsylvania"
shape = "point-to-point"
high_point_m = 652
terrain = ["forest"]
travel = "trail"
caution = "Fires are banned along parts of the trail and during the spring fire season, and the club advises hikers to stay off the trail during bear and deer season, which runs about three weeks from the Monday before Thanksgiving."
permit = "No permit is needed to camp one night at a site; a free Loyalsock State Forest camping permit is needed to stay more than one night at one location."
checked = "2026-11-20"
season = "April to June and September to October"
months = [4, 5, 6, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. Rocky, wet terrain in northern Pennsylvania is best in the cool shoulder seasons, before the humid, buggy summer. Confidence: medium."

