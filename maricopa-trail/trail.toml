[[history]]
date = "2026-11-16"
change = "The logo record now says the trail has no emblem of its own, after the pages that would show one were searched."
fields = ["shield.status"]
basis = "The pages named in the logo note were searched, and none shows an emblem that stands for the trail itself."
basis_url = "https://www.maricopacountyparks.net/park-locator/maricopa-trail/"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
date = "2026-11-19"
change = "The Maricopa Trail's track now holds 25 relation ways tagged with the role route, 11.7 km, that an earlier rule had put in alternates. The track is 470.5 km in 18 parts, where it was 458.8 km in 20."
fields = ["source.line_file", "source.mainline", "osm.note", "verification.measured_km", "verification.difference_percent", "verification.parts", "verification.note"]
basis = "OpenStreetMap's wiki page for route relations says the empty role should be used instead of the role route. The 25 ways joined parts of the main track end to end, so they carry the trail; the track tool had read the role as a side trail."
basis_url = "https://wiki.openstreetmap.org/wiki/Relation:route"
asked_by = "the dataset's own check"
outcome = "applied"

[[history]]
