designation = "Mason-Dixon Trail System"
wave = 1

[source]
status = "osm-only"
publisher = "Mason-Dixon Trail System (publishes the trail; no open geometry found)"
publisher_url = "https://www.masondixontrail.org/"
url = "https://www.openstreetmap.org/relation/1820324"
discovery = "osm-relation-version: Overpass `rel(1820324); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 1820324."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 1820324: one route relation, main ways only, with no member roles except 'forward' on a divided road. The relation holds two ways between the same two points at four places. At three of them one way is named Mason-Dixon Trail and the other is a road (Lapidum Road and Level Road; Benge Road, Creek Road and Creek Mill Road; River Farm Road and River Drive), and the track keeps the trail. At Pulaski Highway both carriageways of the divided road were mapped, and one (1.3 km) was left out. The road ways, 11 of them (4.3 km), are in alternates.geojson."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 1820324
note = "Downloaded 2026-11-10; 691 ways in the main track. release.txt has the source and date. Re-cut 2026-11-16: the main track is 671 ways and 11 are in alternates; one carriageway of Pulaski Highway was dropped."

[shield]
status = "use-real-logo"
