note = "The trail's own round blue marker (hiker symbol, 'MASON-DIXON TRAIL'), shown on the Trail System's home page. Trimmed of its empty border only. 300 px original. No terms for use of the logo are stated on the page."
logo_file = "shield.png"
logo_owner = "Mason-Dixon Trail System"

[verification]
verified = true
date = "2026-11-16"
measured_km = 319.8
difference_percent = 2.8
parts = 10
note = "OSM relation 1820324, 671 ways: 319.8 km in 10 parts, 2.8% more than the published 311 km. The earlier track, 325.4 km, held two ways at four places; the road ways, 4.3 km, are in alternates.geojson and a second carriageway, 1.3 km, was left out. The pieces do not all join: OpenStreetMap is missing the connectors between them."

[hike]
summary = "The Mason-Dixon Trail connects the Appalachian Trail with the Brandywine Trail, starting at Whiskey Springs in Cumberland County, Pennsylvania, following the Susquehanna River to Havre de Grace, Maryland, then running through Delaware and ending at Chadds Ford, Pennsylvania, on the Brandywine River. It is a system of trails, often sharing its path with other trails through parks and game lands."
official_url = "https://masondixontrail.wixsite.com/mdts"
start = "Whiskey Springs, on the Appalachian Trail, Cumberland County, Pennsylvania"
end = "Chadds Ford, Pennsylvania, on the Brandywine River"
shape = "point-to-point"
terrain = ["forest"]
travel = "trail"
checked = "2026-11-13"

[[hike.source]]
