[hike]
summary = "The Mattabesett Trail is a blue-blazed trail in central Connecticut that runs in a large horseshoe from River Road in Middletown to the Berlin Turnpike in Berlin. Its eastern sections hold high ledges and bald knobs with views of the Connecticut River, and its western sections offer some of the finest ridge walking and cliff views in the state on the southern end of the traprock ridges. It is one of the trails that make up the New England National Scenic Trail."
official_url = "https://ctwoodlands.org/trails/mattabesett-trail"
