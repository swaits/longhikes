months = [3, 4, 5, 9, 10, 11]
terrain = ["forest"]
travel = "trail"
caution = "Hunting is permitted in state forests and other properties the trail crosses; wear orange during hunting season."
permit = "No paid permit or fee is needed to use the New England Trail, of which the Mattabesett Trail is a part."
checked = "2026-11-19"
