[hike]
summary = "The Mid State Trail stretches from near Flintstone, Maryland, through the center of Pennsylvania to the New York State line just north of Cowanesque Lake, crossing four regions from south to north. Its keepers call it the wildest footpath in Pennsylvania, and it runs along high ridgelines, deeply wooded plateau and rural low hills."
official_url = "https://hike-mst.org/"
