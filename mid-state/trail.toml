attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM 1022044 'Mid-State Trail' (Pennsylvania, 513 km distance tag): all its ways have the main role or none, so the relation does not mark which are alternates. The main track is one walk of its ways. At two places the relation holds two ways between the same two points, and the one that is not the trail moved to alternates.geojson (19 ways, 10.8 km). Near Arnot it is the 'High Water Route (MST)' with South Elk Run Road (5.1 km), against the trail by Maple Hill Road and Arnot Road (11.2 km). At Everett it is the road route north by North Spring Street and Raystown Road (5.7 km), against the trail through Tenley Park and by Lower Snake Spring Road to Tussey Ridge (8.8 km). The Mid-State Trail Association's Everett Region page describes two routes from downtown Everett onto the ridge, one fully blazed to the west and one partly roadwalk on the east, and says the trail is being moved to pass through Tenley Park."
decision = "included-named"
decision_text = "Included with its name and logo. The track is from OpenStreetMap."
