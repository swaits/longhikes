[route]
creator = "Mike White and Douglas Lorain"
year = 2015
line_policy = "sold"
note = "A shuttle from the Crown Valley Trailhead near Wishon Reservoir by Crown Valley, Tehipite Valley and the Middle Fork Kings River trail to the John Muir Trail, then north by Le Conte Canyon, Muir Pass and Evolution Basin to Goddard Canyon, over Hell-for-Sure Pass and out by Red Mountain Basin and Post Corral Meadows to the Maxson Trailhead near Courtright Reservoir, with 82.6 miles and 8 to 12 days in the book. By the book's own day figures, about 24 of the 82.6 miles follow the John Muir Trail, and about 20 of those (Le Conte Canyon to the Goddard Canyon junction) are also on the South Lake to North Lake route. The book's maps are the track; none is copied here."

