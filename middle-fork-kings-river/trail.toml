[hike]
summary = "The Middle Fork Kings River is a point-to-point backpacking trip of 8 to 12 days in Sierra National Forest and Kings Canyon National Park, California, from the Crown Valley Trailhead near Wishon Reservoir to the Maxson Trailhead near Courtright Reservoir. It drops to Tehipite Valley, follows the Middle Fork Kings River upstream to the John Muir Trail, then goes by Le Conte Canyon, Muir Pass and Evolution Basin and returns west over Hell-for-Sure Pass. Mike White and Douglas Lorain describe it as Trip 7 in Best Backpacking Trips in California and Nevada."
official_url = "https://www.unpress.nevada.edu/9780874179712/best-backpacking-trips-in-california-and-nevada/"
start = "Crown Valley Trailhead, near Wishon Reservoir, Sierra National Forest, California"
end = "Maxson Trailhead, near Courtright Reservoir, Sierra National Forest, California"
end_lonlat = [-118.963, 37.083]
shape = "point-to-point"
days = [8, 12]
season = "Mid-July to early October, best late August to early September"
months = [7, 8, 9, 10]
terrain = ["alpine", "canyon"]
travel = "trail"
permit = "The Forest Service says wilderness permit reservations for the Crown Valley trailhead are made at recreation.gov and that trailhead quotas apply year-round."
caution = "The book says trails in this part of Sierra National Forest are infrequently traveled and seldom maintained, that a map, compass and GPS are absolute necessities for the first part, and that the tread disappears near Cow and Wet Meadows. It calls the junction for Hell-for-Sure Pass in Goddard Canyon faint, not signed and easily missed. It describes the 3,000 foot descent to Tehipite Valley as steep and unrelenting, and says that the lower Middle Fork canyon has a notorious reputation for rattlesnakes and poison oak lines the lower trail. The route has fords, including of the Middle Fork Kings River and Palisade Creek, which the book says may be dangerous at high water. A 2008 fire burned over 4,000 acres in Kings Canyon National Park along the Tehipite Valley trail. The book rates the technical difficulty 8 and the physical difficulty 9, each out of 10, describes the route as on trail, and mentions no rope or climbing."
checked = "2026-11-19"
season_basis = "primary"

