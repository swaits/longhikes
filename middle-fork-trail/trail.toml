[hike]
summary = "The Middle Fork Trail follows the Middle Fork of the Salmon River through the Frank Church-River of No Return Wilderness in Idaho, from Big Hole at the meeting of Bear Valley and Marsh Creeks to Camas Creek. The Idaho Trails Association notes that it carries part of the Idaho Centennial Trail, which has its own record in this dataset. The Forest Service lists it for backpacking, hiking and horseback riding."
official_url = "https://www.fs.usda.gov/r04/salmon-challis/recreation/trails/middle-fork-trail-4001"
start = "Big Hole, at the confluence of Bear Valley and Marsh Creeks, Idaho"
end = "Camas Creek, Idaho"
shape = "point-to-point"
terrain = ["canyon", "forest"]
travel = "trail"
caution = "Within the Wild and Scenic River corridor everything, including human waste and ashes, must be packed out, and fires must be contained in a fire pan."
checked = "2026-11-16"
season = "May to October (for the Middle Fork Salmon River corridor)"
months = [5, 6, 7, 8, 9, 10]
season_basis = "source"

