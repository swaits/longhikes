[hike]
summary = "The Midstate Trail is a scenic footpath in Worcester County, 45 miles west of Boston, running from the Rhode Island border across the gentle hills of central Massachusetts to the New Hampshire border, where it connects to the Wapack Trail. The trail committee calls it highly accessible and easy to hike."
