note = "A shuttle from the Cottonwood Pass Trailhead by Chicken Spring Lake, Rock Creek and Crabtree Meadow to the John Muir Trail near Tyndall Creek, then Milestone Basin and the headwaters of the Kern River by Lake South America, and out over Shepherd Pass to the Symmes Creek trailhead, with 55.6 miles in the book. About 20 of its miles follow the Pacific Crest Trail, which the John Muir Trail shares for part of the way, by the dataset's own check against those records. The book's maps are the track; none is copied here."

