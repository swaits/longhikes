[hike]
summary = "Milestone Basin and the Upper Kern is a 7 day backpacking trip in the southern Sierra Nevada, California, from the Cottonwood Pass Trailhead to the Symmes Creek Trailhead on Shepherd Pass Trail. It follows the Pacific Crest Trail and John Muir Trail corridor to Tyndall Creek, then visits Milestone Basin and the headwaters of the Kern River at Lake South America before crossing Shepherd Pass. Elizabeth Wenk and Mike White describe it as Trip 79 in the 9th edition of Sierra South."
official_url = "https://shop.adventurewithkeen.com/product/sierra-south-2/"
start = "Cottonwood Pass Trailhead, Inyo National Forest, California"
start_lonlat = [-118.171, 36.448]
end = "Symmes Creek (Shepherd Pass) Trailhead, Inyo National Forest, California"
end_lonlat = [-118.279, 36.727]
shape = "point-to-point"
days = [7, 7]
season = "July to mid-October, the book's mid to late season"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "A permit is required for overnight stays, with quotas, as the book states; it names the Cottonwood Pass permit, with the Shepherd Pass exit."
caution = "The book rates the pace moderate to strenuous. The Tyndall Creek ford is very difficult in early season, and other fords can be hard then too. The trail fades in Milestone Basin, where the book says there is no consistent use trail and exploring is optional cross-country; the book's mileage ends there. The book mentions optional peaks of Class 2 and 3 from the basin, none of them part of the itinerary, and no rope. The Shepherd Pass descent is long and dry, with rerouted switchbacks across debris flow channels."
checked = "2026-11-18"

