note = "The emblem is the author's Mogollon Rim Trail crest: a rounded triangle with the trail name round it, a rim cliff, agave, pine and peaks inside. The author shows it on his introduction page at blisterfree.wordpress.com (2019/02/24, introducing-the-mogollon-rim-trail) as the route's logo (file mrt_logo_final.png). The plain white corners outside the crest in the original have been made transparent with a corner flood-fill, and the file was trimmed with a small margin; the crest's own edge is intact on white and on dark grounds. Also checked: the author's mapset pages at simblissity.net (mapsets.shtml), which show only the simBLISSity brand logo, and Wikimedia Commons (none). Ask the author before using his mark."
