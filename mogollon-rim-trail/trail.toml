line_policy = "sold"
creator_words = "Meticulously researched and field-verified, this all-inclusive digital resource contains everything needed for experienced long-distance hikers to traverse the new Mogollon Rim Trail long distance hiking route across Arizona's famed Rim Country."
creator_words_url = "https://www.simblissity.net/mogollon-rim-trail-mapset.shtml"
note = "Across Arizona's Rim Country from near Cottonwood to Alma, New Mexico, crossing the Arizona Trail near Pine and meeting the Grand Enchantment Trail at its eastern end. The mapset is field-verified by the route's developers."

