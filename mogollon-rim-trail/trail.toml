[[history]]
date = "2026-11-20"
change = "The trail was placed in Colorado Plateau, Mogollon Rim, White Mountains, Bear Wallow Wilderness, Mount Baldy Wilderness, Munds Mountain Wilderness, Red Rock-Secret Mountain Wilderness, Sycamore Canyon Wilderness, West Clear Creek Wilderness and Wet Beaver Wilderness from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"The Rim defines the southwestern edge of the Colorado Plateau and, as such, serves as a geographic and biological dividing line between this high, uplifted region to the north and subtropical desert basins and ranges to the south.\" (Colorado Plateau, Mogollon Rim) The page says: \"Welcome to the White Mountains of Arizona!\" (White Mountains) The page says: \"the Bear Wallow Wilderness, which the MRT explores for a number of miles, its permanent waters and abundant wildlife as noteworthy as its relative absence of people.\" (Bear Wallow Wilderness) The page says: \"Baldy Peak—at over 11,400 feet the state's highest summit outside of the San Francisco Peaks near Flagstaff—commands early attention as the route tours its namesake Wilderness area.\" (Mount Baldy Wilderness) The page says: \"Our route passes through no fewer than three Wilderness areas – Munds Mountain, Wet Beaver, and West Clear Creek.\" (Munds Mountain Wilderness, West Clear Creek Wilderness, Wet Beaver Wilderness) The page says: \"then enters the Redrock-Secret Mountain Wilderness via foot trail, descending Loy Canyon to the farther reaches of Arizona's famed redrock region surrounding Sedona.\" (Red Rock-Secret Mountain Wilderness) The page says: \"Where it rejoins Sycamore Canyon Wilderness a few miles on, one beholds a remote and seldom-accessed region below the Mogollon Rim\" (Sycamore Canyon Wilderness)"
basis_url = "https://blisterfree.wordpress.com/2019/02/24/introducing-the-mogollon-rim-trail/"
asked_by = "the dataset's own check"
outcome = "applied"
