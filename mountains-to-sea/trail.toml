[verification]
verified = true
date = "2026-11-16"
measured_km = 1910.4
difference_percent = 1.1
parts = 21
note = "The foot track, with the seasonal road detour taken out, gives 1,910.4 km in 21 parts, +1.1% over 1,890 km. The earlier track was 1,923.0 km. The Hunting Season Detour (12.6 km), the Neuse and Yadkin river paddle route and the Cedar Island ferry (377.2 km, ways with no highway tag) are in alternates.geojson. line.osm still holds the whole relation as served."

[hike]
summary = "The Mountains-to-Sea Trail stretches across North Carolina from the Great Smoky Mountains to the Outer Banks, taking in mountain vistas, rolling Piedmont farms, hardwood and pine forests, coastal swamps, lighthouses, sand dunes and miles of seashore. About 720 miles are on natural surface or greenway trail, with connecting back roads and two optional paddle routes knitting the finished sections together."
official_url = "https://mountainstoseatrail.org/"
start = "Kuwohi (Clingmans Dome), Great Smoky Mountains, North Carolina"
end = "Jockey's Ridge, the Outer Banks, North Carolina"
shape = "point-to-point"
days = [90, 120]
season = "Spring through fall: hikers starting early in the year walk west from the coast, and those starting in summer or fall walk east from Kuwohi"
months = [4, 5, 6, 7, 8, 9, 10]
high_point = "Mount Mitchell"
high_point_m = 2037
terrain = ["forest", "farmland", "coast"]
travel = "trail-and-road"
permit = "No permit is needed for walking; backcountry camping permits are required year-round in Great Smoky Mountains National Park and on weekends and holidays from May 1 to October 31 in the Linville Gorge Wilderness."
caution = "About 700 miles of the route is on trail and the rest follows connecting back roads and bicycle routes, with optional paddle routes on the Yadkin and Neuse rivers."
checked = "2026-11-14"
season_basis = "primary"

