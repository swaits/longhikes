length_note = "Approximately 68 km / 42 miles, as Parks Canada gives it on its page for the Nakvak Brook Trek (\"Allow 5 to 6 days\"). The page says all distances are straight line distances and that actual travel distances will vary with the route taken. The trek runs from the mouth of Nakvak Brook in Saglek Fiord up the brook to its headwaters beside the Québec/Nunavik border; the page says it can also be hiked in the opposite direction."
tier = "short"
short_reason = "Parks Canada says there are no trails in the park, the route follows caribou trails through thickets and needs a hard river crossing, and it tells hikers to allow five to six days."
