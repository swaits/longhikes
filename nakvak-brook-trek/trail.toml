[hike]
summary = "The Nakvak Brook Trek is a route of about 68 km through the Torngat Mountains, from the mouth of Nakvak Brook in Saglek Fiord, Newfoundland and Labrador, up the brook and past Nakvak Lake to its headwaters beside the Québec/Nunavik border. Parks Canada says caribou trails thread through alder and birch thickets and often seem to end, and that the brook is too big to cross until two or three days in. It is reached by boat or helicopter."
official_url = "https://parks.canada.ca/pn-np/nl/torngats/activ/randonee-hiking1/nakvak"
start = "Mouth of Nakvak Brook (Pitukkik), Saglek Fiord, Newfoundland and Labrador"
start_lonlat = [-63.294, 58.498]
end = "Québec/Nunavik border at the headwaters of Nakvak Brook"
end_lonlat = [-64.114, 58.613]
shape = "point-to-point"
days = [5, 6]
season = "July to August"
months = [7, 8]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The Torngat Mountains in the Arctic are snowbound until late June and freeze again by September, leaving a short July and August window. Confidence: medium."
terrain = ["tundra", "alpine"]
travel = "mostly-cross-country"
permit = "Hikers must register before the trip with both Torngat Mountains National Park and Parc national Kuururjuaq, and de-register after leaving the parks."
caution = "Parks Canada says there are no roads, trails or signs in the park, that the main brook crossing is challenging and cannot be made until two or three days in, that creeks flowing in from the north run through deep canyons, and that polar bears and black bears are present. Access is by boat or helicopter."
checked = "2026-11-23"

