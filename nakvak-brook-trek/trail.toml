length_km = 68
length_note = "Approximately 68 km / 42 miles, as Parks Canada gives it on its page for the Nakvak Brook Trek (\"Allow 5 to 6 days\"). The page says all distances are \"straight line\" distances and that actual travel distances will vary depending on the exact route, so the distance walked is more than 68 km. The trek runs from the mouth of Nakvak Brook in Saglek Fiord up the brook to its headwaters beside the Québec/Nunavik border; the page says it can also be hiked in the opposite direction."
tier = "short"
short_reason = "Parks Canada says there are no roads, trails or signs in the park, that the route follows caribou trails that often seem to end and forces a way through thick alder, birch and willow, and that the brook crossing is challenging; it rates the trek a moderate multi-day hike and calls the last section some of the easiest hiking in the Torngat Mountains."
