[hike]
summary = "The Nankoweap–Bright Angel Loop is an eleven day backpacking loop through the eastern Grand Canyon in Arizona, from the Saddle Mountain Trailhead on the North Rim. It goes down the Nankoweap Trail, then cross-country south past Nankoweap Butte and Kwagunt, Malgosa, Awatubi and Sixtymile creeks to Lava Canyon and Unkar Creek, by Vishnu Creek to Clear Creek, and on to Bright Angel Campground, the North Kaibab Trail and the Ken Patrick Trail back to the start. Bruce Grubbs describes it as Trip 7 in Backpacking Arizona."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-arizona/"
start = "Saddle Mountain Trailhead, North Rim, Grand Canyon National Park, Arizona"
shape = "loop"
days = [11, 11]
season = "Mid September to May"
months = [1, 2, 3, 4, 5, 9, 10, 11, 12]
terrain = ["canyon"]
travel = "some-cross-country"
permit = "A permit is required to camp within Grand Canyon National Park, as the book states."
caution = "The book calls this a strenuous cross-country hike, says every member of the party should be fit and that the leader should have experience hiking cross-country in the Grand Canyon, and says most of the loop is seldom travelled and hikers are unlikely to meet anyone on its cross-country section. The author rates its difficulty 10 out of 10. The book lists water at Nankoweap Creek, Kwagunt Creek, the Colorado River and Unkar Creek, and only seasonally in Vishnu Creek, Clear Creek and Bright Angel Creek. Campfires are not allowed in the park's backcountry; along the North Kaibab Trail near the end of the loop, camping is allowed only in designated campgrounds. Pets are not allowed on trails or in the backcountry."
