[hike]
summary = "The Natchez Trace National Scenic Trail is made up of five separate sections of hiking and equestrian trail, together a little over 60 miles, running roughly parallel to the 444-mile Natchez Trace Parkway from Natchez, Mississippi, to south of Nashville, Tennessee. The sections cross wetlands, swamps and hardwood forest, and parts follow the sunken Old Natchez Trace."
official_url = "https://www.nps.gov/natt/index.htm"
