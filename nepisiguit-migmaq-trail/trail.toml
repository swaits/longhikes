[hike]
summary = "The Sentier Nepisiguit Mi'gmaq Trail is a single-track hiking trail in northern New Brunswick. It follows the Nepisiguit River from Daly Point Nature Reserve at Bathurst to the Appalachian mountains of Mount Carleton Provincial Park. It symbolises the route the Mi'gmaq used between coastal summer camps and winter hunting grounds, and it is marked in both directions with turtle-logo signs."
official_url = "https://migmaqtrail.ca/discover.php"
start = "Daly Point Nature Reserve, Bathurst, New Brunswick"
end = "Mount Carleton Provincial Park, New Brunswick"
shape = "point-to-point"
days = [6, 12]
season = "June to October"
months = [6, 7, 8, 9, 10]
travel = "trail"
permit = "Multi-day and thru hikers must register, which costs a fee, and carry their hiking pass; day hikers need not register."
caution = "Most of the trail is remote wilderness without telephone or internet service, and open fires are not permitted."
checked = "2026-11-14"
season_basis = "primary"

