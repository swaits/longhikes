[hike]
summary = "The Nez Perce (Nee-Me-Poo) National Historic Trail traces the route of the 1877 flight of the Nez Perce from Wallowa Lake, Oregon, to the Bear Paw Battlefield near Chinook, Montana, ending 40 miles short of the Canadian border. The route was used in its entirety only once, and the component trails and roads that made it up bore generations of use before and after."
