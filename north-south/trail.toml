contact = "Rhode Island Department of Environmental Management"
note = "The trail has no emblem of its own that was found. It is marked with plain blue blazes and small handwritten direction signs. Addresses checked: the trail's listed page rigis.org/datasets/north-south-trail (a data record with no artwork), rigis.org home page, dem.ri.gov documents found by search (a land-acquisition report and a fish and wildlife summary that mention the trail, with the agency crest only), and Wikimedia Commons (none). No state page or map PDF for the trail showing a marker as artwork was found. Ask the state before using any mark."
logo_file = ""
logo_owner = "Rhode Island Department of Environmental Management"

