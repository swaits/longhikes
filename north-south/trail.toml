parts = 2
note = "OSM relation 11102215, 197 ways: 121.4 km in 2 parts, 2.9% short of the published 125 km."

[hike]
summary = "The North-South Trail is a hiking trail that runs through the state of Rhode Island, crossing state parks and management areas on land of many owners. Its route takes in upland forest of mixed red and white oak, beech, maple and white pine."
