[hike]
summary = "The North Umpqua Trail follows the North Umpqua River through southwest Oregon, from Bureau of Land Management land east through the Umpqua National Forest and into the Fremont-Winema National Forest. It is divided into segments that can be walked one at a time. Part of it runs through the Mount Thielsen Wilderness, and it passes the source of the river at Maidu Lake."
official_url = "https://www.fs.usda.gov/r06/umpqua/recreation/groups/north-umpqua-trail-1414"
shape = "point-to-point"
terrain = ["forest"]
travel = "trail"
checked = "2026-11-20"
season = "June to October"
months = [6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The upper Cascade sections near 6,000 feet hold snow into June and see heavy rain and snow from late October, though the river canyon can be walked earlier. Confidence: medium."

