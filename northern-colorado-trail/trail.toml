[hike]
summary = "The Northern Colorado Trail crosses northern Colorado from Estes Park to Glenwood Springs. The author counts 304.4 miles in four segments through Rocky Mountain National Park and the Flat Tops Wilderness, with the towns of Walden, Steamboat Springs, Oak Creek and Yampa between the ends. It links existing trails and roads."
