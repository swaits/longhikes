[hike]
summary = "The Northern New Mexico Loop starts and ends at Santa Fe Plaza, touring the Jemez Mountains, the Continental Divide and the Sangre de Cristo Mountains on a clockwise circuit of northern New Mexico. It crosses sere deserts, lush boreal forest and lofty alpine terrain, uncovering the human history and cultural diversity of the region."
official_url = "https://simblissity.net/northern-nm-loop-mapset.shtml"
start = "Santa Fe Plaza, Santa Fe, New Mexico"
