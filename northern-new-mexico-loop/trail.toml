shape = "loop"
terrain = ["desert", "alpine", "forest"]
travel = "some-cross-country"
season = "Late spring to early summer, and again from early September into autumn: clockwise from Santa Fe in spring, counter-clockwise in autumn"
months = [5, 6, 9, 10]
caution = "Two unbridged fords of the Rio Grande are required, except in times of high water, when the hiker must detour widely to avoid them."
checked = "2026-11-13"
season_basis = "primary"

