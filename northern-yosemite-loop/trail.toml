shape = "loop"
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "Snow keeps the high country of northern Yosemite closed until late June or July and returns in October, which leaves July to September. Confidence: medium."
terrain = ["alpine"]
checked = "2026-11-23"

