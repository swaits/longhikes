# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "northern-yosemite-loop"
name = "Northern Yosemite Loop"
country = "US"
regions = ["CA"]
length_km = 123
length_note = "76.4 miles / 123 km, as the National Park Service prints it for the Northern Yosemite Loop on its Tuolumne Meadows Backpacking Trails page for Yosemite National Park, with an elevation gain of 13,300 feet (4,055 m). The page names no legs for it: it gives the trailhead as Glen Aulin and says there are numerous one-way trips and loops of varying mileages that hikers can create in the north country. The figure is the Park Service's own and is not measured from a track."
tier = "regional"
designation = "National Park Service, Yosemite National Park: a backpacking loop it lists by name"
wave = 1
places_checked = "2026-11-23"

