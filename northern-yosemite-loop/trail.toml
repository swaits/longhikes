[hike]
summary = "The Northern Yosemite Loop is a 76 mile backpacking loop through the north country of Yosemite National Park, California, which the Park Service describes as remote and rugged, with long distances, few people and creek crossings. It starts at the Glen Aulin trailhead near Tuolumne Meadows and climbs 13,300 feet in all. The Park Service's page does not name the trails it follows."
official_url = "https://www.nps.gov/yose/planyourvisit/tuolumne-meadows-backpacking-trails.htm"
