# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "oak-ridges"
name = "Oak Ridges Trail"
country = "CA"
regions = ["ON"]
length_km = 270
length_note = "approximately 270 km, from the Oak Ridges Trail Association page"
tier = "regional"
designation = "Oak Ridges Trail Association"
wave = 1

[source]
status = "osm-only"
publisher = "Oak Ridges Trail Association (publishes the trail; no open geometry found)"
publisher_url = "https://www.oakridgestrail.org/end-to-end-hike"
url = "https://www.openstreetmap.org/relation/4287243"
discovery = "osm-relation-version: Overpass `rel(4287243); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 4287243."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 4287243: the main trail; the 30 km of side trails are separate relations. The 11 ways with a side role are in alternates.geojson."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 4287243
note = "Downloaded 2026-11-10; 368 ways in the main track and 11 in alternates. release.txt has the source and date."

[shield]
status = "use-real-logo"
logo_source = "https://www.oakridgestrail.org/wp-content/uploads/2024/07/favicon.jpg"
contact = "Oak Ridges Trail Association"
note = "The Association's mark (winding path, oak leaf, 'ORTA'), the site icon of oakridgestrail.org at 1100 px, reduced to 1024 px and saved as PNG; border trimmed. The image has a white ground. It is the Association's only mark and no separate trail marker artwork was found. No terms for use of the logo are stated on the page."
logo_file = "shield.png"
logo_owner = "Oak Ridges Trail Association"

[verification]
verified = true
date = "2026-11-10"
measured_km = 254.4
difference_percent = -5.8
parts = 2
note = "OSM relation 4287243, 368 ways: 254.4 km in 2 parts, 5.8% short of the published 270 km. The 11 ways with a side role are in alternates.geojson."

[hike]
summary = "The Oak Ridges Trail is a walking route along the Oak Ridges Moraine, from the Bruce Trail at Glen Haffy Conservation Area east of Caledon through forested tracts, conservation areas and country road allowances to the Castleton and Warkworth area of Northumberland County. It is marked with white blazes and maintained by Oak Ridges Trail Association volunteers."
official_url = "https://www.oakridgestrail.org/"
start = "Glen Haffy Conservation Area, near Caledon, Ontario"
end = "Castleton or Warkworth, Northumberland County, Ontario"
shape = "point-to-point"
terrain = ["forest", "farmland"]
travel = "trail-and-road"
caution = "There are no overnight accommodations on the trail and camping is not permitted."
checked = "2026-11-20"
season = "April to October"
months = [4, 5, 6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The southern Ontario moraine is snowy and muddy over winter and can be walked from April until late fall. Confidence: medium."

[[hike.source]]
url = "https://www.oakridgestrail.org/end-to-end-hike/"
publisher = "Oak Ridges Trail Association"
facts = ["official_url", "summary", "shape", "travel", "caution"]

[[hike.source]]
url = "https://www.oakridgestrail.org/chapters/"
publisher = "Oak Ridges Trail Association"
facts = ["summary", "start", "end", "terrain"]

[[hike.source]]
url = "https://www.chelsa-climate.org/datasets/chelsa_climatologies"
publisher = "WSL (CHELSA) and NOAA NCEI (ETOPO)"
facts = ["season", "months"]

