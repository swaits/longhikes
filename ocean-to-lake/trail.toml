difference_percent = 1.2
parts = 2
note = "OSM relation 7037710, 85 main ways and 4 in alternates: 100.2 km in 2 parts, 1.2% over the published 99 km."

[hike]
summary = "The Ocean to Lake Hiking Trail runs west from Hobe Sound Beach on the Atlantic coast to Lake Okeechobee in southeast Florida. It crosses Jonathan Dickinson State Park, Palm Beach County natural areas, Corbett Wildlife Management Area and the Dupuis Management Area. The country changes about every mile, from sand dunes with scrub oak and sand pine to pine flatwoods, hammocks, cypress swamp and wet prairie."
official_url = "https://www.loxfltrail.org/Ocean2LakeHikingTrail.html"
start = "Hobe Sound Beach, Florida"
end = "Lake Okeechobee Scenic Trail trailhead, near Port Mayaca, Florida"
shape = "point-to-point"
terrain = ["coast", "forest"]
travel = "trail"
caution = "Sections can be closed for hunting, prescribed burns or agency maintenance, and fees are charged for Jonathan Dickinson State Park and Corbett Wildlife Management Area."
checked = "2026-11-14"

