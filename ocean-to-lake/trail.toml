contact = "Florida Trail Association, Loxahatchee Chapter"
note = "No emblem of its own. The chapter's site uses the Loxahatchee Chapter's own hiker logo and the Florida Trail Association's mark; neither stands for this trail. The image shown for the trail on its page is a route map, and the chapter's printable map PDFs carry the same two chapter and association marks in their corners, with the trail name as plain type. The yearly Ocean to Lake Hike event page uses no badge either. Addresses looked at: loxfltrail.org/Ocean2LakeHikingTrail.html, loxfltrail.org/lake2ocean.html and loxfltrail.org/ (pages and their sources), and two PDFs linked from the trail page, loxfltrail.org/docs/OTLHT-Map-1-Full-Route-2019-10.pdf and loxfltrail.org/OTLDataBook.pdf (both rendered and read). Wikimedia Commons was also searched and holds only a photograph."
logo_file = ""
logo_owner = ""

