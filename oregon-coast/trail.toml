[source]
status = "osm-only"
publisher = "Oregon Parks and Recreation Department (publishes the trail; no open geometry found)"
url = "https://www.openstreetmap.org/relation/8310290"
discovery = "osm-relation-version: Overpass `rel(ID); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap relation, read through Overpass or a Geofabrik extract"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 8310290."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "The main track is the Oregon Coast Trail walked once, from the mouth of the Columbia River to the California border: the ways of OpenStreetMap relation 8310290 with the role main or no role, in the relation's order. The 124 ways the relation marks 'alternative' are in alternates.geojson. They are the road routes through Garibaldi and along Bayocean Road (about 27 km) and on Highway 101 around Nehalem Bay (about 14 km, against the main route by the OCT ferry), and Ecola Park Road (about 3 km, against the Indian Beach Trail). One of two parallel ways for Bayocean Dike Road (1.5 km), both marked main, is there too. OPRD layers exist (services, facilities); no track layer found yet. Much of it is beach and road walking."
source_checked = "2026-11-16"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 8310290
note = "OSM relation 8310290, version 95 (2026-10-06), read again 2026-11-16 with tools/osm_track.py. The main track is 822 ways; 126 ways are in alternates."

[shield]
status = "use-real-logo"
logo_source = "https://stateparks.oregon.gov/ckFiles/files/OCT-Map-1.pdf"
contact = "Oregon Parks and Recreation Department"
note = "The emblem is the Oregon Coast Trail logo: a blue-framed square with waves on one side and a dashed white route across a black shore on the other. Oregon State Parks prints it at the head of every section map on its Oregon Coast Trail page, above the words Oregon Coast Trail, and the 2023 Oregon Coast Trail Action Plan says town signage should include the OCT logo. Cropped from section map 1 (OCT-Map-1.pdf, rendered at 300 dpi) to the square alone; the words below it were cut off. Also checked: stateparks.oregon.gov Oregon Coast Trail page and home page (agency logo only), section maps, the 2023 Action Plan PDF (agency logos only on its cover), oregoncoasttrail.org (the Foundation's site: home, about, maps and gallery pages show photographs and map screenshots, no logo file), and Wikimedia Commons (no emblem file). The same logo is sold on merchandise, which was not used as a source."
logo_file = "shield.png"
logo_owner = "Oregon Parks and Recreation Department"

[verification]
verified = true
date = "2026-11-16"
measured_km = 629.5
difference_percent = -3.2
parts = 8
note = "One walk of 629.5 km in 8 parts, 3.2% short of 650 km. The earlier track, 675.5 km, held both branches at three splits (Garibaldi and Bayocean, Nehalem Bay, Ecola Park); the 126 ways of the other branches, 45.9 km, are in alternates.geojson."

[hike]
summary = "The Oregon Coast Trail follows the Oregon coastline, crossing sandy beaches, forest-shaded corridors, majestic headlands and 28 coastal towns. Most of the route is on the beach, some segments wind through state parks or public lands, and about a tenth of it is on the shoulders of highways and city streets."
official_url = "https://stateparks.oregon.gov/index.cfm?do=v.page&id=95"
start = "the mouth of the Columbia River, Oregon"
end = "the California border"
shape = "point-to-point"
terrain = ["coast", "forest"]
travel = "trail-and-road"
caution = "Completing the trail takes planning: some sections need challenging scrambles, pre-planned supply drops and an understanding of tides."
days = [21, 28]
checked = "2026-11-19"

