note = "The trail's emblem: a pronghorn head in a rounded shield lettered Oregon Desert Trail. ONDA shows it in use on the cover of the Oregon Desert Trail Guidebook, pictured at https://onda.org/regions/oregon-desert-trail/plan-a-trip/. Cropped from that cover image and cut to the shield outline, so the photograph behind its top corners, the Guidebook wording and the ONDA logo are not included. Cropped again to show the whole crest. At 236 px wide it is the largest the 463 px cover image offers. No logo terms were found on the site."
