[hike]
summary = "The Oregon Desert Trail is a route of about 750 miles across Oregon's high desert, from outside Bend in the west to Lake Owyhee State Park in the east. It links existing hiking trails, old jeep tracks and wagon roads with cross-country travel, and water can be very limited. Hart Mountain, Steens Mountain and the Owyhee Canyonlands are among its highlights."
