[hike]
summary = "The Ouachita National Recreation Trail stretches through the Ouachita Mountains of Arkansas and Oklahoma, from Talimena State Park through Queen Wilhelmina State Park to Pinnacle Mountain State Park near Little Rock. It is a non-motorized single-track trail, open only to foot traffic and partly to mountain bikes, running mostly through the Ouachita National Forest and crossing the Flatside and Upper Kiamichi wildernesses, with shelters for overnight camping along the way."
official_url = "https://www.friendsoftheouachita.org/about-the-ot"
start = "Talimena State Park, Oklahoma"
end = "Pinnacle Mountain State Park, near Little Rock, Arkansas"
