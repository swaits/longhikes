[hike]
summary = "The Ozark Highlands Trail runs across northern Arkansas from Lake Fort Smith toward the Missouri border north of Norfork Lake. It crosses the Boston Mountains, then follows the Buffalo River Trail for 43 miles through the Buffalo River country, in rugged forested Ozark terrain. Fall through spring are its peak seasons."
official_url = "https://ozarkhighlandstrail.com/trail/"
start = "Lake Fort Smith State Park, Arkansas"
end = "Missouri border north of Norfork Lake, Arkansas"
shape = "point-to-point"
terrain = ["forest", "lakes"]
travel = "some-cross-country"
unfinished = "About 290 miles of the 325-mile route are built, with no built trail yet for about 14 miles through the Lower Buffalo Wilderness or for about 18 miles along the shore of Norfork Lake. The association says a complete thru-hike is 'difficult but possible'."
caution = "East of Dillard's Ferry on AR-14, the way to the Spring Creek trailhead is a bushwhack of about 15 miles with no built trail, mostly through the Lower Buffalo Wilderness, and past the Matney Knob trailhead the trail goes on as separate pieces along Norfork Lake, joined by a road walk of about 10 miles."
season = "October to early June"
months = [10, 11, 12, 1, 2, 3, 4, 5]
checked = "2026-11-16"

