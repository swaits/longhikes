attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
decision = "included-named"
decision_text = "Included with its name and logo. The track is from OpenStreetMap."
mainline = "One relation: the continuous thru route. The disconnected sections of the Ozark Trail system are not mapped in it. In the Eleven Point section the relation holds two ways between the same two points, which it names the Eleven Point Low Route (6.3 km) and the Eleven Point High Route (10.5 km), with no role on either. The Ozark Trail Association's site answered 403 to two requests for its section pages, so the pages that might say were not read, and its thru-hiking page does not mention the two routes. The track keeps the more direct Low Route, and the High Route is in alternates.geojson."
source_checked = "2026-11-08"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

