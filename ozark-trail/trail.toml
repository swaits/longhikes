country = "US"
regions = ["MO"]
length_km = 370
length_note = "230 mi from Onondaga Cave State Park to the western edge of the Mark Twain National Forest, as the Forest Service gives it; 230 is a rounded figure. The Forest Service lists 13 sections, 5 of them 'Not Connected to Other Sections for through Hiking'."
tier = "regional"
designation = "Ozark Trail Association; Missouri State Parks and USFS"
wave = 1

[source]
status = "osm-only"
publisher = "Ozark Trail Association (publishes the trail); the ArcGIS item 'Ozark Trails Association' now answers 'Token Required'"
url = "https://www.openstreetmap.org/relation/16710911"
