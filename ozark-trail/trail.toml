relation = 16710911
note = "Found by a name search on 2026-11-08: relation 16710911 'Ozark Trail' (route hiking). Five section relations also exist. Downloaded; release.txt has the version."

[shield]
status = "use-real-logo"
logo_source = "https://ozarktrail.com/wp-content/uploads/2018/01/ozark_trail_association_ipad_icon.png"
contact = "Ozark Trail Association"
note = "The Ozark Trail Association's rounded-triangle emblem, a green T monogram, from its square icon on ozarktrail.com. The association name and wordmark in the existing lockup are cut off. This is the largest copy of the emblem alone found at this source, at 200 px, and nothing larger was found. Whether the association's emblem stands for the trail itself is a judgement, and the owner may wish to check it."
logo_file = "shield.png"
logo_owner = "Ozark Trail Association"

[verification]
verified = true
date = "2026-11-16"
measured_km = 362.0
difference_percent = -2.2
parts = 1
note = "The continuous thru route is what is mapped: 362.0 km in 1 part, 2.2% short of the 230 mi (370 km) the Forest Service gives for the through route. The earlier track, 372.6 km, held both the Low and the High Route in the Eleven Point section; the High Route (10.5 km) is in alternates.geojson. Disconnected sections and planned extensions are not in this relation."

[hike]
summary = "The Ozark Trail winds through the Missouri Ozarks in sections that are meant one day to run from St. Louis to the Arkansas border. A thru-hike follows the contiguous backbone from Onondaga Cave State Park south to the western edge of the Mark Twain National Forest."
official_url = "https://ozarktrail.com/thru-hiking/"
start = "Onondaga Cave State Park, Missouri"
end = "Western edge of the Mark Twain National Forest, Missouri"
shape = "point-to-point"
travel = "trail"
unfinished = "The St. Louis to Arkansas border route is not complete; about 230 miles form the contiguous thru-hike backbone."
checked = "2026-11-20"
season = "March to May and September to November"
months = [3, 4, 5, 9, 10, 11]
season_basis = "sources"
season_method = "The pages differ: one Trek page gives spring or fall and another adds winter. It was set by judgement from both and from the climate, since the heat, humidity and ticks of July and August make summer a poor choice. Confidence: medium."

