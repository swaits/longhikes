publisher = "Pacific Crest Trail Association (PCTA)"
url = "https://services5.arcgis.com/ZldHa25efPFpMmfB/ArcGIS/rest/services/PCTA_Centerline/FeatureServer/0"
discovery = "arcgis-layer-edit-date: GET <layer>?f=json and read editingInfo.dataLastEditDate (and the feature count); fetch again when either changes. PCTA updates the track once a year, early in the year (last edit 2026-01-06)."
format = "ArcGIS FeatureServer layer, one feature (a 35 MB GeoJSON when asked for all vertices); PCTA also offers file downloads at pcta.org/discover-the-trail/maps/pct-data/"
crs = "EPSG:4326"
licence = "CC-BY-4.0"
licence_text = "Creative Commons Attribution 4.0 International (CC BY 4.0). The Pacific Crest Trail Association states: 'All of the data accessed through this page are licensed under the Creative Commons Attribution 4.0 International License.' (https://www.pcta.org/discover-the-trail/maps/pct-data/, read 2026-11-09). Credit: Pacific Crest Trail Association."
attribution = "Pacific Crest Trail Association (CC BY 4.0). Say that the track was reshaped."
osm_only = false
mainline = "One feature, the main track. No alternates or connectors in this layer (PCTA publishes those separately)."
source_checked = "2026-11-08"
redistributable = true
line_source = "Pacific Crest Trail Association (PCTA)"
line_file = "line.geojson"

[osm]
relation = 1225378
note = "OSM has 1225378 plus about 30 section relations; not needed."

[shield]
status = "use-real-logo"
logo_source = "https://www.fs.usda.gov/sites/nfs/files/trails/pacific-crest-nst/image/PCT%20logo.jpg"
contact = "Pacific Crest Trail Association (pcta.org); USFS Pacific Crest NST office"
note = "The National Scenic Trail crest, from the Forest Service page for the Pacific Crest National Scenic Trail. Replaces the earlier crop from the PCTA banner. The source is a small JPEG of 253 by 289 px, so the file is smaller than 256 px on its short side; pcta.org refused automated reads, so no larger copy was found. Trimmed the white border and saved as PNG; the pixels were not changed. The white surround was made transparent."
logo_file = "shield.png"
logo_owner = "Pacific Crest Trail Association (pcta.org); USFS Pacific Crest NST office"

[verification]
verified = true
date = "2026-11-08"
measured_km = 4271.3
difference_percent = 0.1
parts = 1
note = "One feature, one track, 4,271.3 km, +0.1% over 4,265 km."

[hike]
summary = "The Pacific Crest Trail runs from the Mexican border to the Canadian border along the mountain ranges of California, Oregon and Washington. It crosses desert, the granite High Sierra, volcanic Cascade peaks and wet northern forest. Its highest point, Forester Pass in the Sierra Nevada, is above 13,000 feet."
official_url = "https://www.fs.usda.gov/trails/pacific-crest-nst"
start = "Campo, California"
end = "Monument 78 at the Canadian border, Washington"
shape = "point-to-point"
high_point = "Forester Pass"
high_point_m = 4017
terrain = ["desert", "alpine", "forest"]
travel = "trail"
permit = "Wilderness permits are needed in most of the wilderness areas the trail crosses, and the Pacific Crest Trail Association issues one permit for trips of 500 or more continuous miles."
checked = "2026-11-13"

