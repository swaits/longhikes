[shield]
status = "use-real-logo"
logo_source = "https://pnt-prod.s3.amazonaws.com/wp-content/uploads/PNTA-Header.png"
contact = "Pacific Northwest Trail Association (pnt.org); USFS Region 6"
note = "The Pacific Northwest Trail Association roundel: peaks and water ringed with the words Pacific Northwest Trail Association and PNTA. It is shown in use in the header of https://www.pnt.org/; cropped from that header art, the wording set beside the roundel was cut off. The Forest Service trail home page at https://www.fs.usda.gov/trails/pacific-northwest-nst shows no trail emblem, and the Forest Service's Pacific Northwest NST Advisory Council minutes (March 2024, fs.usda.gov) record that its three-sided thunderbird service mark is not the official federal mark and is to be replaced. No logo terms were found on the Association's site. Federal National Scenic Trail insignia are covered by 18 U.S.C. 701; this roundel is the Association's mark."
logo_file = "shield.png"
logo_owner = "Pacific Northwest Trail Association"

[verification]
verified = true
