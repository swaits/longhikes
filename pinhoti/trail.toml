[source]
status = "osm-only"
publisher = "Pinhoti Trail Alliance (publishes the trail; no open geometry found)"
url = "https://www.openstreetmap.org/relation/1642836"
discovery = "osm-relation-version: Overpass `rel(ID); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap relation, read through Overpass or a Geofabrik extract"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 1642836."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM 1642836. An ArcGIS item 'The Pinhoti Trail' exists under a university account (Jacksonville State, 2022); provenance unknown, not used. The relation gives the divided Walnut Avenue twice, as two carriageways 15 to 17 m apart, one on East Walnut Avenue (2.8 km) and one on West Walnut Avenue (1.2 km), both with the role forward. The track keeps one carriageway of each, and the two copies were left out."
source_checked = "2026-11-08"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 1642836
note = "Downloaded 2026-11-08; release.txt has the relation version and timestamp. Re-cut 2026-11-16: two ways that copied the other carriageway of Walnut Avenue were left out, so the track is 224 ways."

[shield]
status = "logo-not-found"
logo_source = ""
contact = "Alabama Trails Foundation (the Pinhoti's Alabama maintainer); Georgia Pinhoti Trail Association"
note = "The trail's emblem exists but no standalone artwork of it is at an allowed source. In use on the ground it is a turkey footprint: white diamond markers and a rounded-triangle National Recreation Trail marker, both black on white, photographed in the Pinhoti Trail Built Environment Master Plan (May 2019) that the Alabama Trails Foundation links from its home page. That plan also proposes a redrawn blue turkey-foot primary logo, but no current holder page was found using the redraw, so it was not used. The file that was in the record was the Alabama Trails Foundation's own wordmark, not the trail's emblem, so it was removed. Addresses looked at: alabamatrailsfoundation.org/ and its Pinhoti search results (alabamatrailsfoundation.org/?s=Pinhoti), the master plan PDF it links at dropbox.com/s/oaevvd5jpe7qteq/PinhotiMasterPlan_Book_190510%20(s).pdf, georgiapinhoti.org/ (now a blank page), the Forest Service Pinhoti pages for Georgia and Alabama at fs.usda.gov, and Wikimedia Commons, which holds a photograph of a trail marker, not artwork."
logo_file = ""
logo_owner = ""

[verification]
verified = true
date = "2026-11-16"
measured_km = 533.3
difference_percent = -1.2
parts = 1
note = "224 ways, 533.3 km in 1 part, 1.2% short of 540 km. The earlier track, 537.1 km in 226 ways, held both carriageways of Walnut Avenue; the copies, 4.0 km, were left out."

[hike]
summary = "The Pinhoti Trail is a Southern Appalachian long-distance trail through Alabama and Georgia. It begins at Flagg Mountain in Alabama, in montane longleaf pine forest, and links in Georgia to the Benton MacKaye Trail toward Springer Mountain."
official_url = "https://www.alabamaforeverwild.com/weogufka-state-forest-addition-terminus-pinhoti-trail"
