length_km = 88
length_note = "54.6 mi, as the book gives it for Trip 6 (page 75), with 7,250 ft of elevation gain, 9 days and no shuttle. The book's days assume about 8 miles a day, and it calls its itinerary a minimum: 12 days would not be excessive. The figure is the book's own and is not measured from a track. The only ground walked twice lies within the 0.6 mile between the trailhead and the spring at Muav Saddle, so at least 54.0 miles are walked once. The published figure stays as the length."
