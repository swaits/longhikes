[hike]
summary = "The Powell Plateau Loop is a nine day backpacking loop in the Grand Canyon in Arizona, from the Swamp Point Trailhead around Powell Plateau along the Colorado River. It uses the North Bass Trail and runs through Shinumo Creek, Tapeats Creek and Saddle Canyon, and through Middle Granite Gorge, Conquistador Aisle, Stephen Aisle and Granite Gorge. Bruce Grubbs describes it as Trip 6 in Backpacking Arizona."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-arizona/"
start = "Swamp Point Trailhead, Grand Canyon National Park, Arizona"
start_lonlat = [-112.354, 36.335]
shape = "loop"
days = [9, 9]
season = "Mid September to November"
months = [9, 10, 11]
terrain = ["canyon"]
travel = "mostly-cross-country"
permit = "A permit is required to camp within Grand Canyon National Park, as the book states."
caution = "The book calls this a strenuous cross-country hike, says every member of the party should be fit and that the leader should have experience hiking cross-country in the Grand Canyon. The author rates its difficulty 10 out of 10. The book advises carrying a short rope to haul packs, and says one polished chute needs care. The book lists water at Muav Saddle Spring, Tapeats Creek, the Colorado River, Key Spring, Hakatai Canyon, Shinumo Creek and White Creek. Campfires are not allowed in the park's backcountry, and pets are not allowed on trails or in the backcountry."
checked = "2026-11-18"

