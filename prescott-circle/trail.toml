contact = "City of Prescott and Prescott National Forest"
note = "The trail's roundel: boot prints, a horseshoe and a bicycle in a green circle lettered Prescott Circle Trail. The City of Prescott's site https://prescott-az.gov/?p=25791 refused automated reads (403 on the trail page and on its map PDF, checked 2026-11-16), and the Prescott National Forest pages show no emblem art. The file was taken as shown in use from the Yavapai Trails Association's Prescott Circle Trail page, https://www.yavapai-trails.org/prescott-circle-trail/; the Forest Service links to that association as the publisher of the Prescott Circle Trail maps and guide. The file is unchanged, and at 229x220 px it is the largest version found at an allowed source. No logo terms were found on that page."
logo_file = "shield.png"
logo_owner = "City of Prescott"

