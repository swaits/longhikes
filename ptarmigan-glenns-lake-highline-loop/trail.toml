discovery = "arcgis-query-hash: GET <url>/query with where 1=1 (outFields=*, outSR=4326, f=geojson); hash the answer body and count its rows; fetch again when either changes. 396 features on 2026-11-19; the item was last modified 2023-07-12."
format = "ArcGIS FeatureServer layer 0 (trails_public), outSR=4326, f=geojson, 26 features used (28 pieces: 2 multi-part features contribute 2 pieces each)"
crs = "EPSG:4326"
licence = "us-gov-public-domain"
licence_text = "United States federal government work, public domain in the United States under 17 U.S.C. 105. The feature service's copyright text reads 'Glacier National Park GIS Program' and its access information the same; its terms text says: 'This version of Glacier's Trail GIS data is for public use in mapping applications.' (item page https://www.arcgis.com/home/item.html?id=4c7190ee69914d6bb66592607f8042b1, read 2026-11-19). Its metadata (https://www.arcgis.com/sharing/rest/content/items/4c7190ee69914d6bb66592607f8042b1/info/metadata/metadata.xml, read 2026-11-19) names National Park Service, Glacier National Park as the originator and publisher of the data and gives access and use constraints as 'None.'. The service is hosted in an ArcGIS Online organisation of the Montana Department of Natural Resources and Conservation, so the Park Service is the maker of the data and not the host of the service; the data are the Park Service's own and carry no licence of their own. The National Park Service states, of its data: 'Data and content created by government employees within the scope of their employment are not subject to domestic copyright protection under 17 U.S.C. 105.' (https://irma.nps.gov/DataStore/Reference/Profile/2311077, read 2026-11-18)."
attribution = "National Park Service, Glacier National Park GIS Program"
osm_only = false
mainline = "One closed track of 28 pieces (26 features) from the junction of the Ptarmigan and Swiftcurrent Pass trails at Many Glacier, by the trail the layer names Ptarmigan (to the Ptarmigan Tunnel, Elizabeth Lake and the Belly River to the foot of Cosley Lake), Stoney Indian Pass (Cosley Lake, Glenns Lake, Mokowanis Junction, Stoney Indian Pass and Stoney Indian Lake to the Waterton Valley junction), Waterton Valley (to Fifty Mountain), Highline (Fifty Mountain to the Granite Park trail junction) and Swiftcurrent Pass (to Many Glacier). Where two layer trails run between the same places, the Ptarmigan Trail between the Belly River Ranger Station junction and the foot of Cosley Lake is used and the longer way by the Belly Ranger Station and the Cosley Lake Cutoff is not, because the Ptarmigan Trail is the one trail that runs through, and published itineraries name Elizabeth Lake and Cosley Lake with no stop at the ranger station. Left out: the Goat Haunt detour (Waterton Valley and Waterton Lake trails), the Redgap Pass trail (the way round when the tunnel is closed: its trailhead is on the Many Glacier Road, 2.8 km from the loop's start, and no layer trail joins them), the spurs to Cosley Lake and Granite Park campgrounds and the spur to Granite Park Chalet, the Mokowanis Lake and Iceberg Lake trails, and the Swiftcurrent Lake trail to the picnic area."
source_checked = "2026-11-19"
redistributable = true
line_source = "National Park Service, Glacier National Park trails layer"
line_file = "line.geojson"

