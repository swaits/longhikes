# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "ptarmigan-glenns-lake-highline-loop"
name = "North Circle"
country = "US"
regions = ["MT"]
length_km = 84
length_note = "52 mi (84 km), the modern loop as published: Mike White and Douglas Lorain's Best Backpacking Trips in Montana, Wyoming, and Colorado gives it as 52 mi for Trip 1 (pages 16-42), the minimum loop, with 10,750 ft of elevation gain and 5 to 13 days, and one trip-report page gives about 52 mi; Backpacker magazine and 10adventures give 55.5 mi. The book's own day table adds up to 52.2 mi for the loop, with short spurs to camps walked out and back. The book also prints 106 mi and 16,200 ft for the trip with its recommended side trips added (its day table sums to 105.6 mi), the longest being the out-and-back to Boulder Pass. The park's historic loop went down to Goat Haunt on Waterton Lake and back and was about 65 mi as the Park Service's National Register record gives its legs (14, 19, 10, 13 and 9 mi). The track from the park's trails layer measures 83.1 km (51.6 mi), 0.7% under 52 mi."
tier = "regional"
designation = "A named loop on National Park Service trails in Glacier National Park that the Park Service's National Register record lists as the North Circle; the loop itself is not one designated trail"
wave = 1
places_checked = "2026-11-20"
places_track = "7e13b7139d733bd7"

