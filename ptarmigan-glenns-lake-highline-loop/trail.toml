[hike]
summary = "The Ptarmigan–Glenns Lake–Highline Loop is a backpacking loop of 5 to 13 days in the northeast of Glacier National Park, Montana, from the Swiftcurrent Picnic Area near Many Glacier. It passes through Ptarmigan Tunnel, follows the Belly River and Glenns Lake to Stoney Indian Pass and returns by Fifty Mountain and the Highline Trail, and about half of it follows the Continental Divide Trail. Mike White and Douglas Lorain describe it as Trip 1 in Best Backpacking Trips in Montana, Wyoming, and Colorado."
official_url = "https://upcolorado.com/university-press-of-colorado/best-backpacking-trips-in-montana-wyoming-and-colorado"
start = "Swiftcurrent Picnic Area, Glacier National Park, Montana"
start_lonlat = [-113.668, 48.797]
shape = "loop"
days = [5, 13]
season = "Late July to mid-October, best in August"
months = [8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "A permit is required, and the book says camping is only allowed at designated campsites. Advance reservations are made online, with requests received on the opening day processed in a random order; without a reservation the book says hikers must queue very early for a first-come permit and the odds are poor."
caution = "The book says Glacier is grizzly bear country, that hikers should carry bear spray and store all food away from bears, and that solo travel is not recommended. Snowfields lie across the trail on steep north-facing slopes into late July or early August and can be dangerously icy, which the book says makes parts of the loop too hazardous for most hikers before late summer. Seasonal bridges may be missing, leaving tricky fords, and the trail is often brushy and wet with dew. Campsites are designated, usually full all summer, and close together. The authors rate the technical difficulty 6 and the physical difficulty 7, each out of 10. The 52 mile loop is on maintained trail, with an optional side trip on a sketchy cairned boot path; the book mentions no scrambling or rope."
checked = "2026-11-18"

