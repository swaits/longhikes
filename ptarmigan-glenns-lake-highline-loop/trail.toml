[hike]
summary = "The North Circle is a backpacking loop in the northeast of Glacier National Park, Montana, from Many Glacier by Ptarmigan Tunnel, the Belly River, Cosley and Glenns lakes, Stoney Indian Pass, Fifty Mountain and the Highline Trail, returning over Swiftcurrent Pass. It is also called the Many Glacier Loop and, in a guidebook, the Ptarmigan–Glenns Lake–Highline Loop. The Park Service's National Register record of the park's tourist trails lists it as the North Circle."
official_url = "https://npgallery.nps.gov/NRHP/GetAsset/NRHP/95001579_text"
start = "Swiftcurrent Picnic Area, Glacier National Park, Montana"
start_lonlat = [-113.668, 48.797]
shape = "loop"
days = [5, 13]
season = "Mid-July to late September"
months = [7, 8, 9]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "The Park Service requires a wilderness use permit for all overnight camping in the park."
caution = "On 2026-11-19 the Park Service's trail status page said: \"Generally, Ptarmigan Tunnel doors open in mid-July\" and \"Ptarmigan Tunnel doors usually close by late September\"; the loop cannot be walked by the tunnel outside that time. The guide says Glacier is grizzly bear country, that hikers should carry bear spray and store all food away from bears, and that snowfields on steep north-facing slopes can be dangerously icy into late July or early August."
checked = "2026-11-19"
season_basis = "source"

