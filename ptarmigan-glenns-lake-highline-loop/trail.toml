line_policy = "sold"
note = "Trip 1 in the book, on pages 16-42. A loop from the Swiftcurrent Picnic Area near Many Glacier past Ptarmigan Tunnel, the Belly River, Cosley and Glenns lakes, Stoney Indian Pass, Fifty Mountain and the Highline Trail, and back over Swiftcurrent Pass, with 52 miles as the minimum loop and 5 to 13 days in the book. About half of the loop follows the Continental Divide Trail: by the dataset's own check against its Continental Divide Trail track, about 25 of the 52 miles, from Swiftcurrent Pass by Granite Park and the Highline Trail to the Waterton Valley junction below Stoney Indian Lake, lie on it. The book's maps are the track; none is copied here."

