length_note = "41.4 mi, as the National Park Service gives it: 'The loop is 41.4 miles long, and climbs from 5035' (1535m) at the trailhead to 11,978' (3651m) at Glen Pass.' This is under the 50 mile floor; it is listed because it is very well known and popular. The Park Service's 41.4 miles includes the 1.9 miles between Road's End and the loop junction, walked both ways."
tier = "short"
