[hike]
summary = "The Rae Lakes Loop is a backpacking loop in Kings Canyon National Park, California, from Road's End in Cedar Grove up the Kings River canyon past Paradise Valley and the Woods Creek crossing to the Rae Lakes, over Glen Pass and down Bubbs Creek by way of Vidette Meadow and Junction Meadow. The Park Service gives it as 41.4 miles, climbing from about 5,035 feet at the trailhead to 11,978 feet at Glen Pass. It is most often started from the Woods Creek trailhead to walk it clockwise or from the Bubbs Creek trailhead to walk it counter-clockwise."
official_url = "https://www.nps.gov/seki/planyourvisit/rae-lakes-loop.htm"
start = "Road's End, Cedar Grove, Kings Canyon National Park, California"
shape = "loop"
high_point = "Glen Pass"
high_point_m = 3651
permit = "The Park Service issues wilderness permits for overnight trips in Sequoia and Kings Canyon National Parks, limits the number of people starting each day by entry point, and takes reservations on Recreation.gov up to six months ahead; a recreation fee is required."
caution = "The Park Service says hikers must carry portable bear-resistant canisters and that campfires are prohibited above 10,000 feet. Camping is limited to two nights in Paradise Valley, one night per lake at Rae Lakes and two nights at Charlotte Lake, and Bullfrog Lake is closed to camping. High water at stream crossings can be a problem in May and early June, and Glen Pass may be impassable to hikers until mid to late July. The South Fork Kings River bridge above Paradise Valley washed out in the winter of 2016-2017 and a replacement will not be started before 2027; the Park Service says crossing the river can be extremely hazardous, depending on conditions."
checked = "2026-11-18"

