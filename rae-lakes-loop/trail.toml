publisher_url = "https://www.nps.gov/seki/planyourvisit/rae-lakes-loop.htm"
url = "https://services1.arcgis.com/fBc8EJBxQRMcHlei/ArcGIS/rest/services/SEKI_ParkAtlas2_4_HikingandBackpacking_MASTER/FeatureServer/12"
discovery = "arcgis-query-hash: GET <url>/query with where 1=1 (outSR=4326, f=geojson); hash the answer body and count its rows; fetch again when either changes. 16 features on 2026-11-19."
format = "ArcGIS FeatureServer layer 12 (Park Atlas, National Park Service), outSR=4326, f=geojson, 16 features: 14 in the loop and 2 in the stem"
crs = "EPSG:4326"
licence = "us-gov-public-domain"
licence_text = "United States federal government work, public domain in the United States under 17 U.S.C. 105. The Park Atlas service names the National Park Service, Sequoia and Kings Canyon National Parks as its publisher and states no licence of its own (its licence field is empty, read 2026-11-19); the National Park Service states, of its data: 'Data and content created by government employees within the scope of their employment are not subject to domestic copyright protection under 17 U.S.C. 105.' (https://irma.nps.gov/DataStore/Reference/Profile/2311077, read 2026-11-18). The layer is a dataset made by federal employees, a federal government work."
attribution = "National Park Service"
osm_only = false
mainline = "Layer 12 holds 16 features, the layer the Park Service names Rae Lakes Loop. 14 of them join end to end into the loop, 57.3 km, from the junction of the Paradise Valley and Bubbs Creek trails (Bailey Bridge junction): Mist Falls, Paradise Valley, Woods Creek, Woods Creek Crossing - Dollar Lake, two Rae Lakes pieces, Glen Pass South, three Vidette Switchbacks pieces, Junction Meadow Switchbacks - Bubbs, Bubbs Creek and two Bubbs Creek Switchbacks pieces; every join is 0 to 1 m and the loop closes at its start. The Park Service's own table of distances runs the same places in this order (Road's End, Paradise/Bubbs junction, Mist Falls, Lower, Middle and Upper Paradise, Woods Creek Crossing, Dollar Lake, Rae Lakes, Glen Pass, Charlotte Lake junction, Vidette Meadow, Junction Meadow, Charlotte Creek, Sphinx Junction, back to the junction). The 2 features named Cedar Grove Sand Flats are the stem from Road's End to that junction, 3.0 km (1.9 mi, as the Park Service's table gives it), kept in alternates.geojson. The pieces carry local names (Mist Falls, Bubbs Creek and so on) and list Rae Lakes Loop among their alternate names. The track keeps the loop and leaves the stem out."
source_checked = "2026-11-19"
redistributable = true
line_source = "National Park Service trail data (Park Atlas)"
