[shield]
status = "no-logo-exists"
logo_source = ""
contact = "Friends of the Peak"
note = "No emblem of its own. On the ground the Ring is marked with green Carsonite stakes whose 3-inch square labels are brown for clockwise and green for counterclockwise travel, with the name as type; no crest artwork is used by Friends of the Peak or the Trails and Open Space Coalition, whose pages show only their own organisation logos and a route map. The old ringthepeak.com address now serves nothing of the holder's, and its archived copy at web.archive.org refused automated reads (429) when tried once, so it was not worked around. Addresses looked at: friendsofthepeak.org/ring-the-peak-2/ (full page, including the Ring the Peak Trail map image at friendsofthepeak.org/wp-content/uploads/2021/03/Ring-the-Peak-Trail.png, which is a map with no emblem), friendsofthepeak.org/ (site header), trailsandopenspaces.org/ring-the-peak-draft-master-plan/ (which now serves the Coalition home page), and the archived snapshot address given above. Wikimedia Commons was also searched and holds no emblem for the trail."
logo_file = ""
logo_owner = ""

[verification]
verified = false
note = "No line to measure. The OpenStreetMap relation holds 9.7 km of about 101 km and was not used."

[hike]
summary = "Ring the Peak is a loop of trails and backcountry roads that circles Pikes Peak near Colorado Springs, Colorado. The trails cross federal, state, county and city land, and some private land. About four fifths of the loop is complete."
official_url = "https://friendsofthepeak.org/ring-the-peak-2/"
shape = "loop"
high_point_m = 3444
travel = "trail-and-road"
unfinished = "About 80 percent of the route is complete, and evaluation and planning continue for the remaining 20 percent."
caution = "Many of the trails are covered by snow in winter."
checked = "2026-11-14"

