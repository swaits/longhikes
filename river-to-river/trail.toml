contact = "River to River Trail Society"
note = "An emblem exists but no usable artwork was found at an allowed source. The trail's symbol since the beginning, as the Society's own guide puts it, is a white diamond with a blue i, and the Society also has a crest (the shape of southern Illinois with River to River Trail Society under it). Both appear at allowed sources only as photographs: photographs of the plastic and cedar diamond markers on page 7 of the Society's Trail Guide (rivertorivertrail.net/wp-content/uploads/2018/10/R2R_Trail_Guide_V5.0_201810.pdf), a photograph of an embroidered crest patch on that guide's cover, and a photograph of a diamond marker in the Society's 2022 dedication program PDF. Photographs of markers and patches are not usable artwork, so none is included. Also checked: rivertorivertrail.net home, about, society-information and trail-information pages (the site's HTML returned 406 to a direct automated read, so its pages were read through a plain fetch and its PDFs downloaded directly; its header is text only), the Forest Service Shawnee page fs.usda.gov/r09/shawnee/recreation/trails/river-river-trail (Forest Service and USDA logos only), and Wikimedia Commons (no relevant file). Ask the Society for its crest artwork."
