note = "Trip 72 in the book, on pages 246-250, from the 9th edition (2005); the first edition of the book dates from 1967 and the pages read do not show whether this trip was in it. A loop from the Glacier Point and Panorama trailhead down to Little Yosemite Valley, past Merced Lake, Lyell Fork and Post Peak Pass to Rutherford Lake, then by Fernandez Pass, Chain Lakes, Buck Camp and Royal Arch Lake back to Glacier Point, with 71.5 miles and 10 hiking days in the book. The book's maps are the track; none is copied here."

