id = "rutherford-lake-loop"
name = "Rutherford Lake Loop"
country = "US"
regions = ["CA"]
length_km = 115
length_note = "71.5 mi, as the book gives it for Trip 72 (pages 246-250), with 10 hiking days and 1 layover day. The book gives no elevation gain figure for the trip. It is a true loop from one trailhead, but two branches are walked out and back: the lateral to Rutherford Lake and the branch to Chain Lakes. The book gives no figure for them; the dataset's own estimate is about 2 miles walked twice, which leaves about 69.5 miles with nothing counted twice, uncertain by about half a mile. The figures are the book's own, except that estimate, and are not measured from a track."
kind = "route"
tier = "regional"
designation = "Guidebook route (Kathy Morey and Mike White, with Stacy Corless and Thomas Winnett, 2005, in Sierra North); no agency or association"
