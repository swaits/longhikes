[hike]
summary = "The Rutherford Lake Loop is a 10 day backpacking loop in Yosemite National Park's South Boundary country, California, from the Glacier Point and Panorama trailhead. It descends to Little Yosemite Valley and Merced Lake, climbs Post Peak Pass to Rutherford Lake, and returns by Fernandez Pass, Chain Lakes, Buck Camp and Royal Arch Lake. Kathy Morey, Mike White, Stacy Corless and Thomas Winnett describe it as Trip 72 in the 9th edition of Sierra North."
official_url = "https://shop.adventurewithkeen.com/product/sierra-north-2/"
start = "Glacier Point–Panorama Trailhead, Yosemite National Park, California"
start_lonlat = [-119.573, 37.728]
shape = "loop"
days = [10, 10]
season = "Mid to late season, about early July to early October"
months = [7, 8, 9]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "A Yosemite wilderness permit is required, as the book states."
caution = "The book says the trip is designed for the experienced backpacker and rates its pace moderate. It crosses three major passes, including a steep, loose, rocky descent of 600 feet below Post Peak Pass, and fords the South Fork Merced River, which the book calls wet in early season. Bear canisters are required in Yosemite, and pets and firearms are prohibited."
checked = "2026-11-18"
season_basis = "primary"

