[route]
creator = "Justin Simoni"
line_policy = "open"
creator_words = "Or, export the tracks in GPX to view them on a GPS device of your choosing."
creator_words_url = "https://sangrestraverse.longmayyourange.com/caltopo-map/"
note = "The guide describes two lines across the range from Lake Como to Salida, and this record is the High Route. The author calls the other, the Ridge Traverse, \"a long-distance mountaineering objective\" with Class 5 climbing, for which he names a rope, harness, climbing protection and rock shoes; it is a separate, technical line and is not what is listed here. He calls the High Route \"a more backpacking-friendly route\" that \"eschews much of the scrambling and technical climbing\", and says it \"allows you to stay up high, without requiring anything harder than a few Class 3 cruxes\". The two lines share ground: the author says segment 2 of both is the same, and they meet and part in other places. The route's page describes it from south to north."

[[guide]]
title = "The Sangre de Cristo Range High Route"
author = "Justin Simoni"
access = "free"
url = "https://sangrestraverse.longmayyourange.com/high-route/"
format = "web guide with a map whose tracks can be exported as GPX"
where = "the High Route page; the front page and the Ridge Traverse pages cover the shared ground"

[hike]
summary = "The Sangre de Cristo Range High Route is a route of about 121 miles across Colorado's Sangre de Cristo Range, from the Lake Como Road near Blanca in the south to Highway 50 near Salida in the north. Its author describes it as a backpacking route that stays up high but goes around much of the scrambling and technical climbing of the main ridge, keeping the whole route at most Class 3 in a few cruxy areas. He calls it still a very advanced route, with about 50,000 feet of gain and much travel off trail."
official_url = "https://sangrestraverse.longmayyourange.com/high-route/"
start = "Lake Como Road at Colorado Highway 150, near Blanca, Colorado"
start_lonlat = [-105.602, 37.522]
end = "County Road 107 at U.S. Highway 50, near Salida, Colorado"
end_lonlat = [-105.997, 38.524]
shape = "point-to-point"
season = "July to September"
months = [7, 8, 9]
season_basis = "primary"
high_point = "Ellingwood Point"
high_point_m = 4280
terrain = ["alpine"]
travel = "some-cross-country"
caution = "The author says one still needs to be comfortable scrambling at Class 3 with a loaded pack, and names as main cruxes the descent of Ellingwood Point's C2 couloir, the descent of \"Spread Eagle Peak\" and the descent of Cottonwood Peak. He says free water on the ridge is very rare, that there is no water in the second segment until Medano Pass, that much of the route is above treeline and exposed to lightning, that blowdown is one of the main problems below treeline, and that any bail could become a multi-day affair. He says there is no public transport to the start at Lake Como, so a walker must be dropped off, hitch or call a taxi."
checked = "2026-11-23"

