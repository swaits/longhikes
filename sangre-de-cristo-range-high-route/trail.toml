# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "sangre-de-cristo-range-high-route"
name = "Sangre de Cristo Range High Route"
country = "US"
regions = ["CO"]
length_km = 195
length_note = "121.3 miles, as the High Route's own page gives it: \"Sangre de Cristo High Route Elevation Profile: 121.3 miles, 49,473′ gain, 50,043′ loss\". The guide's front page prints the same profile as \"21.3 miles\", with the same gain and loss; that figure cannot be right for a route across the whole range, and the record uses the route's own page. The five segment lengths on the route's page (25.08, 22.11, 14.85, 35.14 and 28.3 miles) add up to about 125 miles, and the page says the High Route \"is roughly the same distance as the ridge traverse\". The figures are the author's own and are not measured from a track."
