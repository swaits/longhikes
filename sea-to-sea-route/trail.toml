line_policy = "unclear"
creator_words = "The Sea-to-Sea Route (C2C) is a 7,800-mile network of existing long-distance hiking trails that spans almost continuously between the Atlantic and Pacific Oceans, with the exception of an 800-mile gap in North Dakota and Montana along the Missouri River and a less formidable 30-mile gap in Vermont."
creator_words_url = "https://andrewskurka.com/adventures/sea-to-sea-route/overview/"
note = "A network of existing long-distance trails, with an 800-mile gap in North Dakota and Montana and a 30-mile gap in Vermont, joining the North Country, Pacific Northwest and other trails. Ron Strickland started thinking about it in 1996; Andrew Skurka made the first thru-hike from August 2004 to July 2005."

