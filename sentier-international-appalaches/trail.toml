[hike]
summary = "The Sentier international des Appalaches listed here runs from Perth-Andover in New Brunswick to Forillon National Park in Quebec. It crosses Mount Carleton Provincial Park, then in Quebec passes through the Matapédia valley, the Chic-Choc summits of the Parc de la Gaspésie, and along the sea from village to village. Country ranges from farmland to forest to sea cliffs."
official_url = "https://www.sia-iat.com/a-propos-du-sia?lang=en"
