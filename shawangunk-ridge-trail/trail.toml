[hike]
summary = "The Shawangunk Ridge Trail starts at the Appalachian Trail in High Point State Park in New Jersey and runs north along the Shawangunk Ridge in New York to Mohonk Preserve. It crosses Sam's Point Preserve and Minnewaska State Park, and uses some local roads and old rail beds. It shares about 34 miles with the Long Path."
