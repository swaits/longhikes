[hike]
summary = "The Shenipsit Trail runs north in central Connecticut from the Cobalt area of East Hampton to West Stafford, just south of the Massachusetts border. It crosses the Meshomasic and Shenipsit State Forests on woodland paths, with views from Case Mountain and Soapstone Mountain. The Connecticut Forest and Park Association publishes the trail page."
official_url = "https://ctwoodlands.org/trails/shenipsit-trail/"
