[hike]
summary = "The Sierra High Route is Steve Roper's timberline route through California's High Sierra from Kings Canyon National Park to northern Yosemite. It follows a general direction but no particular trail through the sub-alpine country. Its guidebook leads hikers point to point and favours cross-country travel over maintained trails."
official_url = "https://www.mountaineers.org/books/books/sierra-high-route-2nd-edition-traversing-timberline-country"
start = "Road's End, Kings Canyon National Park"
start_lonlat = [-118.583, 36.795]
end = "Mono Village at Twin Lakes, near Bridgeport"
end_lonlat = [-119.379, 38.144]
shape = "point-to-point"
terrain = ["alpine", "lakes"]
travel = "mostly-cross-country"
days = [14, 21]
permit = "A permit is needed from the agency that manages the trailhead where you start."
checked = "2026-11-20"
season = "July to September"
months = [7, 8, 9]
season_basis = "sources"
season_method = "The pages differ: Backpacking Routes gives late July to mid-September, and Skurka warns the route is off-limits to all but expert mountaineers from November through May. It was set by judgement from both and from the climate at the passes, which are near 12,000 feet. Confidence: high."

