[hike]
summary = "The Silver Moccasin Trail is a National Recreation Trail through the San Gabriel Mountains of the Angeles National Forest, California, from Chantry Flat above Arcadia to Vincent Gap on the Angeles Crest Highway near Wrightwood, by way of Mount Baden-Powell. About 55% of it, from Three Points to Vincent Gap, is also the Pacific Crest Trail. The trail was recorded as a 53-mile trail in its 1979 application, and a recent guidebook walks it in 51.7 miles."
official_url = "https://www.nrtapplication.org/trails/silver-moccasin"
start = "Chantry Flat, above Arcadia, California"
start_lonlat = [-118.022, 34.195]
end = "Vincent Gap, Angeles Crest Highway, near Wrightwood, California"
end_lonlat = [-117.752, 34.373]
shape = "point-to-point"
days = [4, 7]
season = "May to November"
months = [5, 6, 7, 8, 9, 10, 11]
high_point = "Mount Baden-Powell"
high_point_m = 2865
terrain = ["forest", "alpine"]
travel = "trail"
caution = "The Forest Service's alert, last updated November 10, 2026, says it has closed the Pacific Crest Trail between Eagles Roost on Highway 2 and the Burkhart Trail, which is the same tread as this trail, to protect the mountain yellow-legged frog; Forest Order 05-01-24-04 runs through December 31, 2026, and the alert gives no later date. Harris's chapter walks the bypass by the Burkhart Trail, Buckhorn Campground and the shoulder of Highway 2, 2.6 miles of it on the road, which he describes as dangerous. The book also warns that the ridge near Mount Baden-Powell is icy in winter and needs an ice ax and crampons."
checked = "2026-11-18"

