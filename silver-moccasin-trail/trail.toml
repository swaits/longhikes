# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "silver-moccasin-trail"
name = "Silver Moccasin Trail"
country = "US"
regions = ["CA"]
length_km = 82
length_note = "51 mi, the Length field of the National Recreation Trails database record for the trail, which comes from its 1979 application and may be out of date. The same record's description says 53 mi, as do Wikipedia and Fastest Known Time. David Harris's chapter in Backpacking California (3rd edition, 2020, Trip 12, page 67) gives 51.7 mi one way, which includes the walk by the bypass of the closed stretch and 2.6 mi on the shoulder of Highway 2. About 55% of the trail, from Three Points to Vincent Gap, is the Pacific Crest Trail."
tier = "regional"
designation = "National Recreation Trail in the Angeles National Forest, from Chantry Flat to Vincent Gap; about 55% of it, from Three Points to Vincent Gap, is the Pacific Crest Trail, a longer listed trail"
wave = 1

[source]
status = "osm-only"
publisher = "USDA Forest Service, Angeles National Forest (manages the trail; no whole-trail geometry found)"
publisher_url = "https://www.nrtapplication.org/trails/silver-moccasin"
url = "https://www.openstreetmap.org/relation/2748610"
discovery = "osm-relation-version: Overpass `rel(2748610); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 2748610."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 2748610 (version 19, 2025-12-24): 31 ways with no roles, from Vincent Gap to Chantry Flat. Three are left out: two named Shortcut Pass Road (ways 1190143359 and 1190144248, 13.5 km together), which leave the trail at the Shortcut Saddle trailhead on the Angeles Crest Highway and run away from it, south and then east, while the trail goes on down Shortcut Canyon by way 31305671, and a 0.2 km stub of the Silver Moccasin Trail (way 186473856) that branches off the trail's line at the same trailhead. The other 28 ways join end to end in one part: the Pacific Crest Trail from Vincent Gap to Three Points (45.2 km), then the Silver Moccasin Trail and the Gabrielino Trail to Chantry Flat. The relation's 31 ways measure 95.4 km (59.3 mi), more than any published figure; without the three it is 81.7 km (50.8 mi). The Pacific Crest Trail ways include the stretch between Eagles Roost and the Burkhart Trail that the Forest Service has closed, not the bypass. The track follows the Pacific Crest Trail below Mount Baden-Powell: its highest point is 2,819 m (9,249 ft), under the 9,399 ft the National Recreation Trails page gives for the summit, so the track does not go over the summit."
source_checked = "2026-11-18"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

