[hike]
summary = "The Siskiyou Peaks Trail is a 448-mile route from Ashland, Oregon, to Mt Shasta, California, that reaches the highest point in each of seven wilderness areas. It follows a mix of backcountry roads and trails, passes more than 40 glacial cirque lakes, and its last summit is Mt Shasta, which has no trail to its top. Aria Zoner worked it out and first walked it in 2013."
