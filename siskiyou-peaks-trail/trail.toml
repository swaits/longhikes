[[history]]
date = "2026-11-19"
change = "The record was added: the Siskiyou Peaks Trail, 448 miles (721 km) from Ashland, Oregon, to Mt Shasta, California, with no track."
fields = ["record"]
basis = "The author's route page gives the length as 448 miles and Mt Shasta as the final summit, and the guidebook's listing credits the route to Aria Zoner. The guide's description of the equipment needed is worded two ways by booksellers, and the author's own pages do not state it; the record says so in its caution. The end is placed at the town of Mt Shasta, as the guidebook's title writes it; the pages read do not say whether the route finishes at the summit or in the town."
basis_url = "https://outsideways.com/routes/us/siskiyou-peaks-trail/"
asked_by = "the dataset's own check"
outcome = "applied"

