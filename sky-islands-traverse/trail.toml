fields = ["place"]
basis = "The page says: \"Farther along the SKIT reaches Fort Bowie National Historic Site , where it follows the historic Butterfield Stage Route for a time.\" (Fort Bowie National Historic Site) The page says: \"The east district of Saguaro National Park (which includes the Saguaro Wilderness)\" (Saguaro National Park, Saguaro Wilderness) The page says: \"passes the famed rock formations of Chiricahua National Monument and on into this range's high country wilderness\" (Chiricahua Wilderness) The page says: \"The Dos Cabezas Mountains Wilderness might be considered the heart of this untamed country.\" (Dos Cabezas Mountains Wilderness)"
