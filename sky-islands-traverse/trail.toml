[hike]
summary = "The Sky Islands Traverse makes a circuitous journey across ten forest-clad mountain ranges of southeast Arizona, separated by grassland and desert valleys. It runs from the Dragoon Mountains through ranges including the Huachucas, Santa Catalinas and Pinalenos to Silver Peak above Portal. It uses the Arizona and Grand Enchantment Trails in part, other trails and roads, and occasional cross-country stretches."
