[hike]
summary = "South District Highlights is a backcountry loop in the south of Shenandoah National Park, Virginia, that the Park Service describes as having great views, waterfalls, swimming holes and wilderness areas. It starts and ends at the Big Run Overlook and Doyles River parking on Skyline Drive and is given as a 7, 8 or 9 day trip with 6 to 8 nights camped, and 59.1 to 69.2 miles depending on the campsites chosen. The Park Service rates it for advanced backcountry campers."
official_url = "https://www.nps.gov/shen/planyourvisit/backcountry-trips.htm"
start = "Big Run Overlook and Doyles River parking, Skyline Drive mile 81, Shenandoah National Park, Virginia"
start_lonlat = [-78.683, 38.254]
shape = "loop"
days = [7, 9]
season = "April to October"
months = [4, 5, 6, 7, 8, 9, 10]
season_basis = "estimate"
season_method = "Shenandoah's trails are low (under about 4,000 feet) and snow-free from spring to fall; winter ice and cold, and the heat and storms of midsummer, make April to October the usual window. Confidence: low."
terrain = ["forest"]
travel = "trail"
caution = "The Park Service says this trip is for advanced backcountry campers skilled in navigation and finding pristine campsites, and that the multiple stream crossings on Big Run Portal and North Fork Moormans River can be knee to waist high when the water is up, so hikers should beware in spring and after heavy rain. The guide's first two days use the North Fork Moormans River Road, which is gravel and leaves and re-enters the park, and the South Fork Moormans River Road, and its second camp is found by following a stream off trail."
checked = "2026-11-23"

