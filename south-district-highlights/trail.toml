length_km = 111
length_note = "59.1 to 69.2 mi, as the National Park Service gives it in its backcountry trip guides for South District Highlights (\"Total Length: 59.1 to 69.2 miles\"; the 7, 8 and 9 day versions and the 8 day version with a short first day all give the same range): the length depends on where the hiker camps each night and on the options taken. The upper figure, 69.2 mi (111 km), is used; the lower figure is also over the 50 mile floor. The guides say it is a loop that starts and ends at the same place, the Big Run Overlook and Doyles River parking at Skyline Drive mile 81."
