end_lonlat = [-118.627, 37.227]
shape = "point-to-point"
days = [8, 8]
season = "July to mid-October, the book's mid to late season"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "A permit is required for overnight stays, with quotas, as the book states; it names the Bishop Pass and South Lake permit and says a campfire permit is also needed for a stove or fire on national forest land."
caution = "The book rates the pace moderate. Its third day is long and strenuous, with 2,750 feet of climbing over Muir Pass and few campsites near the top. The book says campfires are prohibited above 10,000 feet and that bear canisters are strongly recommended. The route is on trail; the book flags no cross-country, rope or climbing, and Bishop, Muir and Piute passes are all crossed on trail."
