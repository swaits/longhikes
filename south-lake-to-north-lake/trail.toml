length_note = "55.0 mi, as the book gives it for Trip 67, with 8 hiking days and 1 layover day, a one-way shuttle; the book gives no elevation gain figure for the trip, only 2,750 ft for its third day. Mike White's chapter on the same walk in Backpacking California (3rd edition, 2020, Trip 47) gives 55.1 mi, with 9,240 ft of gain and 9,790 ft of loss, 5 to 7 recommended days and a strenuous rating. The 2.0 miles of North Lake Road between the trailheads are not counted. The figures are the books' own and are not measured from a track."
