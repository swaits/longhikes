note = "Trip 67 in the book (9th edition, 2021). A shuttle from the Bishop Pass trailhead at South Lake over Bishop Pass, through Dusy Basin and Le Conte Canyon, over Muir Pass and down Evolution Basin and Goddard Canyon to Piute Creek, then over Piute Pass to the North Lake trailhead, with 55.0 miles in the book. About 26 miles follow the John Muir Trail, from Le Conte Canyon over Muir Pass to Piute Creek, by the dataset's own check against its John Muir Trail record. The book's maps are the track; none is copied here."

