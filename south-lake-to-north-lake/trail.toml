summary = "South Lake to North Lake is an 8 day backpacking trip from South Lake to North Lake near Bishop, California, through the John Muir Wilderness and Kings Canyon National Park. It crosses Bishop Pass, Muir Pass and Piute Pass by way of Dusy Basin, Le Conte Canyon and Evolution Basin, and about 26 miles follow the John Muir Trail. Elizabeth Wenk and Mike White describe it as Trip 67 in the 9th edition of Sierra South."
official_url = "https://shop.adventurewithkeen.com/product/sierra-south-2/"
