[route]
creator = "Alan Dixon and Don Wilson"
year = 2014
line_policy = "open"
creator_words = "Like Roper with the SHR, we do not claim to be the first or even hundredth people to hike any portion of this route. We stand on the shoulders of many generations of rugged and adventurous travelers in the Range of Light. We simply chained together existing high passes, summits, and trails pioneered by others to create a much longer route."
creator_words_url = "http://www.adventurealan.com/southern-sierra-high-route-soshr-guide/"
note = "From the Palisades south past Mount Whitney and the Whitney Crest to Cottonwood Lakes, a southern extension of Roper's Sierra High Route; only 20 miles are on the John Muir Trail."

