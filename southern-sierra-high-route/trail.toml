change = "The trail was placed in Sequoia and Kings Canyon National Parks, Palisades, John Muir Wilderness and Sequoia-Kings Canyon Wilderness from published pages, as it has no track to measure."
fields = ["place"]
basis = "The page says: \"SoSHR vs. JMT — Basic stats from LeConte Canyon to Whitney Portal ... portions of the route that are most susceptible to holding late snow include Mather Pass, Grasshopper Pass, some parts of the Wallace Creek Valley\" (Sequoia and Kings Canyon National Parks) The page says: \"It starts high in the Palisades, the most rugged sub-range in the Sierra\" (Palisades) The page says: \"The route enters at Bishop Pass, joins the SHR in Dusy Basin, and then winds through lovely and complex Palisade Basin.\" (John Muir Wilderness) The page says: \"SoSHR vs. JMT — Basic stats from LeConte Canyon to Whitney Portal\" (Sequoia-Kings Canyon Wilderness)"
basis_url = "https://www.adventurealan.com/southern-sierra-high-route-soshr-guide/"
asked_by = "the dataset's own check"
