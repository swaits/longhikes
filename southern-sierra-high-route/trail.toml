[hike]
summary = "The Southern Sierra High Route traverses the highest part of California's Sierra Nevada from the South Lake trailhead near Bishop to Cottonwood Lakes. It extends the Sierra High Route south past Mount Whitney, crossing the Sierra crest eight times over many high passes. Most of it is off-trail or on unmaintained trails."
official_url = "https://www.adventurealan.com/southern-sierra-high-route-soshr-guide/"
start = "South Lake trailhead near Bishop, California"
start_lonlat = [-118.57, 37.165]
end = "Cottonwood Lakes trailhead, California"
end_lonlat = [-118.216, 36.497]
shape = "point-to-point"
high_point = "Mount Whitney"
high_point_m = 4421
terrain = ["alpine", "lakes"]
travel = "mostly-cross-country"
permit = "A wilderness permit from the Inyo National Forest for the South Lake entry is required, with the option to travel through the Mount Whitney Zone selected."
days = [5, 6]
checked = "2026-11-13"

