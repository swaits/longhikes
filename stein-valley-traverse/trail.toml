[hike]
summary = "The Stein Valley Traverse crosses Stein Valley Nlaka'pamux Heritage Park in British Columbia from its east boundary to its west boundary, following the Stein River and its lakes. BC Parks calls it the main east to west traverse and gives it as 80 km from park boundary to park boundary. At the west end the walk leaves the park by the Lizzie Creek Trail, which is beyond the 80 km."
official_url = "https://bcparks.ca/stein-valley-nlakapamux-heritage-park/"
start = "Main trailhead on the west side of the Fraser River by Lytton, British Columbia"
end = "Western park boundary west of Tundra Lake, British Columbia"
shape = "point-to-point"
terrain = ["forest", "alpine", "lakes"]
travel = "some-cross-country"
permit = "BC Parks' park brochure says there is no hiker registration in the Stein Valley."
caution = "BC Parks says solid route finding skills are a necessity, because sections of trail may be wet, steep or difficult to see, and the upper valley above treeline is a route marked in places with cairns."
checked = "2026-11-20"
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The traverse tops out around 7,000 feet, where snow lingers into July, and heavy rain starts in October. Confidence: medium."

