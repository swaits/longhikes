[source]
status = "osm-only"
publisher = "Sunshine Coast Trail Society (publishes the trail; no open geometry found)"
url = "https://www.openstreetmap.org/relation/7406716"
discovery = "osm-relation-version: Overpass `rel(ID); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap relation, read through Overpass or a Geofabrik extract"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-09). The track included here is from OpenStreetMap, relation 7406716."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM 7406716. The relation has no member roles and no side routes are marked. The main track is one walk of its ways, from Saltery Bay to Sarah Point, and the 29 ways (28.9 km) of the other branches at eight splits are in alternates.geojson. Where the relation gives two ways between the same two points, two were taken from the holder's pages and the rest by default. At Inland Lake the walk keeps the lake trail, because the Sunshine Coast Trail Society's hut pages put the trail's km 4 and km 9 markers on it. At the Saltery Bay end it keeps the shoreline by Fairview Bay, because the Society's multi-day routes page makes the return by the Saltery Bay Trail the second half of a loop. In the other six places no source read says which way is the trail, so the shorter way was kept, or the way that follows the trail rather than Spring Lake Road. The provincial recreation trail layer (FTEN_REC_TRAILS_SVW) is licensed 'Access Only', not open."
source_checked = "2026-11-16"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 7406716
note = "Re-cut 2026-11-16 from the relation as downloaded 2026-11-08: the main track is 182 ways and 29 ways are in alternates."

[shield]
