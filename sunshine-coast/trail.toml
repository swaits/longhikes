contact = "Sunshine Coast Trail Society"
note = "The trail's badge: a framed panel reading SUNSHINE COAST TRAIL over mountains, forest and water. It is the site icon of sunshinecoasttrail.com at 512 px and the same art as the site-logo.gif in the page header. The earlier file was a smaller copy. Trimmed of its empty border only. No terms for use of the logo are stated on the page."
logo_file = "shield.png"
logo_owner = "Sunshine Coast Trail Society"

[verification]
