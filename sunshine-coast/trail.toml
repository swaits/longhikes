parts = 5
note = "One walk of 168.0 km in 5 parts, 6.7% short of 180 km. The earlier track, 197.3 km, held both ways at eight splits; the other ways, 28.9 km, are in alternates.geojson. The parts are two long ones of about 80 km and three short pieces that OpenStreetMap does not join."

[hike]
summary = "The Sunshine Coast Trail stretches from Sarah Point in Desolation Sound to Saltery Bay on British Columbia's upper Sunshine Coast. It traverses coastal shorelines, creeks and lakes, old growth forest and panoramic mountaintops near Powell River. The society that built it maintains 14 free huts along the way."
official_url = "https://sunshinecoasttrail.com/"
