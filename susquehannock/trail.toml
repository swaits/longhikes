# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "susquehannock"
name = "Susquehannock Trail System"
short_name = "STS"
short_name_url = "https://stc-hike.org/"
country = "US"
regions = ["PA"]
length_km = 135
length_note = "84 mi, from the Susquehannock Trail Club page"
tier = "regional"
designation = "Susquehannock Trail Club"
wave = 1

[source]
status = "osm-only"
publisher = "Susquehannock Trail Club (publishes the loop; no open geometry found)"
publisher_url = "https://stc-hike.org/"
url = "https://www.openstreetmap.org/relation/13079897"
discovery = "osm-relation-version: Overpass `rel(13079897); out meta;` (version and timestamp), or the Geofabrik replication diff; fetch again when it changes"
format = "OpenStreetMap route relation, read through Overpass with all member ways"
crs = "EPSG:4326"
licence = "ODbL-1.0"
licence_text = "OpenStreetMap contributors, ODbL 1.0 (share-alike). Credit: © OpenStreetMap contributors. The OpenStreetMap copyright page states: 'You are free to copy, distribute, transmit and adapt our data, as long as you credit OpenStreetMap and its contributors.' (https://www.openstreetmap.org/copyright, read 2026-11-10). The track included here is from OpenStreetMap, relation 13079897."
attribution = "OpenStreetMap contributors (ODbL)"
osm_only = true
mainline = "OSM relation 13079897: the whole loop."
source_checked = "2026-11-10"
redistributable = true
line_source = "OpenStreetMap"
line_file = "line.geojson"

[osm]
relation = 13079897
note = "Downloaded 2026-11-10; 65 ways in the main track. release.txt has the source and date."

[shield]
status = "logo-not-found"
logo_source = ""
contact = "Susquehannock Trail Club"
note = "An emblem exists but no usable artwork was found at an allowed source. The club's own site says the Susquehannock Trail System is marked with orange paint blazes and occasionally an STS emblem. At allowed sources that emblem appears only as photographs: an embroidered Susquehannock Circuit Hiker patch (green triangle with an orange STS maple leaf) photographed on the club's circuit-hiker-award page, and signs in photographs such as the Northern Gateway photograph used across stc-hike.org. A photograph of a patch is not usable artwork, so none is included. Also checked: stc-hike.org home, trail-map, circuit-hiker-award and newsletters pages and their page source (a default site-builder logo, photographs only), the club's STS Publication Map PDF and Fall 2023 newsletter PDF (map and text masthead, no emblem artwork), and Wikimedia Commons (none). Ask the club for its emblem artwork."
logo_file = ""
logo_owner = "Susquehannock Trail Club"

[verification]
verified = true
date = "2026-11-10"
measured_km = 130.5
difference_percent = -3.3
parts = 2
note = "OSM relation 13079897, 65 ways: 130.5 km in 2 parts, 3.3% short of the published 135 km."

[hike]
summary = "The Susquehannock Trail System is a blazed loop through Potter and Clinton counties in north-central Pennsylvania. Much of it follows old Civilian Conservation Corps fire trails, with a secluded stretch through the Hammersley Wild Area. Two crossover trails make shorter loops."
official_url = "https://stc-hike.org/"
shape = "loop"
terrain = ["forest"]
travel = "trail"
permit = "No permit is needed to hike the Susquehannock Trail System."
days = [7, 7]
checked = "2026-11-19"

[[hike.source]]
url = "https://stc-hike.org/"
publisher = "Susquehannock Trail Club"
facts = ["summary", "official_url", "shape", "terrain", "travel"]

[[hike.source]]
url = "https://stc-hike.org/f-a-q"
publisher = "Susquehannock Trail Club"
facts = ["permit"]

[[hike.source]]
