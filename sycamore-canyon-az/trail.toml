name = "Sycamore Canyon"
country = "US"
regions = ["AZ"]
length_km = 90
length_note = "55.7 mi, as the book gives it for Trip 8 (page 99), with 6,120 ft of elevation gain, 6 days and no shuttle. The book's days assume about 8 miles a day. The figure is the book's own and is not measured from a track. The book prices shorter loops by optional trails at 22.6 miles (by the Sycamore Basin Trail), 41.8 miles (by the Taylor Cabin Trail) and 48.7 miles (by the Winter Cabin Trail); this record is the full loop. The last 0.2 mile, from the Packard Mesa junction to the trailhead, is walked both ways."
kind = "route"
tier = "regional"
designation = "Guidebook route (Bruce Grubbs, 2003, in Backpacking Arizona); no agency or association"
