[hike]
summary = "Sycamore Canyon is a six day backpacking loop in the Mogollon Rim country of northern Arizona, from the Sycamore Trailhead in the Coconino and Prescott National Forests. It goes up Sycamore Canyon past Parsons Spring to Geronimo Spring, then climbs onto the rim. It goes out by the Taylor Cabin Trail and returns by the Winter Cabin Trail, the Casner Mountain road and trail, and the Dogie, Sycamore Basin and Packard Mesa trails. Bruce Grubbs describes it as Trip 8 in Backpacking Arizona, and is not to be confused with other canyons of the same name."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-arizona/"
start = "Sycamore Trailhead, Coconino and Prescott National Forests, Arizona"
shape = "loop"
days = [6, 6]
season = "March to November"
months = [3, 4, 5, 6, 7, 8, 9, 10, 11]
terrain = ["canyon", "forest", "desert"]
travel = "some-cross-country"
permit = "The book lists only a Red Rock Pass, which is required for vehicle parking, and no camping permit."
caution = "The book says the canyon drains a large area of the western Mogollon Rim and often floods during the spring snowmelt, so the trip may be impossible from March through mid April. After the melt the creek dries up quickly, and there may be no water at all from Parsons Spring to Geronimo Spring, which the book says is 20 miles of mostly cross-country hiking. The author rates its difficulty 7 out of 10. Sycamore Canyon is closed to camping from Parsons Spring to the Verde River."
