note = "Trip 8 in the book, on pages 98-99. A loop from the Sycamore Trailhead up Sycamore Canyon to Geronimo Spring, then over the Mogollon Rim, going out by the Taylor Cabin Trail and coming back by the Winter Cabin Trail, the Casner Mountain road and trail, and the Dogie, Sycamore Basin and Packard Mesa trails. The book's maps are the track; none is copied here."

