terrain = ["alpine", "forest", "lakes"]
travel = "trail"
permit = "Only the Desolation Wilderness section needs a permit: a free day-use permit from the trailhead, or an overnight permit from recreation.gov."
checked = "2026-11-13"
season = "Late June to mid-September"
months = [7, 8, 9]
season_basis = "source"

