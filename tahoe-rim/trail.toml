[hike]
summary = "The Tahoe Rim Trail is a loop of about 165 miles around the ridgelines of the Lake Tahoe Basin. Most thru-hikers go clockwise. Its highest point, Relay Peak, is just over 10,300 feet."
official_url = "https://tahoerimtrail.org/"
shape = "loop"
high_point = "Relay Peak"
