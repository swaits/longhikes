redistributable = true
line_source = "none (no line included)"
line_file = ""
line_absent_reason = "The route's track is in a guidebook for sale, and no GPX from its author was found. Get the track from the book The Tahoe–Yosemite Trail."

[osm]
relation = 0
note = "Not recorded: the route's creator does not publish a track."

[shield]
status = "no-logo-exists"
logo_source = "https://shop.adventurewithkeen.com/wilderness-press/"
contact = "Thomas Winnett"
note = "No emblem of its own was found. Looked at the guidebook publisher's page https://shop.adventurewithkeen.com/wilderness-press/ . It shows the publisher's and shop's own logos and book covers only. This is a guidebook route across national park and national forest trails that keep their own marking, and no Tahoe-Yosemite Trail crest or badge artwork was found at the publisher."
logo_file = ""
logo_owner = "Thomas Winnett"

[verification]
verified = false
note = "No line to measure."

[route]
creator = "Thomas Winnett"
year = 1970
line_policy = "sold"
note = "From Meeks Bay on Lake Tahoe to Tuolumne Meadows, mixing maintained trail, road walks, unmaintained trail and cross-country. Winnett's book first appeared in 1970 and ran to five editions, the last in 1987; the route stayed unofficial."

[[guide]]
title = "The Tahoe–Yosemite Trail"
author = "Thomas Winnett"
access = "purchase"
url = "https://openlibrary.org/books/OL2377803M"
format = "book"
publisher = "Wilderness Press"
isbn = "0-89997-084-2"
edition = "5th edition, 1987"
link_is = "library"

[hike]
summary = "The Tahoe-Yosemite Trail is Thomas Winnett's route through California's Sierra Nevada from Meeks Bay at Lake Tahoe to Tuolumne Meadows in Yosemite National Park. It links maintained trails with road walks, unmaintained trail and cross-country travel. The route stayed unofficial."
start = "Meeks Bay, Lake Tahoe, California"
start_lonlat = [-120.124, 39.034]
end = "Tuolumne Meadows, Yosemite National Park, California"
end_lonlat = [-119.377, 37.878]
shape = "point-to-point"
terrain = ["alpine", "forest", "lakes"]
travel = "some-cross-country"
caution = "The route is unofficial; the Forest Service describes even its northernmost part at Meeks Bay as the unofficial Tahoe-Yosemite Trail."
checked = "2026-11-20"
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. High Sierra passes up to about 10,000 feet hold snow until early July, and fall storms arrive in October. Confidence: high."

[[hike.source]]
