url = "https://shop.adventurewithkeen.com/wilderness-press/"
format = "No line included"
crs = "EPSG:4326"
licence = "none-stated"
licence_text = "No track is included, so no source licence applies to a track. This record names the creator and the page its facts were read on (https://shop.adventurewithkeen.com/wilderness-press/, read 2026-11-10)."
attribution = "none (no line included)"
osm_only = false
mainline = "No track is included; the track is the book's maps."
