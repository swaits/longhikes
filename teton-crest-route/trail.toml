[[hike.source]]
url = "https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_InfraRecreationSites_01/MapServer/0"
publisher = "USDA Forest Service, Recreation Sites layer (public domain): Hominy Peak Trailhead"
