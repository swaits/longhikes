fields = ["source.line_file", "source.line_source", "source.line_absent_reason", "source.status", "source.publisher", "source.publisher_url", "source.url", "source.licence", "source.licence_text", "source.attribution", "source.osm_only", "length_km", "length_note"]
basis = "The Park Service's routes page gives the trail as a 39-mile route from Phillips Pass to String Lake, and says it meets Forest Service land at Fox Creek Pass and Alaska Basin. The Forest Service layer labels the Phillips Pass stretch 6008A TETON CREST SOUTH and the Park Service layer labels two stretches Teton Crest Trail; the rest of the route is on trails with local names in the Park Service layer, joined along the published route. The record's earlier 64 km cited no source."
basis_url = "https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm"
asked_by = "the dataset's owner"
