# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "teton-crest"
name = "Teton Crest Trail"
short_name = "TCT"
short_name_url = "https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm"
country = "US"
regions = ["WY"]
length_km = 63
length_note = "39 mi (62.8 km), as the Park Service's routes page gives it: 'a 39-mile point to point route starting outside the park at Phillips Pass and ending at String Lake'. The record gave 64 km (about 40 mi) until 2026-11-19, a figure that cited no source. The track measures 58.7 km (36.5 mi) from the agencies' trail data, which is 6.9% under the Park Service's figure."
tier = "short"
designation = "Grand Teton National Park and Caribou-Targhee National Forest"
wave = 1
short_reason = "It is very popular: the Park Service says its camping zones fill almost every night from late July through early September."
places_checked = "2026-11-20"
places_track = "f2b9dd9d330e5cda"

[source]
status = "verified"
publisher = "National Park Service (public Trails dataset, Grand Teton National Park) and USDA Forest Service (National Forest System Trails, Caribou-Targhee and Bridger-Teton National Forests)"
publisher_url = "https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm"
url = "https://mapservices.nps.gov/arcgis/rest/services/NationalDatasets/NPS_Public_Trails_Geographic/FeatureServer/0"
discovery = "arcgis-query-hash: GET <url>/query with where UNITCODE = 'GRTE' (outSR=4326, f=geojson) for the Park Service layer, and GET https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_TrailNFSPublish_01/MapServer/0/query with the envelope -111.1,43.5,-110.7,43.95 (inSR=4326, outSR=4326, f=geojson) for the Forest Service layer; hash each answer body and count its rows; fetch again when either changes. 345 Park Service features and 113 Forest Service features on 2026-11-19."
format = "ArcGIS FeatureServer layer 0 (Park Service) and ArcGIS MapServer layer 0 (Forest Service), outSR=4326, f=geojson, 23 features used"
crs = "EPSG:4326"
licence = "us-gov-public-domain"
licence_text = "United States federal government work, public domain in the United States under 17 U.S.C. 105. The National Park Service states: 'Data and content created by government employees within the scope of their employment are not subject to domestic copyright protection under 17 U.S.C. 105.' (https://irma.nps.gov/DataStore/Reference/Profile/2311077, read 2026-11-18). The USDA Forest Service metadata for its trails dataset (https://data.fs.usda.gov/geodata/edw/edw_resources/meta/Trans_Trail_NFS_Publish.xml, read 2026-11-16) gives access constraints 'None' and, as use constraints, only a disclaimer of warranty and liability. Both layers are datasets made by federal employees, federal government works."
attribution = "National Park Service; USDA Forest Service"
osm_only = false
mainline = "One track of 23 features, from Phillips Pass to String Lake. The two features the Forest Service labels 6008A TETON CREST SOUTH (Phillips Pass to the park boundary, 6.0 km and 0.1 km) and the two the Park Service labels Teton Crest Trail (1.1 km north of the boundary, and 4.0 km at Alaska Basin) are the stretches the agencies themselves call the Teton Crest Trail. The rest is carried on trails with local names in the Park Service layer, joined along the trail's published route: Middle Fork Granite Canyon Trail, Fox Creek Pass Trail, Death Canyon Shelf Trail, Hurricane Pass Trail, South Fork Cascade Canyon Trail, North Fork Cascade Canyon Trail, Paintbrush Canyon Trail, String Lake Loop Trail and String Lake Trail. Where both agencies map the same stretch (Fox Creek Pass and Alaska Basin, 11.1 km of Forest Service 6008A TETON CREST SOUTH), the Park Service line is used and the Forest Service copy is left out. A 0.3 km Park Service Teton Crest Trail piece beside the boundary, which doubles the Forest Service line there, is left out. Forest Service TETON CREST NORTH and TETON CREST (6008B, 2008), which run north of Moran, are not part of this trail."
source_checked = "2026-11-19"
redistributable = true
line_source = "National Park Service and USDA Forest Service trail data"
line_file = "line.geojson"

[osm]
relation = 3895101
note = "Relation 3895101, measured from the OpenStreetMap API on 2026-11-19, holds 57.5 km in 49 ways, in one continuous piece, at version 21, last edited on 2024-09-21. It is a complete alternative to the track and is not used: the track is built from the National Park Service and Forest Service trail layers."

[shield]
status = "no-logo-exists"
logo_source = ""
contact = "NPS Grand Teton"
note = "No trail emblem found. The Park's backcountry page (https://www.nps.gov/grte/planyourvisit/back.htm) shows only the NPS arrowhead, which is the agency's. Checked 2026-11-16."
logo_file = ""
logo_owner = "NPS Grand Teton"

[verification]
verified = true
date = "2026-11-19"
measured_km = 58.7
difference_percent = -6.9
parts = 1
note = "23 agency features joined end to end in 1 part: 58.7 km (36.5 mi), 6.9% under the Park Service's 39 mi (63 km). Joins are 0 to 11 m. The track lies along the trail where the two agencies' lines differ by tens of metres, so it is a little short of the Park Service's rounded figure."

[hike]
summary = "The Teton Crest Trail is a point to point route along the crest of the Teton Range in Wyoming, starting outside Grand Teton National Park at Phillips Pass and ending at String Lake. The park service says it climbs over 9,000 feet and is best enjoyed over multiple days. Camping zones along it fill almost every night from late July through early September."
official_url = "https://www.nps.gov/grte/planyourvisit/backcountryroutesandzones.htm"
start = "Phillips Pass, Wyoming"
start_lonlat = [-110.932, 43.548]
end = "String Lake, Grand Teton National Park, Wyoming"
end_lonlat = [-110.733, 43.786]
shape = "point-to-point"
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "Permits are required for all overnight stays in the backcountry of Grand Teton National Park, obtained through recreation.gov or a permit office."
days = [2, 4]
season = "Summer to early fall"
months = [7, 8, 9]
checked = "2026-11-13"
season_basis = "source"

