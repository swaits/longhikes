[hike]
summary = "The Teton Wilderness Loop is a backpacking loop of five to seven days in the Teton Wilderness of Bridger-Teton National Forest, Wyoming, from the Turpin Meadows Trailhead. It crosses the Soda Fork and North Fork meadows and Two Ocean Pass on the Continental Divide, fords the Yellowstone River, and returns past Ferry Lake and Crater Lake. Douglas Lorain describes it as Trip 11 in Backpacking Wyoming."
official_url = "https://shop.adventurewithkeen.com/product/backpacking-wyoming/"
start = "Turpin Meadows Trailhead, Bridger-Teton National Forest, Wyoming"
start_lonlat = [-110.266, 43.861]
shape = "loop"
days = [5, 7]
season = "Usually open mid-July to October, best late July to September"
months = [7, 8, 9, 10]
terrain = ["forest", "lakes"]
travel = "trail"
permit = "None required, as the book states."
caution = "The book warns that the fords of the Yellowstone River and the North Buffalo Fork can be very difficult or impossible early in the summer and extremely difficult and dangerous until at least the middle of July. Even then the Yellowstone River may be almost waist deep, very swift and extremely cold, and the book says most hikers should not try it before late July, and that wading shoes with good traction and a sturdy walking stick are necessary. Grizzly bears are very common, there are miles of horse-pounded trails, and mosquitoes are thick in July. All food and odorous items must be stored away from bears, and livestock grazing is prohibited within 0.5 mile of Crater and Ferry lakes. The author rates its difficulty 7 out of 10."
