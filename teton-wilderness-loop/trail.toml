length_km = 97
length_note = "60.2 mi, as the book gives it for Trip 11 (page 95), with 6,000 ft of elevation gain and 5 to 7 days. The book's days assume about 10 miles a day. The page also prints 63.8 mi and 7,900 ft in brackets: the trip with the recommended side trips added. The stated mileage walks a stem of 5.3 miles twice; with nothing counted twice the loop is 54.9 miles. The figures are the book's own and are not measured from a track."
