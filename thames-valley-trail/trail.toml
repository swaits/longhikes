# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "thames-valley-trail"
name = "Thames Valley Trail"
country = "CA"
regions = ["ON"]
length_km = 110
length_note = "110 km main trail, from the Thames Valley Trail Association's Trail Routes & Maps page; the page also describes 26 km of loop trails"
tier = "regional"
designation = "Thames Valley Trail Association"
wave = 1

[source]
status = "none"
publisher = "Thames Valley Trail Association (publishes the trail)"
publisher_url = "https://tvta.ca/"
url = "https://tvta.ca/hiking-information/trail-routes-and-maps/"
format = "No line included"
crs = "EPSG:4326"
licence = "none-stated"
licence_text = "No track is included, so no source licence applies to a track. This record names the publisher and the page its facts were read on (https://tvta.ca/hiking-information/trail-routes-and-maps/, read 2026-11-14)."
attribution = "none (no line included)"
osm_only = false
mainline = "OpenStreetMap relation 3444520 'Thames Valley Trail' exists (version 135); its track was not downloaded because the Overpass servers could not be reached."
source_checked = "2026-11-14"
redistributable = true
line_source = "none (no line included)"
line_file = ""
line_absent_reason = "No track is included yet. The association sells maps and states no licence for a track. OpenStreetMap relation 3444520 is the trail, and a dry-run measure on 2026-11-14 gave 134.2 km in 12 parts against 110 km published (22.0% over, probably because the 26 km of loop trails are in it), but the download failed because Overpass could not be reached. Run python3 tools/osm_track.py 3444520 --id thames-valley-trail to add it."

[osm]
relation = 3444520
note = "Relation 3444520 'Thames Valley Trail' (version 135, 2026-10-25) was found and measured in a dry run on 2026-11-14: 446 ways, 134.2 km, 12 parts. The track was not written."

