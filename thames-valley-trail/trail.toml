[hike]
summary = "The Thames Valley Trail follows the Thames and North Thames rivers through southwestern Ontario, from the Elgin County line south of Delaware through London to St. Marys. It crosses farmland, parks and conservation areas, and most of it is on private land with the owners' permission. Loop trails join the main trail."
