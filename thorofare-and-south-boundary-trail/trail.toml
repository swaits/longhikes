note = "The NPS public Trails dataset, 58 pieces joined end to end in two parts: 110.4 km (68.6 mi), 1.3% over the 68 mi (109 km) Frommer's gives. There is one gap of 0.5 km (0.3 mi) where the dataset has no feature, between the end of the Thorofare-South Boundary Cutoff Trail and the start of the South Boundary Trail's Lynx Creek section, near the Thorofare Ranger Station."

[hike]
summary = "The Thorofare and South Boundary Trail is a point-to-point walk in Yellowstone National Park, Wyoming, from the Nine Mile Trailhead on the east side of Yellowstone Lake south on the Thorofare Trail, then west on the South Boundary Trail along the Snake River to the South Entrance. The Park Service describes the Thorofare Trail as heading into some of the most remote parts of the park. Frommer's gives the whole hike as 68 miles."
official_url = "https://www.nps.gov/places/000/nine-mile-trailhead-5k5.htm"
start = "Nine Mile Trailhead, Yellowstone National Park, Wyoming"
start_lonlat = [-110.276, 44.506]
end = "South Entrance, Yellowstone National Park, Wyoming"
end_lonlat = [-110.666, 44.136]
shape = "point-to-point"
travel = "trail"
permit = "A backcountry permit is required for all overnight stays in Yellowstone's backcountry, and campsites can be reserved on Recreation.gov."
season = "Mid-July to early September"
months = [7, 8, 9]
caution = "The Park Service says the Thorofare Trail goes through or near three bear management areas and that a hiker should be prepared to ford creeks, and that the Snake River ford near the South Entrance can be dangerous and, even in low water, waist-deep. Grizzly and black bears live throughout the park, and food must be kept in a bear-resistant container or hung."
checked = "2026-11-18"

