# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "thorofare-and-south-boundary-trail"
name = "Thorofare and South Boundary Trail"
country = "US"
regions = ["WY"]
length_km = 109
length_note = "68 mi, as Frommer's gives it for the point-to-point hike on the Thorofare Trail and the South Boundary Trail. Other outlets give 69 to 70 mi, which is within what a start at the trailhead, the exact path walked and rounding account for. The National Park Service gives only the parts: 33.1 mi for the Thorofare Trail alone, from the Nine Mile Trailhead, and 11.6 mi for the South Boundary Trail's South Entrance to Harebell section."
tier = "regional"
designation = "Two National Park Service trails in Yellowstone National Park, the Thorofare Trail and the South Boundary Trail, walked end to end as one hike"
wave = 1

[source]
status = "verified"
publisher = "National Park Service (public Trails dataset)"
publisher_url = "https://www.nps.gov/yell/planyourvisit/backcountryhiking.htm"
url = "https://mapservices.nps.gov/arcgis/rest/services/NationalDatasets/NPS_Public_Trails_Geographic/FeatureServer/0"
discovery = "arcgis-query-hash: GET <url>/query with where UNITCODE = 'YELL' AND (TRLNAME LIKE '%Thorofare%' OR TRLNAME LIKE '%South Boundary%') (outSR=4326, f=geojson); hash the answer body and count its rows; fetch again when either changes. 78 features on 2026-11-18."
format = "ArcGIS FeatureServer layer 0, outSR=4326, f=geojson, 78 features for the query"
crs = "EPSG:4326"
licence = "us-gov-public-domain"
licence_text = "United States federal government work, public domain in the United States under 17 U.S.C. 105. The National Park Service states: 'Data and content created by government employees within the scope of their employment are not subject to domestic copyright protection under 17 U.S.C. 105.' (https://irma.nps.gov/DataStore/Reference/Profile/2311077, read 2026-11-18). The layer is the Service's public Trails dataset, a National Park Service service."
attribution = "National Park Service"
osm_only = false
mainline = "Features of Yellowstone National Park (UNITCODE YELL) named Thorofare Trail, Thorofare-South Boundary Cutoff Trail, and South Boundary Trail: Lynx Creek, Harebell-Fox Creek Trail and South Entrance-Harebell. The walk is the shortest chain of them from the Nine Mile Trailhead to the South Entrance: the Thorofare Trail to where the cutoff trail leaves it, the cutoff, then, after a gap, the South Boundary Trail. The Thorofare Trail's last 1.4 mi, beyond the cutoff, and two tiny duplicate pieces are left out. The layer's South Boundary Trail sections west of the South Entrance (Grassy Lake and Bechler) and the Thorofare Cabin Trail are not part of the walk."
source_checked = "2026-11-18"
redistributable = true
line_source = "National Park Service (public Trails dataset)"
line_file = "line.geojson"

