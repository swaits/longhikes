[hike]
summary = "The Timberline Trail circumnavigates Mount Hood in Oregon at or near tree line, entering the Mount Hood Wilderness. Built mainly by the Civilian Conservation Corps in the 1930s, it passes vistas, waterfalls, alpine meadows and west side Cascade forests. It climbs in and out of glacially fed drainages the whole way around."
official_url = "https://www.fs.usda.gov/r06/mthood/recreation/trails/timberline-trail-600"
start = "Timberline Lodge, Oregon"
start_lonlat = [-121.711, 45.331]
shape = "loop"
days = [3, 4]
season = "July to October"
months = [7, 8, 9, 10]
terrain = ["alpine", "forest"]
travel = "trail"
permit = "Free, self-issued wilderness permits are required from May 15 to October 15 when provided at a portal, and some trailheads require a day use fee."
caution = "The Forest Service says most hikers find the fast-moving river crossings the most challenging part of the trail, and several major crossings have no bridges."
checked = "2026-11-13"

[[hike.source]]
url = "https://www.fs.usda.gov/r06/mthood/recreation/trails/timberline-trail-600"
