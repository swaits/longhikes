terrain = ["desert", "canyon"]
travel = "trail"
permit = "Camping anywhere in the park outside the developed rim campgrounds needs a backcountry permit from the park, which takes reservations on Recreation.gov."
caution = "Most of the trail has no reliable water, and the National Park Service warns against walking it in summer heat."
checked = "2026-11-15"
season = "November to April (the Boucher to South Bass segment)"
months = [11, 12, 1, 2, 3, 4]
season_basis = "primary"

