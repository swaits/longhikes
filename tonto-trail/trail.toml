[hike]
summary = "The Tonto Trail follows the Tonto Platform, a bench about 3,900 feet below the South Rim of the Grand Canyon, from Red Canyon in the east to Garnet Canyon in the west. The National Park Service calls it 95 rough, unmaintained miles. The rim trails that cross it split it into sections, and most hikers walk it in installments."
official_url = "https://www.nps.gov/grca/planyourvisit/campsite-information.htm"
