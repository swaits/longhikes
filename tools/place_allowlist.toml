# The place allow-list for tools/place_trails.py.
#
# [[park]] entries name extra park units beyond the ones their source marks as national
# parks, and joined pages: one entry whose source_id is a list joins those units into one
# place (as Sequoia and Kings Canyon are joined). Fields: source_id (a string, or a list
# to join units), slug, name, where (optional, see below).
#
# [[range]] entries are the mountain ranges that get measured at all. The GMBA inventory
# nests ranges up to ten levels, so no single level holds the useful names. This list was
# reviewed by the owner's reviewer on 2026-11-20: the 25 ranges the first run's digest
# kept (hiker-searchable names, no "Area", "Region" or "Group" names, no hyphen compounds),
# plus the named ranges below whatever their tracked count, because trails with no track
# will be added to them by hand. Fields: gmba_id (GMBA_V2_ID), slug, name (the display name
# as a hiker writes it, without the inventory's qualifier such as "(USA)"), within (the
# great system, where it has one: at most two kept levels apply to any one trail, a named
# range and its system, so a range's within never names another named range), where
# (optional state or province codes that replace the tool's own reading, which comes from
# web/place-bounds.toml and overlaps along borders).
#
# The `where` lines are set by hand where the boxes overlap a neighbour along a border.
#
# Two ids with one name are one place (the source lists the Palisades twice).
#
# Named but not in the source: "Ozark Mountains". GMBA v2 has the Ozark Plateau (16920)
# only, which is a plateau and not what hikers call the Ozark Mountains, so it is left out.

[[range]]
gmba_id = "12105"
slug = "rocky-mountains"
name = "Rocky Mountains"
where = ["AB", "BC", "CO", "ID", "MT", "NM", "UT", "WY"]

