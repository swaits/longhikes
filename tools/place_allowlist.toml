name = "Palisades"
within = ["sierra-nevada"]
where = ["CA"]

# Sequoia and Kings Canyon are one national park to hikers and one page here.
[[park]]
source_id = ["SEQU", "KICA"]
slug = "sequoia-and-kings-canyon"
name = "Sequoia and Kings Canyon National Parks"

# The two parks called Glacier (Montana and British Columbia) need different slugs; the
# Montana one is the one hikers mean by /parks/glacier/.
[[park]]
source_id = "GLAC"
slug = "glacier"
name = "Glacier National Park"
