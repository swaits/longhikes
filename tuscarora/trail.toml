[hike]
summary = "The Tuscarora Trail is a long alternate to the Appalachian Trail through the Ridge and Valley Appalachians of Virginia, West Virginia, Maryland and Pennsylvania. It leaves the Appalachian Trail near Mathews Arm in Shenandoah National Park and rejoins it atop Blue Mountain south of Duncannon. The Potomac Appalachian Trail Club describes a mix of remote wilderness, pastures, small towns and country back roads."
official_url = "https://www.patc.net/tuscarora-trail"
start = "Appalachian Trail near Mathews Arm Campground, Shenandoah National Park, Virginia"
end = "Appalachian Trail atop Blue Mountain near Duncannon, Pennsylvania"
shape = "point-to-point"
terrain = ["forest", "farmland"]
travel = "trail-and-road"
checked = "2026-11-20"
season = "March to May and September to November"
months = [3, 4, 5, 9, 10, 11]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The Ridge and Valley Appalachians are hot, humid and buggy in summer and icy in winter, so spring and fall are the comfortable months. Confidence: medium."

[[hike.source]]
