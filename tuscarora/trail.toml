[hike]
summary = "The Tuscarora Trail is a long alternate to the Appalachian Trail through the Ridge and Valley Appalachians of Virginia, West Virginia, Maryland and Pennsylvania. It leaves the Appalachian Trail near Mathews Arm in Shenandoah National Park and rejoins it atop Blue Mountain south of Duncannon. The Potomac Appalachian Trail Club describes a mix of remote wilderness, pastures, small towns and country back roads."
