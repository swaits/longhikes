[hike]
summary = "The Utah Thirteeners traverse links all 21 of Utah's 13,000-foot peaks across the High Uintas Wilderness in a point-to-point route of about 60 miles from the West Fork Blacks Fork Trailhead to the Swift Creek Trailhead. Also called the Utah 13ers or Utah's Uinta Traverse, most of the way is off-trail travel above treeline across loose talus and boulders, climbing about 22,300 to 23,000 feet and crossing Kings Peak, the highest point in Utah. No rope or rock-climbing gear is required, though the traverse includes sustained Class 3 scrambling and a short Class 4 section on East Lovenia."
official_url = "https://fastestknowntime.com/route/utah-thirteeners-ut"
start = "West Fork Blacks Fork Trailhead, Utah"
start_lonlat = [-110.667, 40.868]
end = "Swift Creek Trailhead, Ashley National Forest, Utah"
end_lonlat = [-110.348, 40.601]
shape = "point-to-point"
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The high Uinta crest sits above 13,000 feet and holds snow into early summer, while mean daily highs at high ground drop to 31 F in October, leaving July to September. Confidence: medium."
high_point = "Kings Peak"
high_point_m = 4123
terrain = ["alpine"]
travel = "mostly-cross-country"
permit = "No permit is needed in the High Uintas Wilderness."
caution = "Nearly the whole route is off-trail travel over loose talus and boulders above treeline, with roughly 50 miles of boulder-hopping and about 22,300 to 23,000 feet of climbing. The hardest ground is Class 3 scrambling with a short Class 4 section on East Lovenia (called Quandary in David M. Rose's book). Every documented end-to-end completion has been a single unsupported push; no multi-day walk of the whole line has been published, and there is no marked or maintained way between the summits."
checked = "2026-11-25"

