[route]
creator = "Jason Dorais and Tom Goth"
year = 2015
line_policy = "open"
note = "Also called the Utah 13ers. First linked end to end by Jason Dorais and Tom Goth on September 9 and 10, 2015; Dorais credits the idea to Craig Lloyd. The route crosses all 21 summits in David M. Rose's book Utah Thirteeners (19 with at least 200 ft of prominence and 17 with at least 300 ft), climbing about 22,300 to 23,000 ft. From Mount Powell, the 2015 link-up dropped into the Henrys Fork basin before Gilbert Peak; the 2017 pair chose a long out-and-back from Gunsight to Gilbert instead, and said they would take the 2015 line if they did it again. Every documented end-to-end completion (2015, 2017, 2021, 2024) has been a single unsupported push, with no multi-day walk of the whole line published; this record lists no speed records."

