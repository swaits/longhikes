[hike]
summary = "The Utah Thirteeners, also called the Utah 13ers, link all 21 of Utah's 13,000-foot peaks in the High Uintas Wilderness. It is a point-to-point route of about 60 miles from the West Fork Blacks Fork Trailhead to Swift Creek Campground. Most of the way is off-trail travel above treeline across loose talus and boulders, with about 22,300 to 23,000 feet of climbing, and it crosses Kings Peak, the highest point in Utah. By David Ayala's account nothing is harder than Class 3 except Class 4 on the ascent and descent of East Lovenia."
official_url = "https://fastestknowntime.com/route/utah-thirteeners-ut"
start = "West Fork Blacks Fork Trailhead, Utah"
start_lonlat = [-110.667, 40.868]
end = "Swift Creek Campground, Ashley National Forest, Utah"
end_lonlat = [-110.348, 40.601]
shape = "point-to-point"
season = "July to September"
months = [7, 8, 9]
season_basis = "estimate"
season_method = "Judged from the climate at the trail's elevation and from similar trails. The high Uinta crest sits above 13,000 feet and holds snow into early summer, while mean daily highs at high ground drop to 31 F in October, leaving July to September. Confidence: medium."
high_point = "Kings Peak"
high_point_m = 4123
terrain = ["alpine"]
travel = "mostly-cross-country"
caution = "Most of the route is off-trail travel over loose talus and boulders above treeline, with about 50 of its roughly 62 miles being boulder-hopping on loose talus, by Jared Campbell's account, and about 22,300 to 23,000 feet of climbing. David Ayala writes that the most technical ground is the ascent and descent of East Lovenia (called Quandary Peak in David M. Rose's book), at Class 4, and that the rest does not exceed Class 3. Every documented end-to-end completion has been a single unsupported push, and no multi-day walk of the whole line has been published."
checked = "2026-11-25"

