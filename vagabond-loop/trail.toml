basis = "The page says: \"Hayduke Trail: (844m) *Zion NP-Hack Canyon (70m) ... *Hack Canyon-North Rim (87m) ... *Moab-Arches NP (25m)\" (Arches National Park, Grand Canyon National Park, Zion National Park) The page says: \"Hayduke Trail (822m): :: From Zion :: From Arizona Strip :: From Grand Canyon :: From Bryce :: From Grand Staircase :: From Capital Reef :: From Canyonlands\" (Bryce Canyon National Park, Canyonlands National Park, Capitol Reef National Park) The page says: \"Encompassed in the route are Arches, Canyonlands, Capitol Reef, Bryce Canyon, Grand Canyon and Zion National Parks as well as Grand Staircase-Escalante National Monument, Glen Canyon National Recreation Area\" (Glen Canyon National Recreation Area) The page says: \"Passage 9 of the Arizona Trail runs through the Rincon Valley and Saguaro Wilderness Area.\" (Saguaro National Park, Saguaro Wilderness) The page says: \"Hayduke Trail (822m): :: From Zion ... From Canyonlands\" (Colorado Plateau) The page says: \"Moab to ABQ (643m): :: From Weminuche :: From South San Juans\" (San Juan Mountains) The page says: \"Moab to ABQ (643m): ... :: From Sangre de Cristos :: From Pecos\" (Sangre de Cristo Mountains) The page says: \"Moab to ABQ (643m): :: From Moab :: From Weminuche :: From South San Juans :: From Taos Plateau\" (Weminuche Wilderness)"
basis_url = "https://www.freedirtmonger.com/p/vagabond-loop-four-corners-connection-1.html"
