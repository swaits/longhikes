[hike]
summary = "The Vallecito Reservoir Loop is a loop of about 65 miles through the Weminuche Wilderness in the San Juan Mountains of southern Colorado, as its author describes it. It starts on the east side of Vallecito Reservoir, climbs the Pine River drainage past Emerald Lake, links alpine lakes and the Continental Divide Trail deep in the wilderness, and comes back by Columbine Pass, Silver Mesa and Endlich Mesa. The author walked it in four days and says most hikers will want five to seven."
official_url = "https://www.cleverhiker.com/backpacking/backpacking-trip-guides/san-juan-mountains-vallecito-reservoir-loop/"
start = "Pine River Trailhead, east side of Vallecito Reservoir, Colorado"
start_lonlat = [-107.505, 37.447]
end = "Freeman Creek Trail at Highway 501, near the Vallecito Event Center, Colorado"
end_lonlat = [-107.557, 37.434]
shape = "point-to-point"
days = [4, 7]
season = "Mid-July to mid-September"
months = [7, 8, 9]
season_basis = "primary"
terrain = ["alpine"]
travel = "trail"
permit = "The author says no permit is required and there are no fees for parking or camping."
caution = "The author says the start and finish trailheads are apart, so a shuttle is required, and that the end is not a formal trailhead and permission to park should be confirmed. He says the descent from Miller Mountain on the Endlich Mesa Trail is faint, overgrown and full of blowdowns, that the stretch of Silver Mesa after Trimble Pass needs cairn-to-cairn navigation, and that there is no reliable water for about 15 miles across Endlich Mesa. He calls a GPS track absolutely essential there."
checked = "2026-11-23"

