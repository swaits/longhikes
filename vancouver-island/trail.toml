[hike]
summary = "The Vancouver Island Trail runs the length of Vancouver Island in British Columbia from Victoria in the south to Cape Scott on the northern tip. The association calls it a living trail that changes with weather, water levels and human activity, passing through the traditional territories of many Indigenous Peoples. A through hike should be planned at five weeks or more."
official_url = "https://vancouverislandtrail.ca/the-trail/about-the-vit/"
start = "Anderson Hill, Victoria, British Columbia"
end = "Cape Scott, British Columbia"
shape = "point-to-point"
terrain = ["coast", "forest"]
season = "Mid-June to October"
months = [6, 7, 8, 9, 10]
days = [30, 60]
checked = "2026-11-13"

