# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "vancouver-island"
name = "Vancouver Island Trail"
short_name = "VIT"
country = "CA"
regions = ["BC"]
length_km = 800
length_note = "nearly 800 km, from the Vancouver Island Trail Association page"
tier = "regional"
designation = "Vancouver Island Trail Association"
wave = 1

