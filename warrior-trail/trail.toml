[hike]
summary = "The Warrior Trail crosses the ridges of Greene County in southwestern Pennsylvania and runs on into the northern panhandle of West Virginia. It goes from Greensboro on the Monongahela River to Moundsville on the Ohio River. It is marked with yellow blazes and red mileposts, and nearly all of it is on private land."
