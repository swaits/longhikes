places_track = "d534dd0b7f82825d"

[source]
status = "verified"
publisher = "Lauren Lake, PacificCoastalTrail blog (publishes the route)"
publisher_url = "https://pacificcoastaltrail.wordpress.com/"
url = "https://pacificcoastaltrail.wordpress.com/2022/03/23/itinerary-washington-coast/"
discovery = "page-link: the itinerary page links the route's CalTopo map (https://caltopo.com/m/BHDR0). The track came as a GPX file the author attached to the dataset's issue 1 on 2026-11-17; read the page again, and ask the author for a new file, when the page changes."
format = "GPX 1.1 exported from CalTopo: 20 tracks of one segment each (12 daily tracks, 3 bus tracks, 3 alternates and 2 tracks not used), 110 waypoints, no routes"
crs = "EPSG:4326"
licence = "CC-BY-4.0"
licence_text = "Creative Commons Attribution 4.0 International (CC BY 4.0). The route's author wrote on this dataset's public issue tracker on 2026-11-17: \"CC BY 4.0 is fine for this as well.\" (https://github.com/swaits/longhikes/issues/1#issuecomment-6935950983). The author had agreed earlier in the same issue, for the California track, to be credited as the source with a link to the blog (https://github.com/swaits/longhikes/issues/1#issuecomment-6928214012). The itinerary page itself (read 2026-11-17) states no terms."
attribution = "Lauren Lake, PacificCoastalTrail blog (https://pacificcoastaltrail.wordpress.com), CC BY 4.0"
osm_only = false
mainline = "The main track is the file's 12 daily tracks, Day 1 to Day 12, in the order of the days from Cape Disappointment to Cape Flattery. The file lists them out of order, and Day 5 is stored from Taholah to Moclips and is reversed. Nothing is drawn between days, so the bay crossings and bus rides are gaps: 12.7 km from the Stackpole Road parking lot (where a waypoint reads \"Meet shuttle for ride to Tokeland\") to Tokeland, around Willapa Bay; 3.8 km from Westport across the mouth of Grays Harbor; 0.4 km inside Moclips, between the end of Day 4 and the bus stop where Day 5 starts; 19.2 km from Taholah to the restart point south of Queets, where the itinerary page has a bus; and 13.3 km from the Cedar Creek bus stop to the turnoff for Oil City, where the file has a bus track by way of Forks. The track is in 12 pieces and 6 parts. The file's three bus tracks, its tracks Quinault North and Quinault South (which the itinerary page does not describe as walked) and its waypoints are not used. The three alternates (the La Push alternate and two overland routes round tide points) are in alternates.geojson."
source_checked = "2026-11-17"
redistributable = true
line_source = "Lauren Lake (the author's GPX file)"
line_file = "line.geojson"

