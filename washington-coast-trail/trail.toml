name = "Washington Coast Trail"
country = "US"
regions = ["WA"]
length_km = 290
length_note = "About 180 mi (290 km), the author's figure, given on this dataset's issue tracker: \"The length is approximately 180 miles, though very dependent on how you hike/boat/bus the bay crossings.\""
kind = "route"
tier = "regional"
designation = "Person-defined route (Lauren Lake, 2022); no agency or association"
wave = 1
