[route]
creator = "Lauren Lake (PacificCoastalTrail blog)"
year = 2022
line_policy = "open"
creator_words = "CC BY 4.0 is fine for this as well."
creator_words_url = "https://github.com/swaits/longhikes/issues/1#issuecomment-6935950983"
note = "The author calls the Washington, Oregon and California coast routes together the Pacific Coastal Trail, and is working on a further 245 miles from Cape Flattery to Bellingham, which this record does not include. The route passes Cape Alava, the western end of the Pacific Northwest Trail, and the author's track file marks a junction with that trail on the Olympic coast."

[[guide]]
title = "Itinerary: Washington Coast"
author = "Lauren Lake (PacificCoastalTrail blog)"
access = "free"
url = "https://pacificcoastaltrail.wordpress.com/2022/03/23/itinerary-washington-coast/"
format = "web page with a 12-day table of stopping points, and a link to a CalTopo map; the GPX file is shared on the dataset's issue tracker"

[hike]
summary = "The Washington Coast Trail is a route along the Washington coast from Cape Disappointment to Cape Flattery, about 180 miles. Its author walked it northbound in 12 days and left the hardest part, the Wilderness Coast, for the end. The two big bays in the south are rounded by shuttle or bus, and the north has tide pinch points and scrambles over rocks and ladders."
official_url = "https://pacificcoastaltrail.wordpress.com/2022/03/23/itinerary-washington-coast/"
start = "Cape Disappointment, Washington"
end = "Cape Flattery, Washington"
shape = "point-to-point"
days = [12, 12]
terrain = ["coast"]
caution = "The route is not on foot all the way. Its author rounded the two major bays in the south with a shuttle driver and says it could be done by bus, and used a bus again at Taholah and Queets and to Forks. The author says the bays and the tribal lands that cannot be hiked all have bus options to bypass them. At a couple of tide pinch points the author stopped just short and crossed on an early morning tide, and some days are scrambles over rocks and ladders. At least a few nights of wilderness camping are needed."
season = "May to September, because of the tides and creeks on the Olympic Wilderness Coast"
months = [5, 6, 7, 8, 9]
permit = "A permit is required for the Olympic Wilderness Coast in those months, May to September."
start_lonlat = [-124.076, 46.271]
end_lonlat = [-124.718, 48.388]
checked = "2026-11-17"
season_basis = "primary"

[[hike.source]]
url = "https://pacificcoastaltrail.wordpress.com/2022/03/23/itinerary-washington-coast/"
publisher = "Lauren Lake, PacificCoastalTrail blog"
