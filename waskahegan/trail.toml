[hike]
summary = "The Waskahegan Trail runs through the countryside around Edmonton, Alberta, and the neighbouring areas east and south of the city. Volunteers built it largely across private land with landowners' permission, crossing fences by stiles. It offers day hikes from trailheads within an hour of Edmonton and some overnight stopovers and campgrounds."
