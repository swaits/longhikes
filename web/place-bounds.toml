# Where each state, province and territory is: the ground a place page's map opens on.
#
# One box per place the site has a page for (every key of olt/facets.py PLACE_GROUPS), as
# [west, south, east, north] in degrees (WGS 84), rounded to two decimals. olt/bounds.py reads this
# file; a group page takes the union of its members' boxes, and a place with no entry here keeps the
# map fitted to its trails. Nothing is fetched at build time or in the browser.
#
# Source: Natural Earth 1:10m Admin 1 - States, Provinces (ne_10m_admin_1_states_provinces,
# 2022 release), https://www.naturalearthdata.com/. Licence: public domain (Natural Earth's terms of
# use put no restriction on use, with or without credit). Each box is the extent of the place's
# polygons, leaving out small outlying islands (polygons under 1% of the place's largest) so that,
# for example, Hawaii's box is the main islands. Alaska's box is the mainland and the Alaska
# Peninsula only: the Aleutian Islands cross the antimeridian (longitude 180) and would make a box
# that wraps the world, and no trail is there. No box crosses the antimeridian.

