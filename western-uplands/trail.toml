length_gap_note = "The track is the main relation only, 69.8 km, 20.7% short of the published 88 km. OpenStreetMap holds six more relations for the Western Uplands Backpacking Trail: loops named Maggie Lake (5.5 km), Rain Lake (8.6 km) and Loft Lake (7.7 km), crosscuts named southern (8.3 km) and northern (5.4 km), and an approach from Highway 60 (0.4 km). They add about 36 km and are not included. Ontario Parks gives 88 km as the longest of its loops; which of these make up that loop was not checked."

[osm]
