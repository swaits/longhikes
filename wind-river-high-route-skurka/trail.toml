[hike]
summary = "Andrew Skurka's Wind River High Route follows the alpine crest of Wyoming's Wind River Range between Wind River Peak in the south and Downs Mountain in the north. It stays mostly between 10,000 and 12,000 feet, dropping into glacier-carved valleys past hundreds of lakes. Two thirds of it is off-trail, including a continuous stretch of 30 miles."
