# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "wind-river-highline-trail"
name = "Wind River Highline Trail"
country = "US"
regions = ["WY"]
length_km = 103
length_note = "64 mi, the minimum figure in White and Lorain's Best Backpacking Trips in Montana, Wyoming, and Colorado (2019, Trip 9, 'Wind River Highline Traverse', pages 184-216), which gives 124 mi with its recommended side trips and 8 to 15 days. The Forest Service names the ends of the Highline Trail but publishes no length for the whole trail. Douglas Lorain's Backpacking Wyoming (2010, Trip 35, 'Wind River Highline Trail') gives 72.5 mi. The Forest Service's trail data measures about 71 to 74 mi between the ends: 70.8 mi by way of the Fremont Trail and 74.3 mi along the Highline Trail's own tread south of where the two part. Big Sky Journal gives 64 mi for the same walk. Nearly all of it is the Continental Divide Trail."
tier = "regional"
designation = "The Highline Trail and the Fremont Trail (numbers 7094 and 7096 in the Forest Service's trail data), Bridger Wilderness, Bridger-Teton National Forest, from Green River Lakes to Big Sandy; the Forest Service names the ends but gives no length for the whole. Nearly all of it is the Continental Divide National Scenic Trail, a longer listed trail"
wave = 1

