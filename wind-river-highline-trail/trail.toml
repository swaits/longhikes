attribution = "none (no track included)"
osm_only = false
mainline = "No track was built. In the Forest Service's trail data the Highline Trail (trail_no 7094) and the Fremont Trail (trail_no 7096) run side by side for about the southern 36 miles and meet at one point. Green River Lakes to Big Sandy measures 74.3 mi along the Highline Trail the whole way and 70.8 mi by way of the Fremont Trail."
source_checked = "2026-11-18"
