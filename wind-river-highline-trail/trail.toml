[hike]
summary = "The Wind River Highline Trail runs the length of the Bridger Wilderness in Wyoming, from Green River Lakes south to Big Sandy, along a bench on the west side of the Wind River Range. The Forest Service says the Highline Trail follows the spine of the Continental Divide, and nearly all of this walk is the Continental Divide Trail. The Forest Service gives no length for the whole trail; White and Lorain give it as 64 miles at the minimum."
official_url = "https://www.fs.usda.gov/r04/bridger-teton/recreation/pinedale-ranger-district"
start = "Green River Lakes, Bridger-Teton National Forest, Wyoming"
start_lonlat = [-109.862, 43.313]
end = "Big Sandy Opening Trailhead, Wind River Range, Wyoming"
end_lonlat = [-109.271, 42.688]
shape = "point-to-point"
days = [8, 15]
season = "July to October"
months = [7, 8, 9, 10]
terrain = ["alpine", "lakes"]
travel = "trail"
permit = "The guidebook says no permit is required, with no fires above timberline, groups of 15 people or fewer, and no camping within 100 feet of streams or 200 feet of lakes or trails."
caution = "The guidebook's side trips off the trail need navigation and scrambling skills and are optional. It needs a car shuttle of about 107 miles between the ends, on access roads that can be rough and slippery after rain. Big Sky Journal advises checking with the Pinedale Ranger District which route the Highline Trail follows south of Pole Creek."
