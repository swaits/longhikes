[hike]
summary = "The Wyoming Range National Recreation Trail runs along the crest of the Wyoming Range in western Wyoming, from the Bryan Flat Guard Station, south of the Hoback River, south to Snider Basin at the South Piney Creek trailhead. Much of it is at 9,000 feet or above. Friends of the Bridger-Teton says it can be walked in either direction."
