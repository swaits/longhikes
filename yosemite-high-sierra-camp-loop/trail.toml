# Long-trail record. Field meanings: docs/schema.md in this repository.

id = "yosemite-high-sierra-camp-loop"
name = "High Sierra Camp Loop"
country = "US"
regions = ["CA"]
length_km = 78
length_note = "48.2 mi (77.6 km), as the National Park Service gives it on its Tuolumne Meadows backpacking trails page, with 6,450 ft (1,970 m) of elevation gain, for the loop that links Tuolumne Meadows to the Vogelsang, Merced Lake, Sunrise, May Lake and Glen Aulin High Sierra Camps. The loop is not one designated trail: the Park Service's page gives it no trailhead (\"various possibilities\"). Other publishers give other figures. Mike White and Douglas Lorain's Best Backpacking Trips in California and Nevada, Trip 3, page 53, gives 51.2 mi from the Soda Springs Trailhead, with a 3 mi side trip to Vogelsang Lake and Pass not counted. Yosemite Hospitality's page for the camps gives 49 mi. The start, days and season in this record are the book's, for its 51.2 mile version from the Soda Springs Trailhead; the Park Service gives the loop no single trailhead. The record keeps the Park Service's 48.2 mi as the length."
tier = "short"
designation = "A named loop on National Park Service trails in Yosemite National Park that the Park Service lists as the High Sierra Camp Loop; the loop itself is not one designated trail"
wave = 1
short_reason = "Very well known and popular: the Park Service describes it as a long loop through the most popular areas of Yosemite's high country, rates its permit demand High, and lists the High Sierra Camps it links as booked by lottery."
places_checked = "2026-11-20"

